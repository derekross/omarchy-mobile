# systemd 262's socket collector needs PIDFD_INFO_COREDUMP_SIGNAL (Linux 6.19).
# Gate before ExecCondition so older kernels do not hit a restart/start limit.
# The legacy pipe/socket collector remains available.
# https://github.com/systemd/systemd/issues/43963
[Unit]
ConditionKernelVersion=>=6.19
