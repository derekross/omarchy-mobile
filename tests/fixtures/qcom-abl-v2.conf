# SPDX-License-Identifier: MIT
# A stand-in qcom-abl-v2 descriptor for tests/boot-method and
# tests/images-layout: the boot keys of a Qualcomm ABL phone that boots one
# header-v2 boot.img (page 4096, the DTB appended to an
# "UNCOMPRESSED_IMG"-tagged Image), with a made-up codename, so the method is
# tested before any device ships a descriptor with it. A shipped descriptor
# with BOOT_METHOD=qcom-abl-v2 is tested as well when the tree has one.
CODENAME=v2test
FASTBOOT_PRODUCT=v2test
NAME="qcom-abl-v2 test device"
SOC=sm8150
COMPATIBLE="test,v2test"
PACKAGE=omamobile-device-v2test
DTB=qcom/v2test.dtb
PANEL_SIZE=1080x2400
BOOT_METHOD=qcom-abl-v2
BOOT_PAGESIZE=4096
CMDLINE="clk_ignore_unused pd_ignore_unused panic=10 console=tty0"
INITRAMFS_INIT=/initramfs/init
INITRAMFS_USB_RECOVERY=no
INITRAMFS_USERDATA_WAIT=300
BOOT_IMAGES=boot
UFS_RW=userdata
