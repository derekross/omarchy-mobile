# SPDX-License-Identifier: MIT
ListenAddress [fe80::b8e7%usb0]:2222
AddressFamily inet6
HostKey /run/grizzly-systemd/openssh-host-key
HostKeyAlgorithms ssh-ed25519
AuthorizedKeysFile /run/grizzly-systemd/authorized_keys
AllowUsers root
PermitRootLogin prohibit-password
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM yes
DisableForwarding yes
PermitUserRC no
PermitTTY no
PrintMotd no
ForceCommand /usr/bin/bash /run/grizzly-systemd/check.sh status
