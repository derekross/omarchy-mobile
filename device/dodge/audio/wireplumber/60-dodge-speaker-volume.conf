## dodge: default route volume for the built-in card.
## WirePlumber's global default is 0.064 linear (0.40 on the cubic scale wpctl
## shows), which with the amplifiers at their -30 dB cap is too quiet.
## 0.614 linear is 0.85 cubic, about -4 dB. The amplifier driver still enforces
## the hardware cap (attenuation >= 320). This applies only while no route
## volume is saved; a user change is remembered as usual.
## Install to /etc/wireplumber/wireplumber.conf.d/.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
      }
    ]
    actions = {
      update-props = {
        device.routes.default-sink-volume = 0.614
        # Without this the sources would fall back to the sink value above.
        device.routes.default-source-volume = 1.0
      }
    }
  }
]
