# Speaker or USB-C headphones on MultiMedia1, and the built-in mics.
# One back end at a time (hw_params fails with both mixers on), and
# never none: a front end with no back end cannot be opened (EINVAL).
# So the speaker route is the default and Headphones swaps it out. Amplifier gain stays at the driver default; the driver
# caps it (attenuation floor) until speaker protection and calibration exist.

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	# Amp Volume 703 is the driver's cap, attenuation 320 (about -30 dB).
	# This is the level heard at 11:39. The driver default, 323
	# (attenuation 700, about -66 dB), is inaudible.
	EnableSequence [
		cset "name='Left Amp Volume' 703"
		cset "name='Right Amp Volume' 703"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

# Built-in microphones: AMIC1 (WCD939x ADC1, SoundWire TX channel 0) and
# AMIC5 (ADC4, channel 3), both on MIC BIAS1, into TX decimators 0 and 1.
SectionDevice."Mic" {
	Comment "Internal microphones"

	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 10"
		cset "name='TX0 MODE' ADC_ULP"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='ADC4 MUX' CH4_AMIC5"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4 Volume' 10"
		cset "name='TX3 MODE' ADC_ULP"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC3"
		cset "name='TX_DEC1 Volume' 100"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}


# USB-C analog headphones: WCD939x HPH behind RX codec DMA 0. Plug
# detection comes from the Type-C stack (audio accessory mode).
SectionDevice."Headset" {
	Comment "Headset microphone"

	# USB-C analog headset: AMIC2 (MIC BIAS2) through the WCD939x USBSS,
	# ADC2 on TX SWR_MIC1, DEC0, one channel on hw:CARD,2. The path is
	# verified live with nothing plugged in (noise floor about -65 dBFS,
	# EIO with ADC2 off). The jack and MBHC still need the plug test.
	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC2_MIXER Switch' 1"
		# Select AMIC2 twice (disable, then AMIC2). A single write after
		# the Mic device sometimes leaves ADC2 silent until the mux moves.
		cset "name='ADC2 MUX' CH2_AMIC_DISABLE"
		cset "name='ADC2 MUX' CH2_AMIC2"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2 Volume' 10"
		cset "name='TX1 MODE' ADC_LP"
		cset "name='MBHC Switch' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='MBHC Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 MUX' CH2_AMIC_DISABLE"
		cset "name='TX SMIC MUX0' SWR_MIC0"
	]

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL_COMP Switch' 1"
		cset "name='HPHR_COMP Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='CLSH Switch' 1"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
		cset "name='CLSH Switch' 0"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

# Earpiece: the top (left) speaker in the stock Receiver profile, with the
# bottom amplifier muted. A profile change made while playing takes
# effect when the next stream is set up (hw_params).
SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='Right Amp Volume' 0"
		cset "name='Left Amp Volume' 703"
		cset "name='Left Amp Profile' Receiver"
	]

	DisableSequence [
		cset "name='Right Amp Volume' 703"
		cset "name='Left Amp Profile' Speaker"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}
