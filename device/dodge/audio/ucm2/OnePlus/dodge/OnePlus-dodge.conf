# OnePlus 13 (dodge): two Awinic speaker amplifiers on SECONDARY_MI2S_RX.
# Install as /usr/share/alsa/ucm2/OnePlus/dodge/ and link
# /usr/share/alsa/ucm2/conf.d/sm8750/OnePlus-dodge.conf to this file.
# Speakers, built-in microphones, USB-C headset and headset mic (plug untested) and earpiece.
Syntax 4

SectionUseCase."HiFi" {
	File "/OnePlus/dodge/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
