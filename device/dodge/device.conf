# SPDX-License-Identifier: MIT
# Device descriptor: OnePlus 13 (dodge). Format rules: device/cheetah/device.conf.
#
# Omarchy runs on slot B; stock stays on slot A. Day-2 kernel updates write
# boot_b. This PR ships the device files only: the inactive-slot installer and
# firmware-match helper are deferred. How this phone was installed (including
# the firmware copy already done and the GPT bit-54 mark) is a record in
# BRINGUP-M1.md, not a procedure for others. FASTBOOT_PRODUCT=sun is ABL
# getvar product. Never flash xbl/abl/vbmeta/modem from an image.

CODENAME=dodge
FASTBOOT_PRODUCT=sun
NAME="OnePlus 13"
SOC=sm8750
COMPATIBLE="oneplus,dodge"
PACKAGE=omamobile-device-dodge
BOOT_METHOD=qcom-abl

DTB=qcom/sm8750-oneplus-dodge.dtb
INITRAMFS_INIT=initramfs/init
PANEL_SIZE=1440x3168

BOOT_IMAGES=boot
UFS_RW="boot_b userdata"
OMAMOBILE_SLOT=b
CMDLINE="clk_ignore_unused pd_ignore_unused panic=10 console=tty0"
