# Drop-in: ModemManager runs only with the dodge modem flag, after the modem
# DSP, the SIM provisioning/online step and the stand-in net port are up.
[Unit]
ConditionPathExists=/etc/omamobile/modem-probe.enable
Wants=omamobile-modem.service omamobile-modem-online.service omamobile-mm-netport.service
After=omamobile-modem.service omamobile-modem-online.service omamobile-mm-netport.service
