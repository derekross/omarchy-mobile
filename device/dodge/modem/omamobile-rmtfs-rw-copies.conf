# Opt-in drop-in (not installed by ./install): lets rmtfs write the modem's
# EFS/NV changes to the COPIES in /var/lib/omamobile/modem-efs. No -r, so the
# MCFG and NV commits persist across boots. Still never -P (rmtfs then opens
# only <dir>/<file>, O_RDWR without O_CREAT, never /dev/disk/by-partlabel)
# and never -s (rmtfs would start/stop the modem remoteproc).
# Install: /etc/systemd/system/omamobile-rmtfs.service.d/60-rw-copies.conf
# Back up the copies first (2026-10-26-modem-efs-rw-73.md).
[Service]
ExecStart=
ExecStart=/usr/local/bin/rmtfs -o /var/lib/omamobile/modem-efs -v
