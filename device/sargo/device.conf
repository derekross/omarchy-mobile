# SPDX-License-Identifier: MIT
# Descriptor for the Google Pixel 3a (sargo), Qualcomm SDM670. Format rules:
# device/cheetah/device.conf. Notes and results: NOTES.md; the runbook:
# BRINGUP-M1.md.
#
# Boot (BOOT_METHOD=android-v2, docs/RELEASES.md §3): one header-v2
# boot.img with the DTB in its own section, laid out as stock's boot.img is
# (SP2A.220505.008, read with unpack_bootimg). This bootloader also needs:
#   - text_offset 0x80000 in the Image header: with mainline's 0 it refuses
#     the image ("Error verifying the received boot.img: Invalid Parameter");
#   - an LZ4-frame kernel, as stock's;
#   - qcom,msm-id <0x150 0x0> and qcom,board-id <0x0 0x0> on the DTB's
#     root, stock's own values, which it picks the DTB by;
#   - a sink for the labels its stock dtbo's overlays fix up: it merges the
#     overlay for this board into the DTB and refuses the boot when that
#     fails. `images` builds the sink from the owner's dtbo.img
#     (STOCK_DTBO=path, tools/dtbo-sink).
# After the merge the running board's root compatible is the overlay's
# ("google,b4s4-sdm670", which the Pixel 3a XL shares), not upstream's
# "google,sargo": COMPATIBLE is what the init and phone-smoke see.
#
# bin/omamobile fastboot, flash, push and the installer refuse android-v2
# until a slot-B install and this phone's CONTRIBUTING.md §3.1 entry are
# agreed: the Pixel 3a is a Qualcomm A/B phone, whose slot flags live in
# GPT attributes. The hand install of 2026-11-24 is in NOTES.md.
#
# Storage: the Pixel 3a boots from eMMC: every partition is on mmcblk0's
# user area. UFS_RW_LUNS names it, so the shared init guards it as it
# guards sda (whole-disk node removed, partitions by name), sets the
# eMMC's hardware boot areas read-only and removes its RPMB node.
#
# FASTBOOT_PRODUCT is ABL's `getvar product`.

CODENAME=sargo
FASTBOOT_PRODUCT=sargo
NAME="Pixel 3a"
SOC=sdm670
PACKAGE=omamobile-device-sargo
COMPATIBLE="google,b4s4-sdm670"
BOOT_METHOD=android-v2

DTB=qcom/sdm670-google-sargo.dtb
INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1080x2220

# Stock boot.img's header v2
PAGESIZE=4096
BASE=0x00000000
KERNEL_OFFSET=0x00008000
RAMDISK_OFFSET=0x01000000
TAGS_OFFSET=0x00000100
DTB_OFFSET=0x01f00000
OS_VERSION=12.0.0
OS_PATCH_LEVEL=2022-05
KERNEL_TEXT_OFFSET=0x80000
KERNEL_COMPRESSION=lz4
QCOM_MSM_ID="0x150 0x0"
QCOM_BOARD_ID="0x0 0x0"
DTBO_SINK=yes

BOOT_IMAGES=boot
UFS_RW="boot_b userdata"
UFS_RW_LUNS=mmcblk0
OMAMOBILE_SLOT=b
# Bring-up: with no USB host the initramfs stays up instead of panicking,
# so the boot log stays on the screen. Never in a release (bin/omamobile
# refuses).
INITRAMFS_USB_RECOVERY=no
# clk_ignore_unused, pd_ignore_unused and regulator_ignore_unused keep the
# bootloader's display powered for the simple framebuffer until msm takes
# the panel. For a RAM-only probe that stays in the initramfs, add
# omamobile.initramfs.
CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused regulator_ignore_unused panic=10"
