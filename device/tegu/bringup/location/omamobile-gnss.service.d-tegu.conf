# Pixel 9a (hand unit, 2026-10-30): the GNSS stack is the modem profile plus gnss-slsi.
[Unit]
ConditionPathExists=
ConditionPathExists=/usr/lib/omamobile-vendor/gnss-slsi/root
[Service]
ExecStart=
ExecStart=/usr/bin/systemd-inhibit --what=sleep --mode=block "--who=Omarchy Mobile GNSS" "--why=A location session is running" /usr/local/sbin/tegu-gnss-start
ExecStop=
ExecStop=/usr/lib/omamobile-vendor/omamobile-vendor-chroot gnss-slsi stop
TimeoutStartSec=240
