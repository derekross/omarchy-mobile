# Pixel 9a (hand unit, 2026-10-30): the NMEA FIFO is the gnss-slsi profile state.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c "for i in $(seq 1 900); do [ -p /var/lib/omamobile-vendor/gnss-slsi/data/vendor/gps/nmea_out ] && exit 0; sleep 0.2; done; exit 1"
ExecStart=
ExecStart=/usr/lib/omamobile-vendor/omamobile-gnss-nmea --fifo /var/lib/omamobile-vendor/gnss-slsi/data/vendor/gps/nmea_out --idle-exit 60
ReadWritePaths=-/var/lib/omamobile-vendor/gnss-slsi/data/vendor/gps -/run/omamobile-gnss
TimeoutStartSec=240
