# SPDX-License-Identifier: MIT
# Guarded SM8150 descriptor for Google Pixel 4 XL (coral).
# coral uses Android boot image header v2 (boot + dtbo, no vendor_boot or
# init_boot) and Qualcomm qcom,msm-id / qcom,board-id DTB matching, so the
# Tensor android-v4 packer/installer paths refuse BOOT_METHOD=android-v2 before
# touching a phone.
CODENAME=coral
NAME="Google Pixel 4 XL"
SOC=sm8150
COMPATIBLE="google,coral"
BOOT_METHOD=android-v2
BOOT_IMAGES=""
UFS_RW=""
PANEL_SIZE=1440x3040
