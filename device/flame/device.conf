# RAM-only first light through a temporary U-Boot stage. The generic image,
# flash, push and installer paths refuse this descriptor. No writable storage.
# Use tools/build-flame-probe; persistent installation is deferred.
CODENAME=flame
NAME="Google Pixel 4"
SOC=sm8150
COMPATIBLE="google,floral-sm8150"
BOOT_METHOD=ram-only
BOOT_IMAGES=""
UFS_RW=""
PANEL_SIZE=1080x2280
