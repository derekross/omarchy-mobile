# SPDX-License-Identifier: MIT
# Explicit opt-in development profile: DEVICE=flame FLAME_NATIVE=1.
# The default device/flame/device.conf remains RAM-only.
# Experimental U-Boot layout. Requires a locally built, reviewed loader and
# a separately tested native root. No Tensor images or DTBO are written.
CODENAME=flame
NAME="Google Pixel 4"
SOC=sm8150
COMPATIBLE="google,floral-sm8150"
BOOT_METHOD=uboot-ext4
BOOT_IMAGES="boot"
UFS_RW="boot_b userdata"
PANEL_SIZE=1080x2280
PACKAGE=omamobile-device-flame
