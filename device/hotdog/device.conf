# SPDX-License-Identifier: MIT
# Device descriptor: OnePlus 7T Pro (hotdog). Format rules: device/cheetah/device.conf.
#
# A Qualcomm A/B phone whose slot flags live in the GPT of the boot LUN.
# A slot switch on this phone once moved the UFS boot LUN onto mismatched
# bootloader firmware and took a full EDL restore, so Omarchy Mobile never
# touches slots here: there is no stock slot to fall back to, slot B is left
# as it is, and Omarchy boots from boot_a. The boot image is written only by
# a human, by fastboot, after it has RAM-booted (BRINGUP-M1.md); bin/omamobile
# flash, push and fastboot refuse this BOOT_METHOD. Never flash xbl, abl,
# dtbo, vbmeta, modem, persist, modemst*, fsg, fsc, param or devinfo.

# --- Identity ---
CODENAME=hotdog
FASTBOOT_PRODUCT=msmnile
NAME="OnePlus 7T Pro"
SOC=sm8150
COMPATIBLE="oneplus,hotdog"
PACKAGE=omamobile-device-hotdog

# --- Kernel and device tree ---
DTB=qcom/sm8150-oneplus-hotdog.dtb
PANEL_SIZE=1440x3120

# --- Boot image ---
# ABL boots one header-v2 boot.img (page 4096, offsets on base 0) with the
# DTB appended to an "UNCOMPRESSED_IMG"-tagged Image. dtbo_a stays erased:
# ABL applies stock's overlays to any DTB it finds there, and the kernel
# refuses the result. The command line goes in the header; ABL appends its
# androidboot.* words. No splash yet: the console shows the init's lines.
BOOT_METHOD=qcom-abl-v2
BOOT_PAGESIZE=4096
CMDLINE="clk_ignore_unused pd_ignore_unused panic=10 console=tty0"
INITRAMFS_INIT=/initramfs/init
# The init's "no USB host" crash hands over to stock on a Pixel's slot A;
# here it would restart the same image, so the init stays up instead
INITRAMFS_USB_RECOVERY=no
# UFS can come up late after a RAM boot from the fastboot screen (userdata
# 50 s after SSH once): wait for it, as the kernel's rootwait would
INITRAMFS_USERDATA_WAIT=300
# No DTB_OVERLAYS by default. overlays/mic.dtso is the gated microphone
# bring-up (MIC-PLAN.md M3): set DTB_OVERLAYS="mic" here locally for that
# test image only.

# --- Storage guard ---
# userdata (the Arch root) is on sda, the main LUN; boot_a/boot_b are on
# sde, which stays read-only. Linux writes no boot partition.
BOOT_IMAGES=boot
UFS_RW=userdata
