# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 8 Pro (husky). Community port; zuma is
# shared with the Pixel 8 (shiba) and 8a (akita, issue #1).
#
# Values come from read-only queries of a retail phone, its live device
# tree and the stock CP3A.261005.005 images; see NOTES.md. Values marked
# [I] are inferences still to confirm on a phone. Format and keys:
# docs/RELEASES.md and device/cheetah/device.conf. No shell: data only.
#
# Needs the zuma kernel (derekross/linux-omarchy-mobile#13, with the PMU,
# USB PHY and watchdog drivers already merged). bin/omamobile and
# install-phone read SOC_COMPATIBLE and AVB_FOOTERS below (#27). PACKAGE
# below is the storage guard's udev rule and the USB address, as for felix.
# tools/build-rootfs needs it in the signed [omamobile] repository before it
# can build husky's Omarchy image. Until then install-phone installs only
# the U3 test image (UFS-PLAN.md), built by device/husky/build-u3-root.

# --- Identity ---
CODENAME=husky
NAME="Pixel 8 Pro"
SOC=zuma
# Stock's root compatible is "google,ZUMA HUSKY", "google,ZUMA"; ours
# follows the upstream gs101 style, and the init's board check matches it
# (BRINGUP-M1 test 21).
COMPATIBLE="google,zuma-husky"
PACKAGE=omamobile-device-husky

# --- Kernel and device tree ---
DTB=exynos/google/zuma-husky.dtb
# zuma's ABL does not match base DTBs on /soc_id: stock's four base DTBs
# (in vendor_kernel_boot) have none. Each carries a /soc_compatible node
# instead, one child per silicon revision and package with product_id,
# major, minor and pkg_mode; this phone boots the B0/B1 FOPLP one
# (NOTES.md, part 4). As label:product_id:major:minor:pkg_mode, one
# /soc_compatible child each (#27):
SOC_COMPATIBLE="b0-foplp:0x9865:1:0:0 b1-foplp:0x9865:1:1:0"
# zuma's vbmeta chains boot and init_boot, and ABL, even unlocked, refuses
# either with no AVB footer (BRINGUP-M1 tests 6-8). Sizes from fastboot
# getvar partition-size:<image>_b; the rollback index and security patch
# are stock's footer values (CP3A.261005.005). Read by bin/omamobile from #27.
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
AVB_ROLLBACK_INDEX=1791158400
AVB_SECURITY_PATCH=2026-10-05

# --- Bootloader glue ---
# Stock dtbo.img has 19 entries; a retail MP1.0 husky boots entry 8,
# 0x40206/0x10000 (androidboot.dtbo_idx = 8 on Android 16 and 17).
DTBO_SOURCE=husky-m1-overlay.dts
DTBO_BOARD_ID=0x40206
DTBO_BOARD_REV=0x10000
# The live DT's uart0 alias is /uart@10870000 (samsung,exynos-uart); stock
# boots console=ttynull. The rest is cheetah's line, unchanged [I].
VENDOR_CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
# vendor_boot and vendor_kernel_boot: header v4, page size 0x800. The
# init_boot header carries the OS version and patch level (Android 17,
# 2026-10, the build on both slots).
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10

# --- Storage guard ---
# The same five slotted boot images as cheetah (fastboot getvar all).
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

# --- Initramfs ---
# The shared init, which takes the guard's allowlist from UFS_RW above.
# SIMPLEFB_TRIG_CON is the only display-register write packed into this
# phone's initramfs: DECON0 TRIG_CON (0x19470030), read 0x3070 at handover
# (the trigger masked, as on cheetah). 0x3061 clears HW_TRIG_MASK_DECON
# (bit 4) and sets HW_TRIG_EN (bit 0), so simplefb's frames reach the
# command-mode panel. No BRINGUP_PROBE: its addresses are gs201's.
INITRAMFS_INIT=/initramfs/init
SIMPLEFB_TRIG_CON="0x19470030 0x3061"
# Native panel mode (dumpsys display); Android's default is 1008x2244.
PANEL_SIZE=1344x2992
