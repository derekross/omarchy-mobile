# SPDX-License-Identifier: MIT
CODENAME=bluejay
NAME="Pixel 6a"
SOC=gs101
COMPATIBLE="google,gs101-bluejay"
PACKAGE=omamobile-device-bluejay
DTB=exynos/google/gs101-bluejay.dtb
SOC_IDS="b0:0x9845001 a0:0x9845000"
DTBO_SOURCE=bluejay-m1-overlay.dts
DTBO_BOARD_ID=0x20506
DTBO_BOARD_REV=0x10000
# Leave the retail UART alone for first light: raven's first two early
# hangs used earlycon before its UART was clocked (raven/BRINGUP-M1.md §7).
# This is a precaution from the sibling board, not a bluejay test result.
VENDOR_CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10
AVB_FOOTERS="boot:0x4000000"
AVB_ROLLBACK_INDEX=1791158400
AVB_SECURITY_PATCH=2026-10-05
BOOT_IMAGES="boot vendor_boot dtbo"
UFS_RW="boot_b vendor_boot_b dtbo_b userdata"
INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1080x2400
# Development integration: updates must not write the boot partitions.
BOOT_UPDATE_AUTO_WRITE=no
