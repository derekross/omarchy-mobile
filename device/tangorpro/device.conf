# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel Tablet (tangorpro), first light.
#
# Same rules as device/cheetah/device.conf. No shell.

# --- Identity ---
CODENAME=tangorpro
NAME="Pixel Tablet"
USB_PRODUCT="Pixel Tablet (M1)"
SOC=gs201
COMPATIBLE="google,gs201-tangorpro"
# Storage guard and USB networking only, once the package exists. It has
# no bootctl source yet, so the initramfs gets the freestanding devmem and
# reboot-to, as on felix.
PACKAGE=omamobile-device-tangorpro

# --- Kernel and device tree ---
DTB=exynos/google/gs201-tangorpro.dtb
# gs201 B0 is soc_id 0x9855001, as on panther and cheetah: the bootloader
# took this DTB on the first boot (BRINGUP-M1.md). The packer writes an A0
# copy too.
SOC_IDS="b0:0x9855001 a0:0x9855000"
# No DTB_OVERLAYS by default. touch.dtso is the gated touch boot
# (TOUCH-PLAN.md): DTB_OVERLAYS="touch" for that image only.

# --- Bootloader glue ---
# Retail tablet: fastboot getvar hw-revision MP1.0. The stock dtbo.img of
# CP1A.260505.005 has seven entries; the MP board is id 0x30706, rev
# 0x10000 (Google's GPL gs201-tangorpro-mp.dts, model "GS201 TANGORPRO
# MP"); the bootloader applied it on the first boot.
DTBO_SOURCE=tangorpro-m1-overlay.dts
DTBO_BOARD_ID=0x30706
DTBO_BOARD_REV=0x10000
# Stock vendor_boot: header v4, page size 0x800, earlycon on the same
# UART as the other gs201 Pixels.
VENDOR_CMDLINE="console=tty0 earlycon=exynos4210,0x10A00000 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
# Stock CP1A.260505.005, security patch 2026-05-05 (boot.img's AVB props:
# os_version 16).
OS_VERSION=16.0.0
OS_PATCH_LEVEL=2026-05
# Stock's vbmeta.img chains boot (rollback index location 2) and
# init_boot (location 4), as on panther and cheetah, so slot B's images
# carry footers (issue #342). Sizes from fastboot getvar partition-size.
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
# Stock CP1A.260505.005's footers (avbtool info_image boot.img and
# init_boot.img: rollback index 1777939200, security patch 2026-05-05).
# Never raised: a higher stored index would lock stock's slot A images out.
AVB_ROLLBACK_INDEX=1777939200
AVB_SECURITY_PATCH=2026-05-05

# --- Storage guard ---
# All five images exist on slot B (fastboot getvar all: has-slot yes, same
# sizes as panther). UFS stays disabled in the first-light DTS; the guard
# is packed regardless.
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

# --- Initramfs ---
# No SIMPLEFB_TRIG_CON: the tablet's LCD (BOE ts110f5mlg0 or CSOT
# ppa957db2d) runs in DSI video mode (MIPI_DSI_MODE_VIDEO in Google's GPL
# panel drivers), so DECON scans the bootloader's buffer continuously and
# needs no trigger. No BRINGUP_PROBE.
INITRAMFS_INIT=/initramfs/init
# Panel, portrait (Google's display DTS: mode 1600x2560).
PANEL_SIZE=1600x2560

# --- Radio backup ---
# No modem. NV_PARTS stays empty until the partition list from stage 0
# shows which of efs/persist exist on this board.
