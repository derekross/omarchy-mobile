# SPDX-License-Identifier: MIT
# TEMPORARY local RAM-test descriptor. Do not commit as a supported device.
CODENAME=komodo
NAME="Google Pixel 9 Pro XL RAM test"
USB_PRODUCT="Komodo Omarchy RAM test"
SOC=zumapro
COMPATIBLE="google,zumapro-komodo"
PACKAGE=omamobile-device-komodo
DTB=exynos/google/zumapro-komodo.dtb
SOC_COMPATIBLE="a0-foplp:0x9875:0:0:0 a1-foplp:0x9875:0:1:0"
DTB_OVERLAYS="usb2-gadget-test decon-stage2-test synaptics-touch-test wifi-host-test gpu-test"
DTBO_SOURCE=komodo-mp-test.dts
DTBO_BOARD_ID=0x60806
DTBO_BOARD_REV=0x10000
VENDOR_CMDLINE="console=tty0 fbcon=font:TER16x32 clk_ignore_unused pd_ignore_unused bootconfig omamobile.debug gs_decon.stage=2 gs_decon.fbdev=1 modprobe.blacklist=panthor"
USB_SWITCH="108d0000.i2c 0x25"
INITRAMFS_I2C_TOOLS=1
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-11
BOOT_METHOD=android-v4
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
AVB_ROLLBACK_INDEX=0
AVB_SECURITY_PATCH=2026-11-05
INITRAMFS_INIT=/initramfs/init
INITRAMFS_ROOT_LABEL=omamobile-root
# Development handoff: try the installed rootfs; if absent or unhealthy,
# remain in RAM rescue. Do not use release-mode auto-growth during bring-up.
INITRAMFS_ROOT_MODE=persistent-development
PANEL_SIZE=1344x2992
