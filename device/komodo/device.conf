# SPDX-License-Identifier: MIT
# Pixel 9 Pro XL first-light target; see README.md.
CODENAME=komodo
NAME="Pixel 9 Pro XL"
USB_PRODUCT="Pixel 9 Pro XL (M1)"
SOC=zumapro
COMPATIBLE="google,zumapro-komodo"
PACKAGE=omamobile-device-komodo

DTB=exynos/google/zumapro-komodo.dtb
# ABL selects this family through /soc_compatible rather than /soc_id.
# Four selector tuples were observed in the retained stock base DTBs;
# the physical phone's FOPLP/IPOP package is not yet identified (NOTES.md).
SOC_COMPATIBLE="a0-foplp:0x9875:0:0:0 a1-foplp:0x9875:0:1:0 a0-ipop:0x9875:0:0:1 a1-ipop:0x9875:0:1:1"
DTBO_SOURCE=komodo-m1-overlay.dts
# Google caimito commit 38a058681d6cefbb95200dc8a5348939773eb9d6,
# dts/zumapro-komodo-mp.dts lines 17-18 (board_id / board_rev):
# https://android.googlesource.com/kernel/devices/google/caimito/+/38a058681d6cefbb95200dc8a5348939773eb9d6/dts/zumapro-komodo-mp.dts#17
DTBO_BOARD_ID=0x60806
DTBO_BOARD_REV=0x10000
# The retained stock vendor_boot v4 header has an empty vendor command line.
# The shared image builder requires a nonempty bring-up line. Keep only the
# existing G4 bring-up flags; forwarding by ABL remains unverified (NOTES.md).
VENDOR_CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
# Read-only slot-A boot/init_boot capture, 2026-11-09: both Android v4
# headers report OS 17.0.0 / 2026-10; AVB properties report 2026-10-05.
# See NOTES.md for provenance and the limitations of this development phone.
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10
BOOT_METHOD=android-v4
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"
# Sizes are current unique-PARTNAME sysfs observations, not fastboot getvar
# evidence. All-five footer necessity remains unproven; see FIRST-LIGHT.md.
# No new image boot until the maintainer resolves that policy and recovery.
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000 vendor_boot:0x4000000 vendor_kernel_boot:0x4000000 dtbo:0x1000000"
# AOSP avbtool info_image on retained slot-A boot and init_boot, read-only
# capture 2026-11-09: Algorithm NONE, rollback index 0, location 0.
# This is not the old development-image test-key policy or its index.
AVB_ROLLBACK_INDEX=0
AVB_SECURITY_PATCH=2026-10-05

# Confirmed exact PARTNAME labels on 2026-11-09, all read-only. Only the
# six NV partitions are invariant checks; devinfo is retained but may change
# through the bootloader. No unobserved metadata/Trusty partition is inferred.
NV_PARTS="efs efs_backup modem_userdata persist modem_a modem_b"
NV_BACKUP_EXTRA="devinfo"

INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1344x2992
