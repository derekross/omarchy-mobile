# SPDX-License-Identifier: MIT
# Pixel 9 Pro XL first-light target; see README.md.
CODENAME=komodo
NAME="Pixel 9 Pro XL"
USB_PRODUCT="Pixel 9 Pro XL (M1)"
SOC=zumapro
COMPATIBLE="google,zumapro-komodo"
PACKAGE=omamobile-device-komodo

DTB=exynos/google/zumapro-komodo.dtb
# ABL selects this family through /soc_compatible rather than /soc_id.
SOC_COMPATIBLE="a0-foplp:0x9875:0:0:0 a1-foplp:0x9875:0:1:0 a0-ipop:0x9875:0:0:1 a1-ipop:0x9875:0:1:1"
DTBO_SOURCE=komodo-m1-overlay.dts
DTBO_BOARD_ID=0x60806
DTBO_BOARD_REV=0x10000
VENDOR_CMDLINE="console=tty0 splash plymouth.graphical plymouth.force-scale=1 vt.global_cursor_default=0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10
BOOT_METHOD=android-v4
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"
# Reference AVB footer geometry and rollback metadata for this boot layout.
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000 vendor_boot:0x4000000 vendor_kernel_boot:0x4000000 dtbo:0x1000000"
AVB_ROLLBACK_INDEX=1791158400
AVB_SECURITY_PATCH=2026-10-05

INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1344x2992
