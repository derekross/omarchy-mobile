# SPDX-License-Identifier: MIT
# Guarded SDM845 descriptor for the OnePlus 6 (enchilada). Format rules:
# device/cheetah/device.conf. Notes and the state of each slot: NOTES.md.
#
# RAM-only bring-up: this ABL boots an Android boot image header v0 holding
# a gzip kernel with the DTB appended (no dtbo, no vendor_boot), booted with
# `fastboot boot`, so nothing is written. `omamobile images` packs that
# boot.img from the header fields below (tests/images-layout); fastboot,
# flash, push and the installer refuse BOOT_METHOD=android-v0 before
# touching a phone (tests/boot-method), and keep refusing it until the
# slot-B install and its CONTRIBUTING.md §3.1 entry are agreed.
#
# Storage: userdata is on sda, but boot_* sit on LUN sde, so the shared
# init's sda-only guard keeps boot_b read-only (the same split as dodge).
# Never flash xbl/abl/vbmeta/modem/persist from an image.
#
# FASTBOOT_PRODUCT=sdm845 is ABL's `getvar product`: the SoC's name, which
# other SDM845 phones report too, so it never identifies this phone alone.

CODENAME=enchilada
FASTBOOT_PRODUCT=sdm845
NAME="OnePlus 6"
SOC=sdm845
COMPATIBLE="oneplus,enchilada"
BOOT_METHOD=android-v0

DTB=qcom/sdm845-oneplus-enchilada.dtb
INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1080x2280

# Header v0 layout this ABL accepts, from a boot image known to boot it
PAGESIZE=4096
BASE=0x00000000
KERNEL_OFFSET=0x00008000
RAMDISK_OFFSET=0x01000000
SECOND_OFFSET=0x00f00000
TAGS_OFFSET=0x00000100

BOOT_IMAGES=boot
UFS_RW="boot_b userdata"
OMAMOBILE_SLOT=b
# The first-light kernel builds the USB gadget as modules (USB_CONFIGFS=m)
INITRAMFS_MODULES="libcomposite u_ether usb_f_ncm u_serial usb_f_acm"
# omamobile.initramfs: stay in the initramfs; RAM-only, nothing is mounted rw
CMDLINE="console=tty0 panic=10 omamobile.initramfs omamobile.ufs-probe"
