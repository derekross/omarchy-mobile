# SPDX-License-Identifier: MIT
# Guarded SDM845 descriptor for the OnePlus 6 (enchilada). Format rules:
# device/cheetah/device.conf. Notes and the state of each slot: NOTES.md.
#
# This ABL boots an Android boot image header v0 holding a gzip kernel with
# the DTB appended (no dtbo, no vendor_boot). `omamobile images` packs that
# boot.img from the header fields below (tests/images-layout). The slot-B
# install is tools/install-phone (boot_b and userdata, then set-active b);
# its CONTRIBUTING.md §3.1 entry names the one GPT write that marks boot_b
# successful, by hand, once per install.
#
# Storage: userdata is on sda, but boot_* sit on LUN sde. UFS_RW_LUNS=sde
# has the init guard sde as it guards sda, leaving only boot_b writable
# there, and push looks for boot_b on sde too.
# Never flash xbl/abl/vbmeta/modem/persist from an image.
#
# FASTBOOT_PRODUCT=sdm845 is ABL's `getvar product`: the SoC's name, which
# other SDM845 phones report too, so it never identifies this phone alone.

CODENAME=enchilada
FASTBOOT_PRODUCT=sdm845
NAME="OnePlus 6"
SOC=sdm845
COMPATIBLE="oneplus,enchilada"
BOOT_METHOD=android-v0

DTB=qcom/sdm845-oneplus-enchilada.dtb
INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1080x2280

# Header v0 layout this ABL accepts, from a boot image known to boot it
PAGESIZE=4096
BASE=0x00000000
KERNEL_OFFSET=0x00008000
RAMDISK_OFFSET=0x01000000
SECOND_OFFSET=0x00f00000
TAGS_OFFSET=0x00000100

BOOT_IMAGES=boot
UFS_RW="boot_b userdata"
UFS_RW_LUNS=sde
# CONTRIBUTING.md §3.1: boot_b is entry 38 of sde's 96, 4096-byte sectors,
# last LBA 786431; tools/mark-slot-b sets its bit 54 in these four sectors.
SLOT_B_MARK="sde boot_b 1 3 786428 786431"
OMAMOBILE_SLOT=b
# The first-light kernel builds the USB gadget as modules (USB_CONFIGFS=m)
INITRAMFS_MODULES="libcomposite u_ether usb_f_ncm u_serial usb_f_acm"
# The init hands off to the Arch root on userdata. A RAM-only `fastboot boot`
# for bring-up adds omamobile.initramfs (stay in the initramfs) by hand.
CMDLINE="console=tty0 panic=10"
