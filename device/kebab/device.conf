# SPDX-License-Identifier: MIT
# Device descriptor: OnePlus 8T (kebab), SM8250 / Snapdragon 865.
#
# RAM-only bring-up descriptor (NOTES.md). BOOT_METHOD stays android-v0 so
# that flash, push, fastboot and the installer refuse this phone until a
# slot-B install has its CONTRIBUTING.md 3.1 entry. But this ABL does NOT
# take enchilada's header-v0 image: it needs header v2 with the DTB section
# at 0x01f00000 and a gzip kernel (first light, 2026-11-27), which `images`
# can't pack yet, so test images are packed by hand for now.
# Format rules as in cheetah/device.conf: KEY=value lines, no shell.

# --- Identity ---
CODENAME=kebab
NAME="OnePlus 8T"
SOC=sm8250
COMPATIBLE="oneplus,kebab"
# Minimal device package (reboot-to, USB networking, sshd), cloned from
# dodge's. It has no bootctl, so initramfs takes the freestanding-devmem path.
PACKAGE=omamobile-device-kebab

# --- Boot ---
BOOT_METHOD=android-v0
# The DTB comes from the sm8250-mainline tree (device/kebab/dts/); linux
# mainline does not carry it. Built from the kernel tree it is dropped into.
DTB=qcom/sm8250-oneplus-kebab.dtb
BOOT_IMAGES=boot
# Slot B's boot image and userdata only (the guard allowlist). Slot A holds
# a third-party Android build (NOTES.md, slots).
UFS_RW="boot_b userdata"
INITRAMFS_INIT=/initramfs/init
# The simple-framebuffer node is 1080x2376; the panel is 1080x2400.
PANEL_SIZE=1080x2400

# Load offsets from the stock boot image's header: base 0,
# kernel 0x8000, ramdisk 0x01000000, tags 0x100, 4096-byte pages.
PAGESIZE=4096
BASE=0x00000000
KERNEL_OFFSET=0x00008000
RAMDISK_OFFSET=0x01000000
SECOND_OFFSET=0x00000000
TAGS_OFFSET=0x00000100

INITRAMFS_MODULES="libcomposite u_ether usb_f_ncm u_serial usb_f_acm"
# The command line boot_b boots with: Omarchy's splash from the initramfs,
# then Plymouth at scale 1 (as raven, husky and akita), kernel messages off
# the screen. For the RAM-only probe add omamobile.initramfs and drop splash.
CMDLINE="console=tty0 quiet splash plymouth.graphical plymouth.force-scale=1 vt.global_cursor_default=0 clk_ignore_unused pd_ignore_unused panic=10"
