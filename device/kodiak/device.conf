# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 11 Pro XL (kodiak).
#
# Everything bin/omamobile (and, later, the device package and the release
# tooling) needs to know about one phone, in one place. docs/RELEASES.md
# describes each key. Format: KEY=value or KEY="value" lines, comments and
# blank lines only. No shell: no $, backticks or command substitution, so
# other tools (Python, the pacman hook, the initramfs) can read it as data.
# bin/omamobile refuses a descriptor that breaks these rules.

# --- Identity ---
CODENAME=kodiak
NAME="Pixel 11 Pro XL"
USB_PRODUCT="Pixel 11 Pro XL"
SOC=mbu
# First string of the DT root compatible (from stock vendor_kernel_boot DTB).
COMPATIBLE="google,mbu"
PACKAGE=omamobile-device-kodiak
ROOTFS_PACKAGES=""

# --- Kernel and device tree ---
# Placeholder until a mainline DTB exists for malibu/kodiak.
DTB=exynos/google/gs-kodiak.dtb
DTB_OVERLAYS=""
SOC_IDS=""

# --- Bootloader glue ---
# Stock dtbo_idx from getprop ro.boot.dtbo_idx = 37.
DTBO_SOURCE=kodiak-overlay.dts
DTBO_BOARD_ID=0x25
DTBO_BOARD_REV=0x0
VENDOR_CMDLINE="console=tty0 earlycon printk.devkmsg=on"
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-09
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
AVB_ROLLBACK_INDEX=0
AVB_SECURITY_PATCH=2026-09-01

# --- Storage guard ---
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

# --- Initramfs ---
INITRAMFS_INIT=/initramfs/init
SIMPLEFB_TRIG_CON=""
BRINGUP_PROBE=1
# Panel size unknown yet; stock display is Verisilicon DC9x00.
PANEL_SIZE=unknown
