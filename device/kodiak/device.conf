# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 11 Pro XL (kodiak, Tensor G6 / malibu).
# Values come from read-only queries of a retail phone, its stock DTB
# (vendor_kernel_boot) and the stock CD1A.260905.001.B1 images; see NOTES.md.
# No malibu kernel exists yet, so DTB and DTBO_SOURCE are placeholders.

# --- Identity ---
CODENAME=kodiak
NAME="Pixel 11 Pro XL"
USB_PRODUCT="Pixel 11 Pro XL (M1)"
SOC=malibu
COMPATIBLE="google,mbu"
PACKAGE=omamobile-device-kodiak

# --- Kernel and device tree ---
# Path to be confirmed once a malibu tree exists.
DTB=google/malibu-kodiak.dtb
# Stock DTB has a /soc_compatible node with one child (A0).
# Format: label:product_id:major:minor:pkg_mode
SOC_COMPATIBLE="A0:0x06:0x00:0x00:0x00"

# --- Bootloader glue ---
# Overlay source to be written later.
DTBO_SOURCE=kodiak-m1-overlay.dts
# Confirmed from factory dtbo.img entry 37.
DTBO_BOARD_ID=0x80406
DTBO_BOARD_REV=0x10000
# Inference: husky's line. Console UART on malibu not yet confirmed.
VENDOR_CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-09

# --- AVB ---
# vbmeta chains boot (loc 2) and init_boot (loc 4).
# Sizes from fastboot getvar partition-size:*_b; rollback and patch from stock footers.
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
AVB_ROLLBACK_INDEX=1788220800
AVB_SECURITY_PATCH=2026-09-01

# --- Storage guard ---
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

# --- Initramfs ---
INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1344x2992
