# Device descriptor: Xiaomi Mi 8 (dipper). Every value below is read off the
# phone itself (live device tree, boot image header, /proc/partitions) or from
# the running stock kernel; nothing is copied from another board.
CODENAME=dipper
NAME="Xiaomi Mi 8"
SOC=sdm845
# Matches the board DTS this port carries (sdm845-xiaomi-dipper.dts).
COMPATIBLE="xiaomi,dipper"
# Android boot image header v1, page size 4096, second_size 0, and two ~480 KB
# FDTs concatenated at the end of the kernel blob: the DTB is appended to the
# kernel and ABL picks one by qcom,msm-id / qcom,board-id.
BOOT_METHOD=android-v1-appended-dtb
BOOT_PAGESIZE=0x1000
PACKAGE=omamobile-device-dipper
ROOTFS_PROFILE=dipper
ROOTFS_PACKAGES="qrtr pd-mapper tqftpserv rmtfs"
# Arch repository packages only. Wi-Fi also needs the Qualcomm IPC daemons
# (qrtr, rmtfs, tqftpserv, pd-mapper), which exist as AUR PKGBUILDs rather than
# repository packages, so they have to be built for aarch64 like our own
# packages -- they cannot be listed here. See WIFI-PLAN.md.
ROOTFS_DIST_PACKAGES="vulkan-freedreno linux-firmware-qcom linux-firmware-atheros"
# Set once the kernel is built; the port has no kernel release yet.
KERNEL_RELEASE=
# dipper is NOT A/B for the OS: one `boot`, one `system`, one `userdata`, plus a
# `recovery` partition. Only the bootloader chain is slotted (xbl/abl/tz/hyp/...),
# and this port never writes any of it. So there is no `_b` suffix anywhere here
# and no fallback slot: see NOTES.md.
BOOT_IMAGES="boot"
UFS_RW="userdata"
# 0x438 x 0x8c8 from the active panel node (Samsung EA8074, notch, cmd mode, 60 Hz).
PANEL_SIZE=1080x2248
MONITOR_SCALE=2.25
