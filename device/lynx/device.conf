# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 7a (lynx), first light.
#
# Same rules as device/cheetah/device.conf. No shell.

# --- Identity ---
CODENAME=lynx
NAME="Pixel 7a"
SOC=gs201
COMPATIBLE="google,gs201-lynx"
# Not written yet. First light needs only the boot images.
PACKAGE=omamobile-device-lynx

# --- Kernel and device tree ---
DTB=exynos/google/gs201-lynx.dtb
# lynx's SoC is the IPOP package (ro.boot.hw.soc.pkg_mode 1), and ABL
# matched stock's b0_v2-ipop DTB on /soc_compatible, not on /soc_id. The
# stock vendor_kernel_boot carries a0, b0 and B0_IPOP; the live tree is
# B0_IPOP.
SOC_COMPATIBLE="b0-ipop:0x9855:1:0:1"
# No DTB_OVERLAYS yet. New nodes stay disabled until an overlay enables them.

# --- Bootloader glue ---
# ro.boot.cdt_hwid 0x00030506 00010000, ro.boot.dtbo_idx 9; entry 9 of the
# stock dtbo.img is id 0x30506, rev 0x10000.
DTBO_SOURCE=lynx-m1-overlay.dts
DTBO_BOARD_ID=0x30506
DTBO_BOARD_REV=0x10000
VENDOR_CMDLINE="console=tty0 earlycon=exynos4210,0x10A00000 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-07
# vbmeta chains boot and init_boot (stock: SHA256_RSA4096 footers), and
# lynx's ABL, unlocked, stops before the orange warning on slot B images
# with no footer. Sizes from fastboot getvar partition-size; rollback index
# and security patch from stock's footers (avbtool info_image).
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
# Never above stock's: a higher index the bootloader stores would lock
# stock's own boot and init_boot out of slot A (anti-rollback).
AVB_ROLLBACK_INDEX=1783209600
AVB_SECURITY_PATCH=2026-07-05

# --- Storage guard ---
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

# --- Initramfs ---
# Shared script. The panel (sdc-s6e3fc5) is on DECON0 and DSIM0 as on
# cheetah (stock's live tree disables DECON1/2 and DSIM1), so the trigger
# write is cheetah's: DECON0 TRIG_CON, unmask the hardware trigger.
# BRINGUP_PROBE stays unset: the scanout address it was for is in NOTES.
INITRAMFS_INIT=/initramfs/init
SIMPLEFB_TRIG_CON="0x1c240030 0x3061"
# Portrait, from dumpsys display (mStableDisplaySize 1080x2400).
PANEL_SIZE=1080x2400
