# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 6 Pro (raven). First-light draft.
#
# [V] marks a value read from raven's own capture or factory image
# (2026-10-14), [I] one inferred from cheetah or upstream, still to confirm
# on the phone. Nothing has booted on a raven yet.
# Format and keys: docs/RELEASES.md section 3.

# --- Identity ---
CODENAME=raven
NAME="Pixel 6 Pro"
SOC=gs101
# [V] upstream arch/arm64/boot/dts/exynos/google/gs101-raven.dts
COMPATIBLE="google,gs101-raven"
# Not written yet; for now only the initramfs C helpers' sources come from it.
PACKAGE=omamobile-device-raven

# --- Kernel and device tree ---
DTB=exynos/google/gs101-raven.dtb
DTB_OVERLAYS="aoc-boot-test aoc-sound-test audio-amps-test gnss-test"
# [V] the two base DTBs in raven's factory vendor_boot (CP3A.261005.002.A1)
# carry these two. [I] retail units are B0, as on cheetah: it goes first.
SOC_IDS="b0:0x9845001 a0:0x9845000"
# [I] the modem's physical SIM slots in order (omamobile-device-raven names them
# the same way); tools/install-phone asks one APN per slot.
SIM_SLOTS="tray eSIM"

# --- Bootloader glue ---
# [V] ro.boot.dtbo_idx = 6 on an MP1.0 raven; entry 6 of the factory
# dtbo.img is "Raven DVT", board_id 0x20204, board_rev 0x10000.
DTBO_SOURCE=raven-m1-overlay.dts
DTBO_BOARD_ID=0x20204
DTBO_BOARD_REV=0x10000
# Unlike cheetah's, raven's ABL passes this on (the stock vendor_boot carries
# real arguments here). No earlycon: retail raven leaves the UART unclocked,
# and early writes to it are the first suspect for the silent early hang of
# the first two slot B boots (BRINGUP-M1 section 7).
# regulator_ignore_unused as postmarketOS boots raven (kernel-cmdline.conf):
# the USB PHY supplies are still placeholders in the upstream DT.
# Raven's ABL drops every console= we pass (here and in the DT's bootargs)
# and appends console=null, so /proc/consoles is empty, and plymouthd 26.134
# crashes at start reading it (a NULL strcmp in kernel_console_is_ttynull()).
# plymouth.graphical makes it skip that check and force the splash; quiet,
# splash and the rest as cheetah boots. Plymouth must quit with
# --retain-splash (omamobile-device-raven 0.1.13), or it hangs on gs-decon.
VENDOR_CMDLINE="console=tty0 fbcon=font:TER16x32 quiet splash plymouth.graphical plymouth.force-scale=1 vt.global_cursor_default=0 clk_ignore_unused regulator_ignore_unused printk.devkmsg=on bootconfig"
# [V] the factory vendor_boot's page size.
VENDOR_PAGESIZE=0x800
# With no init_boot these go on boot.img. [V] The factory boot.img sets
# neither; these match the Android 17, 2026-10-05 patch build on slot A.
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10

# --- Storage guard ---
# [V] raven has no init_boot or vendor_kernel_boot (its /dev/block/by-name,
# 2026-10-14): vendor_boot carries the DTB and our initramfs.
BOOT_IMAGES="boot vendor_boot dtbo"
UFS_RW="boot_b vendor_boot_b dtbo_b userdata"

# --- Initramfs ---
# Loaded by init before anything else, in this order. The PMIC regulators
# (sec-acpm, over ACPM and its mailbox) are modules in the shared config;
# without them the simple-framebuffer waits forever for its vci/vddi rails
# and the console never reaches the screen. regulator_ignore_unused on the
# command line keeps every rail on. Then the MAX77759's core, its nvmem and
# nvmem-reboot-mode: ABL reads the reboot reason from the MAX77759's nvmem,
# so without them reboot-to bootloader just boots slot B again. Never its
# charger (max77759_charger turns charging off at probe; see cheetah's
# omamobile-max77759.conf).
INITRAMFS_MODULES="exynos-mailbox acpm-protocol sec-acpm max77759 nvmem-max77759 nvmem-reboot-mode"
# The init closes the MAX77759 USB data switch before any driver runs
# (initramfs/init, usb_switch): i2cget and i2cset in the initramfs.
INITRAMFS_I2C_TOOLS=1
# Cheetah's, without its gs201 TRIG_CON devmem write and probe() reads.
INITRAMFS_INIT=initramfs/init
# [I] upstream gs101-raven.dts's simple-framebuffer (BRINGUP-M1 section 2).
PANEL_SIZE=1440x3120
