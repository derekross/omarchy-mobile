# SPDX-License-Identifier: MIT
# Pixel 9a first-light descriptor. See NOTES.md.
# Data only: this is a staged port, not an installable release.
CODENAME=tegu
NAME="Pixel 9a"
USB_PRODUCT="Pixel 9a (M1)"
SOC=zumapro
COMPATIBLE="google,zumapro-tegu"
PACKAGE=omamobile-device-tegu

DTB=exynos/google/zumapro-tegu.dtb
# Deliberately no SOC_IDS: this loader uses /soc_compatible matching.
# Stock IPOP candidates: product_id 0x9875, major 0, minor 0/1, pkg_mode 1
# (NOTES.md). Shared support is reviewed separately in #27.
# SOC_COMPATIBLE="a0-ipop:0x9875:0:0:1 a1-ipop:0x9875:0:1:1"
# Keep both selector keys unset: #27 accepts either one. Activate only
# with the public DTB and required AVB footer values in a later PR.
# Do not use a dummy soc_id or borrow gs201's values to bypass the check.

# Applied to the base DTB by bin/omamobile images. modem-cpif: the modem
# interface driver's two nodes, with the modem node under the PCIe link
# handed to it (MODEM-PLAN M3). Binding CPIF powers nothing, and its modules
# are blacklisted by omamobile-device-tegu's guards: only the modem startup
# loads them. It needs a kernel whose zumapro-tegu.dtb has the modem node
# under pcie@12100000 (linux-omarchy-mobile#187, so one built after the
# kernel-2026.11.08 tag): on an older DTB fdtoverlay finds no such path
# (FDT_ERR_NOTFOUND) and bin/omamobile images stops at "applying the
# overlays failed".
DTB_OVERLAYS="modem-cpif"

DTBO_SOURCE=tegu-m1-overlay.dts
DTBO_BOARD_ID=0x60b06
DTBO_BOARD_REV=0x10000
VENDOR_CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
# Official BP3A init_boot header; both OTA/AVB and stock-A checks: NOTES.md.
OS_VERSION=16.0.0
OS_PATCH_LEVEL=2025-09
BOOT_METHOD=android-v4
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1080x2424
# No BRINGUP_PROBE or SIMPLEFB_TRIG_CON: those gs201 display accesses do
# not apply here. The prototype's G4 trigger handling needs its own change.

# --- Radio backup ---
# What tools/nv-backup copies, read-only, before any radio work (AGENTS.md
# section 1), found on the palmtop by PARTNAME: the same partitions as the
# Pixel 7 Pro's, and the ones its hand-made backups have held since
# 2026-10-21. NV_PARTS never change under Linux (the guard keeps them
# read-only and the modem profile works on RAM copies), so --check fails
# when one differs. NV_BACKUP_EXTRA is copied for a full way back but
# changes: devinfo holds the bootloader's slot flags, and metadata (in the
# hand-made backups too) is written by the bootloader and by stock.
NV_PARTS="efs efs_backup modem_userdata persist modem_a modem_b"
NV_BACKUP_EXTRA="devinfo metadata"
