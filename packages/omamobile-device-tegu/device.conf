# SPDX-License-Identifier: MIT
# Pixel 9a (tegu) boot descriptor. See NOTES.md.
CODENAME=tegu
NAME="Pixel 9a"
USB_PRODUCT="Pixel 9a (M1)"
SOC=zumapro
COMPATIBLE="google,zumapro-tegu"
PACKAGE=omamobile-device-tegu

DTB=exynos/google/zumapro-tegu.dtb
# ABL chooses the tegu DTB from the two stock IPOP silicon revisions.
SOC_COMPATIBLE="a0-ipop:0x9875:0:0:1 a1-ipop:0x9875:0:1:1"

# Keep unqualified peripherals disabled in the base DTB.
DTB_OVERLAYS="tegu-watchdogs tegu-usb tegu-ufs tegu-touch"

# Stock CP3A.261005.005 partition sizes and October 2026 AVB metadata.
AVB_FOOTERS="boot:67108864 init_boot:8388608 vendor_boot:67108864 vendor_kernel_boot:67108864 dtbo:16777216"
AVB_ROLLBACK_INDEX=1791158400
AVB_SECURITY_PATCH=2026-10-05

DTBO_SOURCE=tegu-m1-overlay.dts
DTBO_BOARD_ID=0x60b06
DTBO_BOARD_REV=0x10000
VENDOR_CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
# Official CP3A.261005.005 Android 17 init_boot header, checked against the
# currently booted stock A build.
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10
BOOT_METHOD=android-v4
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1080x2424
# DECON0's command-mode trigger is masked by ABL after the splash. Live tegu
# registers read 0x3070; clearing the mask and enabling the trigger produced
# the Omarchy desktop through the 1080x2424 simple framebuffer.
SIMPLEFB_TRIG_CON="0x19470030 0x3061"
