[Unit]
# Our slot-B kernels come as modules tarballs (bin/omamobile push), not as
# pacman-owned kernel packages. Arch's cleanup would remove the running,
# next-boot and rollback module trees; keep them while this package exists.
ConditionPathExists=!/usr/share/omamobile/device-tegu/version
