# Requisite checks the attended starter without pulling it into a start job.
# A missing/inactive tegu modem must fail, never start cheetah's modem unit.
[Unit]
Requisite=omamobile-tegu-modem.service
After=omamobile-tegu-modem.service omamobile-tegu-aoc.service

[Service]
# Active alone is insufficient: the CP must already report ONLINE.
ExecStartPre=/usr/lib/omamobile-vendor/omamobile-modem-cp state
