# SPDX-License-Identifier: MIT
# Omarchy Mobile, Pixel 9a: no service watchdogs, for every system service.
#
# systemd's service watchdogs count on CLOCK_MONOTONIC. The kernel stops
# that clock in s2idle only when the idle loop enters a cpuidle state
# through its s2idle callback (tick_freeze() in enter_s2idle_proper()). A
# 9a sleep never gets there: the published device tree has no idle states,
# and on a kernel that has them the cpuidle sleep hook keeps the cores in
# WFI for the sleep. So the clock runs through the sleep while every
# service is frozen, and at the thaw systemd aborts the ones whose
# WatchdogSec (3 min for journald, logind, udevd, homed, userdbd...) has
# passed. A sleep of 3 min 41 s or more cost at least one service every
# time (2026-11-14), and after it took systemd-logind the lock screen was
# unusable until a reboot (omarchy-mobile#765).
#
# Remove this file when a 9a sleep stops the clock (idle states entered
# through s2idle), not before. It has to be here at boot: a running
# service keeps the watchdog it was started with.
[Service]
WatchdogSec=0
