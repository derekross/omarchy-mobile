# The firmware advertises PSCI SYSTEM_SUSPEND, so the kernel offers "deep"
# sleep, but Linux has no gs201 SoC sleep sequence yet: entering it without
# one doesn't wake. Suspend means suspend-to-idle until SYS_SLEEP exists
# (device/cheetah/SUSPEND-PLAN.md, sections 1 and 5). There is no swap to
# hibernate to.
#
# SuspendState: systemd's default is "mem standby freeze", written to
# /sys/power/state one after the other until a write succeeds. With
# mem_sleep at s2idle a second write is the same sleep again, so a sleep a
# driver refused was tried twice, and the second try's failure (brcmfmac,
# -5) cost Wi-Fi (#619). One state, one try. "freeze" rather than "mem": it
# is suspend-to-idle whatever mem_sleep says.
[Sleep]
SuspendState=freeze
MemorySleepMode=s2idle
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
