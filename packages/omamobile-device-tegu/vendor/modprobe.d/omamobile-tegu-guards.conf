# Loaded only by the package's hang-safe scripts, in their order, after a
# marker is written: omamobile-tegu-graphics-start (the first six) and, once
# a kernel ships them in tree, the Wi-Fi and NFC starts. Blacklisting only
# stops udev from autoloading them ahead of the guard; "modprobe panthor"
# still works. No "install X /bin/false" lines: those break the guard's own
# modprobe.
blacklist panthor
blacklist gs_decon
blacklist cs40l26_vibra
blacklist leds_lm3644
blacklist max77779_battery
blacklist hci_uart
blacklist pcie_zumapro
blacklist brcmfmac
blacklist nxp_nci_i2c
