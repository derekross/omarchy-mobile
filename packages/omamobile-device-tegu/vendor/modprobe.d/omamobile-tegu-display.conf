# The panel's DSI commands (brightness, sleep, the refresh rate) are not
# allowed here: omamobile-tegu-graphics-start turns gs_dsim_cmd.allow_tx on
# only when the bootloader names the google-tg4c panel (kernel #90), before
# gs_decon loads. On any other panel the 120 Hz ceiling falls back to 60 Hz.
# 120 Hz (kernel #88) and the panel really off on DPMS, as the owner's phone
# runs it. omamobile-tegu-graphics-start adds stage=2 (the full driver) and
# fbdev=0 on its modprobe line.
options gs_decon max_refresh=120 screen_off=2
