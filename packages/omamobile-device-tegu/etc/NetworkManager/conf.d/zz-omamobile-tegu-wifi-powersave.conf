# Omarchy Mobile: Wi-Fi power save on for the Pixel 9a's BCM4383 (3 = enable).
# Omarchy turns it off for laptops (/etc/NetworkManager/conf.d/omarchy-wifi-
# powersave.conf, wifi.powersave = 2): a fraction of a watt there, but about
# 10 mA of a phone's screen-off drain. NetworkManager reads /etc after
# /usr/lib and each in name order, so this file is in /etc and sorts after
# Omarchy's.
[connection]
wifi.powersave=3
