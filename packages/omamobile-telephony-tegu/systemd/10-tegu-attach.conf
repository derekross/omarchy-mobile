# SPDX-License-Identifier: MIT
# Check the existing RIL, never pull it or the CP into a start transaction.
[Unit]
Requisite=omamobile-sitd.service
After=omamobile-sitd.service

[Service]
ExecStartPre=/usr/bin/omamobile-tegu-mmd-attach --service-check
# A refusal (exit 3) is not retried every RestartSec: the bridge stays down
# until the cause is fixed and it is started again.
RestartPreventExitStatus=3
