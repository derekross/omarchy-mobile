# SPDX-License-Identifier: MIT
# Check the existing RIL, never pull it or the CP into a start transaction.
[Unit]
Requisite=omamobile-sitd.service
After=omamobile-sitd.service

[Service]
# A refused service check skips this start without retrying every RestartSec.
ExecCondition=/usr/bin/omamobile-tegu-mmd-attach --service-check
