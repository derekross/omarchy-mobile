# SPDX-License-Identifier: MIT
# Omarchy Mobile, Xiaomi Mi 8: unlike the Pixels, SDM845 leaves its cluster
# watchdogs *running*, and the initramfs claims /dev/watchdog0 and pets it
# (`watchdog -t 5 -T 30`). That daemon dies with everything else just before
# switch_root, so unless systemd picks the watchdog up, nothing holds it and the
# hardware resets the phone about 30 s into the boot. Measured: an otherwise
# healthy first boot reached "Started Journal Service" and then died at
# `watchdog0: pretimeout event`, 34 s in.
#
# RuntimeWatchdogSec programs the *hardware* timeout and systemd pings at half
# of it, so it must leave room for the longest stretch systemd spends not
# servicing its main loop. 10 s was not enough: on a first boot systemd spends
# about 8 s in "Applying preset policy" (preset-all, because /etc/machine-id is
# still `uninitialized`) and the pretimeout fired at 17 s, mid-boot. 30 s is
# what the initramfs daemon already proved this watchdog accepts.
# RebootWatchdogSec is the Pixel rationale: if shutdown hangs, let the watchdog
# reset the phone after a minute rather than leaving it on the splash.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=1min
