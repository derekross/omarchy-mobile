# Omarchy Mobile (Pixel 8 Pro): at a critical battery, power off.
# upower's default critical action is a suspend. On this phone eight boots
# have ended at upowerd's suspend request and "PM: suspend entry" with nothing
# after it, and the next boot spent a slot B try; whether the battery ran flat
# or the phone hung is not settled (device/husky/SUSPEND-PLAN.md section 4).
# Power off stays off only on a kernel with linux-omarchy-mobile#262, which
# disarms the PMIC's WTSR and SMPL restarts at power off. On an earlier kernel
# the PMIC starts the phone again after a power off (omarchy-mobile#578), and
# at 3 % that would repeat, one slot B try each time: never have this file in
# effect before that kernel.
# upower resets all three percentages to its defaults (20, 5, 2) unless
# PercentageLow > PercentageCritical > PercentageAction, so the action must
# stay under the default critical level (5). upower 1.91.5 also cuts each
# percentage to a whole number (up_config_get_double keeps it in an int), so
# write whole numbers.
# Same settings as device-cheetah 0.1.55 (device/cheetah/SUSPEND-PLAN.md 6.6).
[UPower]
PercentageAction=3
CriticalPowerAction=PowerOff
