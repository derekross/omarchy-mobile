# Pixel 8 Pro thermal guard (omamobile-husky-thermal). Millicelsius, seconds.
# The kernel's SoC zones (big/mid/little/gpu, ACPM TMU) keep their DT trips
# (80/95/105 C); this guard never writes a trip. Trips moved down to 58/60 C
# through sysfs keep the DT hysteresis (5 and 10 C), which kept the clusters
# floored at idle (test 2026-11-19, device/husky/NOTES.md). Not enabled by
# the package. The guard caps the clocks itself instead, from the
# hottest of the four zones, every `interval` seconds:
#   >= floor      every CPU cluster and the GPU go to their lowest level
#   >= step_down  each cap steps down one level per tick, never to the
#                 lowest level (that is only for >= floor)
#   <  step_up    each cap steps up one level per tick, to the hardware max
#   in between    caps hold while the CPUs are busy, and step up while they
#                 are idle (below idle_busy)
# The guard starts every cap from the hardware max, whatever cap it found
# (stop puts the found one back). The phone idles at 53-57 C: with a hold
# at 56-57 C, a 58 C reading now and then ratcheted an idle phone to the
# floor and kept it there (2026-11-19 night).
step_down=58000
floor=60000
step_up=56000
interval=2
# The GPU's devfreq device (empty = leave the GPU alone).
gpu_devfreq=1f000000.gpu
# In the hold band the caps climb while the CPUs are less than idle_busy
# percent busy over every CPU (/proc/stat per CPU, per tick, iowait counted
# as idle).
idle_busy=35
