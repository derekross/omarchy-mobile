# Pixel 8 Pro thermal guard (omamobile-husky-thermal). Millicelsius, seconds.
# The kernel's SoC zones (big/mid/little/gpu, ACPM TMU) keep their DT trips
# (80/95/105 C); this guard never writes a trip. Their hysteresis is fixed
# (10 C on the 95 C trip), so trips moved down kept the clusters floored at
# idle (test 2026-11-19). The guard caps the clocks itself instead, from the
# hottest of the four zones, every `interval` seconds:
#   >= floor      every CPU cluster and the GPU go to their lowest level
#   >= step_down  each cap steps down one level per tick
#   <  step_up    each cap steps up one level per tick, to the hardware max
#   in between    caps hold
# The zones idle at 53-55 C (whole degrees), below step_up, so after a hot
# spell idle always climbs back to the hardware max; 56-57 C holds.
step_down=58000
floor=60000
step_up=56000
interval=2
# The GPU's devfreq device (empty = leave the GPU alone).
gpu_devfreq=1f000000.gpu
# At the floor and still >= squeeze_at, user.slice is squeezed onto fewer
# CPUs, one level per tick (systemd AllowedCPUs), and let out one level per
# tick below release_below. Levels in the kernel's own form (0-7, not
# 0,1,2...). This kernel has no cpu.max (no CFS bandwidth) and refuses CPU
# hotplug, so the cpuset is what is left. Empty squeeze_cgroup: off.
squeeze_at=60000
release_below=56000
squeeze_cgroup=user.slice
squeeze_cpus=0-7 0-5 0-3
# Only while the CPUs are the heat source: at least squeeze_busy percent
# busy over the CPUs user.slice may use now (/proc/stat per CPU, per tick,
# iowait counted as idle). Hot but not busy (charging heat, seen on the
# phone 2026-11-19: 61-62 C at the floor with load ~0.5) is not squeezed,
# and a squeeze is let out at once when busy drops below
# squeeze_release_busy: fewer CPUs cannot cool the charger, they only froze
# the UI. The squeeze stops at
# squeeze_min_cpus (which leaves some mid cores; nothing is reserved for the
# compositor) unless the CPUs it has are at least squeeze_deep_busy percent
# busy, and goes back to it below squeeze_deep_release_busy. A tick with no
# busy reading (first tick, counters gone or gone back) holds the squeeze
# while >= release_below; below it cooling lets it out as usual.
squeeze_busy=50
squeeze_release_busy=35
squeeze_deep_busy=90
squeeze_deep_release_busy=75
squeeze_min_cpus=0-5
