# Declares that this phone has a charge limit, and on which power supply. The Settings app's Battery page
# (omamobile-settings: backends/charge.sh and the root helper charge-limit) does nothing on a phone without this
# file. Husky's max77759-charger has charge_control_end_threshold and charge_control_start_threshold on a kernel
# with derekross/linux-omarchy-mobile#266, once this package stops blacklisting max77759_charger.
supply=max77759-charger
