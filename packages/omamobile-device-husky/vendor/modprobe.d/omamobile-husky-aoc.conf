# SPDX-License-Identifier: MIT
# The AoC stack (device/husky/AOC-PLAN.md): only omamobile-husky-aoc-start
# loads these, in order. Explicit modprobe still works for bring-up.
blacklist trusty_core
blacklist trusty_log
blacklist trusty_ipc
blacklist trusty_virtio
blacklist gsa
blacklist gs201_aoc_sysmmu
blacklist mailbox_wc
blacklist aoc_core
blacklist aoc_channel_dev
blacklist aoc_char_dev
# The sound card's driver would otherwise load at boot and pull the AoC core,
# GSA and Trusty in ahead of the order above, and the card waits for both
# amplifiers: omamobile-husky-aoc-start loads the card and the amplifiers
# together. No speaker_protection option: the analog ceiling stays at 10
# until the 8 Pro has verified ceilings of its own.
blacklist aoc_alsa_dev
blacklist aoc_alsa_dev_util
blacklist snd_soc_cs35l41_spi
