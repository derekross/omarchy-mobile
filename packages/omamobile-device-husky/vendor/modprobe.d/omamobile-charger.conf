# Charging policy for max77759_charger, the Pixel 7 Pro's and the Pixel 7's
# two lines. Inert for now: omamobile-max77759.conf still blacklists the
# charger, so these apply only to a modprobe by hand (a runbook step), never
# at boot. Both options belong together:
# - default_ilim_ua: without a Type-C source (tcpci_maxim stays blacklisted)
#   the upstream driver turns charging off at probe; this keeps it on at a
#   500 mA input limit instead;
# - temp_guard: stock's step-charging bands from the gauge's temperature
#   and voltage, every 30 s; no reading or out of range stops charging.
# The gauge loads first, so the guard's first reading succeeds.
# On husky with a published kernel, a charger loaded by hand is not yet the
# 7 Pro's guard:
# - it gets the gs201 phones' table, until linux-omarchy-mobile#265 gives
#   husky its own;
# - the gauge's temperature reads 22.0 C whatever the cell does, until the
#   gauge fix lands, so the guard cannot see heat;
# - it charges to the battery node's 4.20 V, where the charge ends near 82 %,
#   until the float is raised (the limits on #761).
options max77759_charger default_ilim_ua=500000 temp_guard=1
softdep max77759_charger pre: max17042_battery
