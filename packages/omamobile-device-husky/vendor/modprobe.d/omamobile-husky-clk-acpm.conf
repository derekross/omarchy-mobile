# GPU DVFS top level through the ACPM clocks (kernel #157): 890 MHz, stock's
# own top (gpu_dvfs_max_freq), under the GPU thermal zone's throttle. Without
# it the GPU stays at the bootloader's 150 MHz. A kernel without #157 ignores
# the unknown parameter.
options clk_acpm zuma_gpu_max_khz=890000
