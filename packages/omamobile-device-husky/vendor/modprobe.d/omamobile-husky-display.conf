# Loaded only by omamobile-husky-display-start, after its marker and after
# it has allowed the panel's DSI commands (gs_dsim_cmd.allow_tx) for the
# google-hk3 panel: gs-decon decides on 120 Hz at probe. Blacklisting only
# stops udev from autoloading it ahead of the start; "modprobe gs_decon"
# still works. No "install" line: that would break the start's own modprobe.
blacklist gs_decon
# The panel really off on DPMS, as on cheetah and tegu: DECON stops its
# frames and the HK3 goes to sleep (screen_off=2); the next DPMS on wakes it.
options gs_decon screen_off=2
