# SPDX-License-Identifier: MIT
# MAX77759 bring-up on the Pixel 8 Pro: load these by hand, one step at a time
# (kernel #163). Binding the PMIC (0x66) also creates its charger,
# GPIO and NVMEM cells, and the charger driver programs the charge limits from
# the battery node, so none of the cell drivers may load on their own yet.
# The fuel gauge (max17042_battery) and the MFD core (max77759) still autoload.
# tcpci_maxim would take over the USB-C port we use for SSH: it waits for the
# Type-C step.
blacklist max77759_charger
blacklist tcpci_maxim
blacklist gpio_max77759
blacklist nvmem_max77759
