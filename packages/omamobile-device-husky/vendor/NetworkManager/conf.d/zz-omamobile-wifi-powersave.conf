# Wi-Fi power save on (3 = enable), the value the Pixel 6 Pro's package asks for: without it the
# BCM4398 read "Power save: off" and the phone drew about 30 mA more on battery
# Installed in /etc, not /usr/lib, and named zz so it is read after
# /etc/NetworkManager/conf.d/omarchy-wifi-powersave.conf (omarchy-settings), which sets wifi.powersave=2:
# NetworkManager reads /usr/lib files first, so a file there loses to it, and so does a name that sorts before it.
[connection]
wifi.powersave=3
