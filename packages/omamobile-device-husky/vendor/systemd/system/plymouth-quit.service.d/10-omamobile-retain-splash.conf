# Leave Plymouth's last frame on screen until Hyprland draws its first one,
# as on cheetah and raven. gs-decon has no fbdev console to hand the screen
# back to, and on raven a plain "plymouth quit" hung until systemd killed it
# at 27 s, holding graphical.target (and so the session) back until 97 s
# (2026-10-17). Only matters once "splash" is on husky's command line.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
