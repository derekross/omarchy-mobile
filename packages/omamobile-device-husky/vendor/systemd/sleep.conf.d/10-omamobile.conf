# The firmware advertises PSCI SYSTEM_SUSPEND, so the kernel offers "deep"
# sleep, and on the 8 Pro it is the default (/sys/power/mem_sleep reads
# "s2idle [deep]", device/husky/ROADMAP.md, the Suspend row). Linux has no
# zuma SoC sleep sequence yet, so entering it would not wake, as on the
# Pixel 7 Pro (device/cheetah/SUSPEND-PLAN.md, sections 1 and 5). Suspend
# means suspend-to-idle until one exists. There is no swap to hibernate to.
[Sleep]
MemorySleepMode=s2idle
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
