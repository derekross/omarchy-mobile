# SPDX-License-Identifier: MIT
# The firmware advertises PSCI SYSTEM_SUSPEND, so the kernel offers "deep"
# sleep, and on the 8 Pro it is the default (/sys/power/mem_sleep reads
# "s2idle [deep]", device/husky/ROADMAP.md, the Suspend row). Linux has no
# zuma SoC sleep sequence yet, so entering it would not wake, as on the
# Pixel 7 Pro (device/cheetah/SUSPEND-PLAN.md, sections 1 and 5). Suspend
# means suspend-to-idle until one exists. There is no swap to hibernate to.
#
# SuspendState: systemd's default is "mem standby freeze", written to
# /sys/power/state one after the other until a write succeeds. With
# mem_sleep at s2idle a second write is the same sleep again, so a sleep a
# driver refuses is tried twice, about half a second apart. On the Pixel 9a
# the second try's failure (brcmfmac, -5) cost Wi-Fi (#619); a refused sleep
# has not been seen on the 8 Pro. One state, one try. "freeze" rather than
# "mem": it is suspend-to-idle whatever mem_sleep says.
[Sleep]
SuspendState=freeze
MemorySleepMode=s2idle
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
