# The install link's state directory keeps its mode at every boot, and only
# where it exists ('z' creates nothing): on a phone that never had the link
# this changes nothing. The daemon's unit creates it (StateDirectory=) only
# while the marker exists; `omamobile-install-link reopen` and an end leave
# it behind. 0711: the owner's session can read `done` (0644) by its name;
# the state, the token's hash and the image are 0600, and the directory
# can't be listed. The provisioning work space (/var/lib/omamobile/provision)
# is omamobile-provision's.
z /var/lib/omamobile/install-link 0711 root root -
