# The release image's placeholder for firstboot.conf (rootfs/placeholders):
# a file of comments only. omamobile-firstboot does nothing with it, but the
# unit (RemainAfterExit=yes) would then stay "active" for the whole boot, so
# the install link, which writes the answers over it later in the same boot
# and starts the unit, would start nothing, and would take first boot for
# running until the next boot. Skipped here instead, the unit stays
# inactive until there are answers, and the link's start runs it.
[Service]
ExecCondition=/usr/lib/omamobile-install-link/has-answers /etc/omamobile/firstboot.conf
