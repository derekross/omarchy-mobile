# The Pixel 7 Pro's sitd waits for the CP. omamobile-modem.service is ready
# once CPIF's ports exist, before cbd has booted the CP (10-30 s more), and a
# sitd started on that alone exits ("CP is not ONLINE", 2026-11-03, when both
# units were started at once). 120 s is the profile's own cbd timeout: a CP
# that never comes up fails sitd here, and the data fallback and the Phone
# and Messages bridge, ordered after it, stay down until the reboot.
[Service]
ExecStartPre=/usr/lib/omamobile-vendor/omamobile-modem-cp wait-online 120
