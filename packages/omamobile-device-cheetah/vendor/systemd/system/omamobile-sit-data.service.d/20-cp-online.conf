# SPDX-License-Identifier: MIT
# The data fallback only with a modem. omamobile-sit-data requires sitd, but
# a sitd skipped by its own condition (no /dev/umts_ipc0: the modem unit was
# skipped on a phone that isn't provisioned) counts as started, and the
# fallback would then wait 60 s for a bearer, fail, and be restarted every
# 10 s for the whole boot. With the modem up the port exists, and
# `omamobile-sit data on` works as before.
[Unit]
ConditionPathExists=/dev/umts_ipc0
