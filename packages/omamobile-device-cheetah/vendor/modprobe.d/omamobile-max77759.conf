# MAX77759 bring-up: load these by hand (device/cheetah/WIFI-BATTERY-PLAN.md).
# The fuel gauge (max17042_battery) autoloads: it writes nothing on probe
# without a monitored-battery node, and drives the battery indicator.
# The MFD core and the charger load at boot (omamobile-charger.conf sets the
# charger's input limit and temperature guard; USB-C-PLAN D1). tcpci_maxim
# would take over the USB-C port we use for SSH: it waits for gate B4.
# nvmem_max77759 loads: it provides the reboot-reason cell that
# nvmem-reboot-mode writes for `reboot-to bootloader` (linux-omarchy-mobile
# #176).
blacklist tcpci_maxim
blacklist gpio_max77759
