# SPDX-License-Identifier: MIT
# AoC (device/cheetah/AOC-PLAN.md): only omamobile-aoc-start (or the bring-up
# stages) load these, in order. Explicit modprobe still works.
blacklist gsa
blacklist gs201_aoc_sysmmu
blacklist gs201_aoc_boot
blacklist gs201_aoc_rails
blacklist mailbox_wc
blacklist aoc_core
blacklist aoc_channel_dev
blacklist aoc_char_dev
# The sound card's driver would load at boot and pull aoc_core, gsa and Trusty
# in ahead of the order above; omamobile-aoc-start loads it with the others.
blacklist aoc_alsa_dev
blacklist aoc_alsa_dev_util

# The speakers' kernel ceiling at stock's analog 17 (aoc_speaker_limits;
# 10 without it). Only the raised ceiling: omamobile-audio's speaker service
# picks the levels, and runs above analog 10 only with verified protection
# (a stamp for this firmware, AOC-PLAN.md C9a). Was a hand-placed bring-up
# file (omamobile-audio-c9-bringup.conf) until 2026-10-31.
options aoc_alsa_dev speaker_protection=1
