# SPDX-License-Identifier: MIT
# The Pixel 7 Pro's defaults for omamobile-modem-sit, read before
# /etc/omamobile/modem-sit.conf (a value set there wins).
[audio]
# Call audio through the AoC card, each call in the protection service's
# earpiece mode (the top amplifier alone at 657/6, the bottom muted;
# AOC-PLAN.md C9k), clean by ear on VoLTE calls on 2026-11-03
# (device/cheetah/NOTES.md, 2026-11-03).
card = auto

[control]
# Tell the modem when the screen goes off and on, as stock's RIL does, so
# that with the screen dark it stops its optional reports and wakes a
# sleeping phone only for what matters. On the 7 Pro since MODEM-PLAN M6
# passed on the reference phone (2026-11-14: a text and a call each woke it
# with the screen dark; SUSPEND-PLAN). follow_screen = no in
# /etc/omamobile/modem-sit.conf turns it off.
follow_screen = yes
