# Lenovo Tab M10 FHD Plus (TB-X606F / achilles6):
# Stock /vendor/etc/audio_param/AudioParamOptions.xml sets
# MTK_AUDIO_SPEAKER_PATH="int_hp_buf" and SPK_PATH_HP="yes": the two stereo
# external speaker amplifiers (GPIO 151 and GPIO 153) are fed from MT6357's
# stereo Headphone buffer (AU_HPL/AU_HPR) rather than the mono Line Out pin.
SectionVerb {
	EnableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' 1"
		cset "name='ADDA_DL_CH2 DL1_CH2' 1"
		cset "name='DAC Mux' 'Normal Path'"
		cset "name='UL1_CH1 ADDA_UL_CH1' 1"
		cset "name='UL1_CH2 ADDA_UL_CH2' 1"
		cset "name='Lineout Volume' 18"
		cset "name='Headphone Volume' 18"
		cset "name='Speaker Switch' 0"
		cset "name='Headphone Switch' 0"
		cset "name='Main Mic Switch' 0"
	]

	DisableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL1_CH2' 0"
		cset "name='UL1_CH1 ADDA_UL_CH1' 0"
		cset "name='UL1_CH2 ADDA_UL_CH2' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speakers"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='Headphone Left Source' 'DAC'"
		cset "name='Headphone Right Source' 'DAC'"
		cset "name='Line Out Source' 'Playback'"
		cset "name='Headphone Switch' 1"
		cset "name='Speaker Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='Headphone Switch' 0"
		cset "name='Line Out Source' 'Open'"
		cset "name='Headphone Left Source' 'Open'"
		cset "name='Headphone Right Source' 'Open'"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='Headphone Left Source' 'DAC'"
		cset "name='Headphone Right Source' 'DAC'"
		cset "name='Headphone Switch' 1"
	]

	DisableSequence [
		cset "name='Headphone Switch' 0"
		cset "name='Headphone Left Source' 'Open'"
		cset "name='Headphone Right Source' 'Open'"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='Mic Type Mux' 'ACC'"
		cset "name='PGA L Mux' 'AIN0'"
		cset "name='PGA R Mux' 'AIN0'"
		cset "name='Main Mic Switch' 1"
	]

	DisableSequence [
		cset "name='Main Mic Switch' 0"
		cset "name='PGA L Mux' 'None'"
		cset "name='PGA R Mux' 'None'"
		cset "name='Mic Type Mux' 'Idle'"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
	}
}
