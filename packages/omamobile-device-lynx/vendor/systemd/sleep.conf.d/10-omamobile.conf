# The firmware advertises PSCI SYSTEM_SUSPEND, so the kernel offers "deep"
# sleep, but Linux has no gs201 SoC sleep sequence yet: entering it without
# one doesn't wake. Suspend means suspend-to-idle until SYS_SLEEP exists
# (device/cheetah/SUSPEND-PLAN.md, sections 1 and 5). There is no swap to
# hibernate to.
[Sleep]
MemorySleepMode=s2idle
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
