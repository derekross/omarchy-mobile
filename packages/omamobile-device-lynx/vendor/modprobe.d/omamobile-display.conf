# gs-dsim-cmd starts read-only. omamobile-lynx-display-start enables DSI
# commands only when the bootloader names the S6E3FC5 panel on the command
# line, so an S6E3FC3 unit never receives S6E3FC5 commands.
# gs-decon decides the link rate at probe, so keep it out of autoload:
# the start loads it after allow_tx is set.
blacklist gs_decon
