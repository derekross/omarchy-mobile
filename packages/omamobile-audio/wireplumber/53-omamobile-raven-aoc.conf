# SPDX-License-Identifier: MIT
# The AoC sound card on raven (card name "google,raven-aoc-snd-card", from
# the card's aoc-card-name): the same rules as cheetah's 51-omamobile-aoc.conf
# under raven's own card name, so a rule for one phone's speakers can't match
# the other's. No volume cap: raven's speakers stay off until their limits are
# validated (device/raven/AUDIO-PLAN.md).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*", api.alsa.card.name = "google,raven-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        device.description = "Built-in Audio"
        device.form-factor = "internal"
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*", api.alsa.card.name = "google,raven-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Speaker"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 960
        api.alsa.period-num = 4
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*", api.alsa.card.name = "google,raven-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Microphone"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 960
        api.alsa.period-num = 4
      }
    }
  }
]
