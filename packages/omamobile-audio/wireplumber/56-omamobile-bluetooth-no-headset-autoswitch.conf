# A recording doesn't move a Bluetooth headset from A2DP to the headset
# profile. WirePlumber switches when anything records while a headset is
# connected, since the headset's microphone becomes the default source, and
# leaves it there after the recording ends: music drops to call quality.
# These phones have no verified SCO audio path yet, so the switch also buys
# nothing; a recording takes the phone's own microphone. A call app that
# wants the headset's microphone selects the headset profile itself.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
