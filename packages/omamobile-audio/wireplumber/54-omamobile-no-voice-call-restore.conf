# Load omamobile-no-voice-call-restore.lua: a stored "Voice Call" profile on
# the AoC card is never restored at startup (the earpiece would carry media).
wireplumber.components = [
  {
    name = omamobile-no-voice-call-restore.lua, type = script/lua
    provides = custom.omamobile-no-voice-call-restore
  }
]
wireplumber.profiles = {
  main = {
    custom.omamobile-no-voice-call-restore = required
  }
}
