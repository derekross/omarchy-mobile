# SPDX-License-Identifier: MIT
# Load omamobile-no-voice-call-restore.lua: a stored "Voice Call" profile is
# never restored at startup (on cheetah the earpiece would carry media).
# Loaded before the ALSA monitor, or the cards' first profile selection
# runs without the hook.
wireplumber.components = [
  {
    name = omamobile-no-voice-call-restore.lua, type = script/lua
    provides = custom.omamobile-no-voice-call-restore
    before = [ monitor.alsa ]
  }
]
wireplumber.profiles = {
  main = {
    custom.omamobile-no-voice-call-restore = required
  }
}
