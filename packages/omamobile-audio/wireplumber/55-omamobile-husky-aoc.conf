# The AoC sound card on the Pixel 8 Pro (card name "google,husky-aoc-snd-card",
# from the card's aoc-card-name): rules under husky's own card name, so a rule
# for one phone's speakers can't match another's. The deep-buffer playback
# path (EP6) takes only 16-bit integer data and drops what is written before
# the stream starts (the kernel's pointer fix handles the second part): no
# mmap, S16, small periods, and the stream never suspends on idle. No volume
# cap here: the speaker levels are set by the UCM profile's media stage.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*", api.alsa.card.name = "google,husky-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        device.description = "Built-in Audio"
        device.form-factor = "internal"
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*", api.alsa.card.name = "google,husky-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Speaker"
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        api.alsa.disable-mmap = true
        api.alsa.period-size = 960
        api.alsa.period-num = 8
        api.alsa.headroom = 6000
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
