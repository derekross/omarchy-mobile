# SPDX-License-Identifier: MIT
# The AoC sound card on cheetah (card name "google,aoc-snd-card", from the
# sound node's aoc-card-name).
#
# - No mmap: this card's mmap maps the AoC's own service ring, which only the
#   stock MMAP/raw endpoints are meant for. The stock HAL opens the deep-buffer
#   (EP6) and record (EP1) endpoints with mmap="false"
#   (vendor/etc/audio_platform_configuration.xml).
# - Periods as stock: UC_DEEP_BUFFER_PLAYBACK and UC_AUDIO_RECORD use 4 periods
#   of 20 ms, which is 960 frames at 48 kHz.
# - The card is a platform device with no udev form factor, so name it the way
#   PipeWire names a laptop's built-in card.
# - Software volume only: PipeWire never touches a hardware mixer element of
#   this card (the amplifiers' levels belong to omamobile-speaker-protection;
#   the UCM profile names no mixer element either).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*", api.alsa.card.name = "google,aoc-snd-card" }
    ]
    actions = {
      update-props = {
        device.description = "Built-in Audio"
        device.form-factor = "internal"
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*", api.alsa.card.name = "google,aoc-snd-card" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Speaker"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 960
        api.alsa.period-num = 4
      }
    }
  }
  {
    # the "Voice Call" profile's Earpiece sink (AOC-PLAN.md C9k): the same
    # PCM as the speaker's, so the rule above also applies; only its name
    matches = [
      { node.name = "~alsa_output.*Earpiece.*", api.alsa.card.name = "google,aoc-snd-card" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Earpiece"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*", api.alsa.card.name = "google,aoc-snd-card" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Microphone"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 960
        api.alsa.period-num = 4
      }
    }
  }
]
