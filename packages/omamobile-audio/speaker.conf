# SPDX-License-Identifier: MIT
# Speaker settings for omamobile-speaker-protection and its watchdog
# (device/cheetah/AOC-PLAN.md stages C8 and C9). PipeWire's volume (keys,
# quick settings) works on top of these in software; these are the
# amplifiers' own levels with the protection firmware running.
#
# Stage: media (default) is the everyday level until stock's gains are
# proven: digital <= 737 (-10 dB), analog <= 10 on both amplifiers, inside
# AUDIO-PLAN.md section 4's limits even without protection. c8 is bring-up
# (digital <= 657, analog <= 6 top, <= 10 bottom). c9 allows stock's 817 / 17,
# but only with aoc_alsa_dev speaker_protection=1 and a verification stamp for
# the installed firmware (omamobile-speaker-protection verify, C9a).
#OMAMOBILE_SPK_STAGE=media
#
# Levels for both amplifiers, and per amplifier (overriding them):
# (defaults: media 737 / 10, c8 and c9 657 / 6)
#OMAMOBILE_SPK_DIGITAL=737
#OMAMOBILE_SPK_ANALOG=10
#OMAMOBILE_SPK_TOP_DIGITAL=
#OMAMOBILE_SPK_TOP_ANALOG=
#OMAMOBILE_SPK_BOTTOM_DIGITAL=
#OMAMOBILE_SPK_BOTTOM_ANALOG=
#
# Stock's media "fast use case" delta (vendor fast_switch3/4, "Bypass FIR"),
# written to both DSPs at each stream start by the watchdog (C9b). Default:
# on when both delta files are installed (tools/extract-vendor-firmware).
#OMAMOBILE_SPK_MEDIA_DELTA=1
#
# The amplifiers' DRE (dynamic range enhancement). Stock runs it at its analog
# gain 17; below that the bottom amplifier's protection model over-estimates
# its output with DRE on and the watchdog mutes (AOC-PLAN C9j). Default since
# 0.5.2: on at analog 17, off below. 1 = on, 0 = off.
#OMAMOBILE_SPK_DRE=
# The amplifiers' hardware noise gate (stock enables it): 1 = on.
#OMAMOBILE_SPK_NOISE_GATE=1
#
# The watchdog's coil temperature backstop in degrees C (the firmware's own
# thermal protection acts first):
#OMAMOBILE_SPK_TEMP_MAX=80
# The watchdog's jump rule: mute when the firmware's coil estimate rises more
# than this many degrees within one stream (the gain-17 runaway, C9d-3..6).
# Default: 5 above analog 10 (stage c9), off at 10 or below, where the
# estimate is open-loop and the bottom amplifier's jumps 10-15 C on any level
# drop (AOC-PLAN C9j). A value sets it in any stage; 0 turns it off.
#OMAMOBILE_SPK_TEMP_JUMP=
#
# The amplifiers' VMON/IMON stream to the AoC (the hostless capture, PCM 15),
# which stock runs with every speaker stream (AOC-PLAN.md C9d-7). Needs the
# aoc-sound-test overlay's interleaved TX slots; off until C9d-7 has run:
#OMAMOBILE_SPK_FEEDBACK=1
#
# The order the factory calibration goes into the DSPs: mainline (ambient
# first, the default) or stock (the stock HAL's: CAL_R, CAL_STATUS,
# CAL_CHECKSUM, then CAL_AMBIENT). A prepared test for AOC-PLAN C9d-8:
#OMAMOBILE_SPK_CAL_ORDER=mainline
