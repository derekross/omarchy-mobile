# SPDX-License-Identifier: MIT
# Speaker settings for omamobile-speaker-protection and its watchdog
# (device/cheetah/AOC-PLAN.md stages C8 and C9). PipeWire's volume (keys,
# quick settings) works on top of these in software; these are the
# amplifiers' own levels with the protection firmware running.
#
# Stage: auto (the default) is c9 at the everyday loud levels below when the
# phone has aoc_alsa_dev speaker_protection=1 (device-cheetah sets it) and a
# verification stamp for the installed firmware (omamobile-speaker-protection
# verify, C9a), and media otherwise. media: digital <= 737 (-10 dB), analog
# <= 10 on both amplifiers, inside AUDIO-PLAN.md section 4's limits even
# without protection. c8 is bring-up (digital <= 657, analog <= 6 top, <= 10
# bottom). c9 allows stock's 817 / 17, only with speaker_protection=1 and the
# stamp.
#OMAMOBILE_SPK_STAGE=auto
#
# Levels for both amplifiers, and per amplifier (overriding them). Defaults:
# media 737 / 10; c9 817 / 14, the top at analog 11 (with music at full
# volume both coils settle at 60-65 C, 13 C under the backstop; AOC-PLAN.md
# "C9 with real music", 2026-10-31); c8 657 / 6.
#OMAMOBILE_SPK_DIGITAL=
#OMAMOBILE_SPK_ANALOG=
#OMAMOBILE_SPK_TOP_DIGITAL=
#OMAMOBILE_SPK_TOP_ANALOG=
#OMAMOBILE_SPK_BOTTOM_DIGITAL=
#OMAMOBILE_SPK_BOTTOM_ANALOG=
#
# Earpiece mode (omamobile-speaker-protection earpiece on, or the "Voice
# Call" UCM verb's Earpiece; AOC-PLAN.md C9k): the top amplifier alone with
# its DSP bypassed, as stock's handset path, the bottom one muted. At most
# 737 (and the stage's digital ceiling) / 6 in every stage; the default is
# 20 dB under stock's handset gain (817 / 6). DRE follows OMAMOBILE_SPK_DRE
# unless set here. Needs the boost converter off, as at every analog gain of
# 10 and below (OMAMOBILE_SPK_BOOST=1 accepts it on).
#OMAMOBILE_SPK_EARPIECE_DIGITAL=657
#OMAMOBILE_SPK_EARPIECE_ANALOG=6
#OMAMOBILE_SPK_EARPIECE_DRE=
#
# Stock's media "fast use case" delta (vendor fast_switch3/4, "Bypass FIR"),
# written to both DSPs at each stream start by the watchdog (C9b). Default:
# on when both delta files are installed (tools/extract-vendor-firmware).
#OMAMOBILE_SPK_MEDIA_DELTA=1
#
# The amplifiers' DRE (dynamic range enhancement), on in stock and by default
# here (0.5.3; with the boost converter off it takes the bottom speaker from
# 12 % to 4 % distortion at the everyday level, AOC-PLAN C9j). 0 = off.
#OMAMOBILE_SPK_DRE=1
#
# The amplifiers' internal boost converter. At the everyday level (analog 10
# and below) it sits in its light-load regime, where it droops and distorts
# both speakers (10-50 % on a 1 kHz tone) and takes 8-11 dB off the output;
# by our reading stock's 817/17 never runs it there. Default: off when every
# configured analog level is 10 or below, on when one is above (stage c9),
# when the kernel offers the cs35l41 boost_en parameter; older kernels keep
# it on. The parameter is module-wide: one amplifier at 17 keeps it on for
# both. 1 = on, 0 = off, anything else is refused (AOC-PLAN C9j).
#OMAMOBILE_SPK_BOOST=
# The amplifiers' hardware noise gate (stock enables it): 1 = on.
#OMAMOBILE_SPK_NOISE_GATE=1
#
# The watchdog's coil temperature backstop in degrees C (the firmware's own
# thermal protection acts first):
#OMAMOBILE_SPK_TEMP_MAX=80
# The watchdog's jump rule: mute when the firmware's coil estimate rises more
# than this many degrees above its first measured value in a stream.
# Default: 20 in stage c9 (the stage whose analog ceiling is above 10: the
# firmware's own protection and the backstop above do the real work, C9d-8), off in
# media and c8, where the estimate is open-loop and the bottom amplifier's
# jumps 10-15 C on any level drop (AOC-PLAN C9j). A value sets it in any
# stage; 0 turns it off.
#OMAMOBILE_SPK_TEMP_JUMP=
# The jump rule's baseline is the first estimate that has left the firmware's
# 25 C reference (the coil measured; on a warm phone a step up), or the one
# after this many seconds of a stream (AOC-PLAN C9d-8, 2026-10-31):
#OMAMOBILE_SPK_TEMP_SETTLE=2
#
# The amplifiers' VMON/IMON stream to the AoC (the hostless capture, PCM 15),
# which stock runs with every speaker stream (AOC-PLAN.md C9d-7). Needs the
# aoc-sound-test overlay's interleaved TX slots; off until C9d-7 has run:
#OMAMOBILE_SPK_FEEDBACK=1
#
# The order the factory calibration goes into the DSPs: mainline (ambient
# first, the default) or stock (the stock HAL's: CAL_R, CAL_STATUS,
# CAL_CHECKSUM, then CAL_AMBIENT). A prepared test for AOC-PLAN C9d-8:
#OMAMOBILE_SPK_CAL_ORDER=mainline
