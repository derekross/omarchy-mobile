# SPDX-License-Identifier: MIT
# Pixel 6 Pro (raven, gs101): the AoC sound card (card driver name
# "aoc-snd-card", card name "google,raven-aoc-snd-card"; alsa-ucm-conf tries
# conf.d/<driver>/<long name>.conf before conf.d/<driver>/<driver>.conf, so
# this file wins over cheetah's aoc-snd-card.conf). Speaker through the two
# CS35L41s on TDM 0, microphones 0, 1 and 2 through the AoC.
Syntax 6

SectionUseCase."HiFi" {
	File "/Google/raven/HiFi.conf"
	Comment "Speaker and microphones"
}
