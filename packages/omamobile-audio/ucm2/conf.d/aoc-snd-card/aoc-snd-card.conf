# SPDX-License-Identifier: MIT
# Pixel 7 Pro (cheetah, gs201): the AoC sound card (card driver name
# "aoc-snd-card"). Speaker and microphones sit behind the AoC audio DSP.
# The amplifiers' protection firmware, calibration and gains are set up by
# omamobile-speaker-protection.service, not here: this profile never touches
# an amplifier volume, so PipeWire uses software volume and the kernel's and
# the service's limits stay in force.
Syntax 6

SectionUseCase."HiFi" {
	File "/Google/cheetah/HiFi.conf"
	Comment "Speaker and microphones"
}

# The earpiece (AOC-PLAN.md C9k): the same speaker PCM with the amplifiers in
# earpiece mode. Ranked below HiFi, so never the default.
SectionUseCase."Voice Call" {
	File "/Google/cheetah/VoiceCall.conf"
	Comment "Earpiece"
}
