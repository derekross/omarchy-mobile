# SPDX-License-Identifier: MIT
# Google Pixel AoC sound card (card driver name "aoc-snd-card"): Pixel 7 Pro
# (cheetah, gs201) and Pixel 6 Pro (raven, gs101). Speaker and microphones
# sit behind the AoC audio DSP. The board is raven when gs101's AoC node is
# in the device tree, cheetah otherwise.
# The amplifiers' protection firmware, calibration and gains are set up by
# omamobile-speaker-protection.service, not here: this profile never touches
# an amplifier volume, so PipeWire uses software volume and the kernel's and
# the service's limits stay in force.
Syntax 6

Define.Board "cheetah"
If.raven {
	Condition {
		Type Path
		Path "/sys/firmware/devicetree/base/soc@0/aoc@175d0000"
		Mode exists
	}
	True.Define.Board "raven"
}

SectionUseCase."HiFi" {
	File "/Google/${var:Board}/HiFi.conf"
	Comment "Speaker and microphones"
}
