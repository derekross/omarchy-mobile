# SPDX-License-Identifier: MIT
# Pixel 8 Pro (husky, zuma): the AoC sound card (card driver name
# "aoc-snd-card", card name "google,husky-aoc-snd-card"; alsa-ucm-conf tries
# conf.d/<driver>/<long name>.conf before conf.d/<driver>/<driver>.conf, so
# this file wins over cheetah's aoc-snd-card.conf). Speaker (both amps,
# stereo) and earpiece (top amp) on the deep-buffer path EP6, plus the bottom
# microphone (AoC mic id 0) on EP1 capture.
Syntax 6

SectionUseCase."HiFi" {
	File "/Google/husky/HiFi.conf"
	Comment "Speaker, earpiece and microphone"
}
