# SPDX-License-Identifier: MIT
# Pixel 8 Pro: speaker (both amps, stereo) and earpiece (top amp) through the
# deep-buffer path EP6, and the bottom microphone (AoC mic id 0) on EP1
# capture. Never use EP1 for output (UltraLL): it hangs the AoC firmware.
# The amplifiers run the protection firmware the phone's own vendor image
# provides (not part of this package). Levels stay at the Pixel 7 Pro's
# "media" stage or below (digital <= 737, analog <= 10) until the 8 Pro has
# verified ceilings of its own; never the 7 Pro's louder stage.
SectionVerb {
	EnableSequence [
		cset "name='Top Digital PCM Volume' 1"
		cset "name='Top Analog PCM Volume' 0"
		cset "name='Bottom Digital PCM Volume' 1"
		cset "name='Bottom Analog PCM Volume' 0"
		cset "name='Top PCM Source' DSP"
		cset "name='Top DSP1 Firmware' Protection"
		cset "name='Top DSP RX1 Source' ASPRX1"
		cset "name='Top DSP RX2 Source' ASPRX1"
		cset "name='Top ASP TX1 Source' VMON"
		cset "name='Top ASP TX2 Source' IMON"
		cset "name='Top DSP1 Preload Switch' on"
		cset "name='Bottom PCM Source' DSP"
		cset "name='Bottom DSP1 Firmware' Protection"
		cset "name='Bottom DSP RX1 Source' ASPRX1"
		cset "name='Bottom DSP RX2 Source' ASPRX1"
		cset "name='Bottom ASP TX1 Source' VMON"
		cset "name='Bottom ASP TX2 Source' IMON"
		cset "name='Bottom DSP1 Preload Switch' on"
		cset "name='TDM_0_RX Chan' Four"
		cset "name='TDM_0_RX Format' S32_LE"
		cset "name='TDM_0_RX Sample Rate' SR_48K"
		cset "name='TDM_0_RX Mixer EP6' 1"
		# recording: the bottom microphone (AoC mic id 0, the one that records speech; ids 1 and 2 power up
		# too but which hole they are is not settled), the DC blocker and the stock record gain
		cset "name='TDM_0_TX Chan' Four"
		cset "name='TDM_0_TX Format' S32_LE"
		cset "name='TDM_0_TX Sample Rate' SR_48K"
		cset "name='BUILDIN MIC ID CAPTURE LIST' 0,-1,-1,-1"
		cset "name='MIC DC Blocker' 1"
		cset "name='MIC Record Soft Gain (dB)' 22"
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' 1"
	]
	DisableSequence [
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' 0"

		cset "name='Top Digital PCM Volume' 1"
		cset "name='Bottom Digital PCM Volume' 1"
		cset "name='TDM_0_RX Mixer EP6' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo speakers: the earpiece speaker (Top amp) is the left channel, the bottom speaker (Bottom amp) the right"
	ConflictingDevice [ "Earpiece" ]
	EnableSequence [
		# the 7 Pro's "media" stage: digital <= 737, analog <= 10
		cset "name='Bottom Digital PCM Volume' 737"
		cset "name='Bottom Analog PCM Volume' 10"
		# the Top amp takes TDM slot 0 (left), the Bottom amp slot 1 (right); both at or below the media stage
		cset "name='Top Digital PCM Volume' 737"
		cset "name='Top Analog PCM Volume' 8"
	]
	DisableSequence [
		cset "name='Bottom Digital PCM Volume' 1"
		cset "name='Bottom Analog PCM Volume' 0"
		cset "name='Top Digital PCM Volume' 1"
		cset "name='Top Analog PCM Volume' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},${find-device:type=pcm,stream=playback,field=id,regex='^EP6 playback'}"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece (Top amp)"
	ConflictingDevice [ "Speaker" ]
	EnableSequence [
		cset "name='Top Digital PCM Volume' 657"
		cset "name='Top Analog PCM Volume' 0"
	]
	DisableSequence [
		cset "name='Top Digital PCM Volume' 1"
		cset "name='Top Analog PCM Volume' 0"
	]
	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},${find-device:type=pcm,stream=playback,field=id,regex='^EP6 playback'}"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Microphone (bottom, AoC mic id 0)"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},${find-device:type=pcm,stream=capture,field=id,regex='^EP1 capture'}"
		CaptureChannels 1
		CaptureRate 48000
	}
}
