# SPDX-License-Identifier: MIT
# "Voice Call" verb for the AoC sound card on cheetah (device/cheetah/
# AOC-PLAN.md C9k, docs/TELEPHONY-APPS-PLAN.md 2.3). Never the default: the
# HiFi verb ranks above it (PipeWire ranks "HiFi" before "Voice Call"), so a
# client has to choose this profile (wpctl or pactl set-card-profile,
# callaudiod later).
#
#   Earpiece  the earpiece, which is the top speaker: AoC entry point 6
#             ("EP6 playback", the same PCM as HiFi's Speaker) to TDM 0, with
#             the amplifiers in earpiece mode. Its enable sequence asks
#             omamobile-speaker-protection for earpiece mode (stock's handset
#             path: the top amplifier alone, DSP bypassed, analog <= 6,
#             digital <= 737; the bottom one muted) through
#             omamobile-earpiece@on.service, which the active local user may
#             start (polkit rule 50-omamobile-earpiece.rules); its disable
#             sequence asks for speaker mode again. A failed request fails
#             the device, so nothing plays to an earpiece that isn't one.
#             Only the left channel reaches the earpiece (slot 0, the top
#             amplifier): a mono stream plays whole, the right channel of a
#             stereo one goes to the muted bottom amplifier.
#
# Its sink is a separate node (".Voice_Call__Earpiece__sink"), so the
# speaker filter (pipewire/60-omamobile-speaker-loudness.conf, a smart filter
# on HiFi's Speaker sink only) and its limiter drive are not in front of it:
# the earpiece plays the stream as it is. The call's own audio never passes
# through here: the AoC and the modem exchange it, and omamobile-sitd owns
# the call PCMs and mixers (the verb names neither). Speakerphone, headset
# and the call microphone are later T4 devices. Nothing here touches an
# amplifier control directly: omamobile-speaker-protection checks the
# ceilings, and its watchdog mutes on anything the mode doesn't allow.

SectionVerb {
	EnableSequence [
		# TDM 0 in stock's format, as HiFi sets it
		cset "name='TDM_0_RX Chan' Four"
		cset "name='TDM_0_RX Format' S32_LE"
		cset "name='TDM_0_RX Sample Rate' SR_48K"
		cset "name='TDM_0_TX Chan' Four"
		cset "name='TDM_0_TX Format' S32_LE"
		cset "name='TDM_0_TX Sample Rate' SR_48K"

		# EP6 to TDM 0, as HiFi
		cset "name='TDM_0_RX Mixer EP6' 1"
	]

	DisableSequence [
		cset "name='TDM_0_RX Mixer EP6' 0"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		exec "/usr/bin/systemctl start --no-ask-password omamobile-earpiece@on.service"
	]

	DisableSequence [
		exec "/usr/bin/systemctl start --no-ask-password omamobile-earpiece@off.service"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},${find-device:type=pcm,stream=playback,field=id,regex='^EP6 playback'}"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}
