# SPDX-License-Identifier: MIT
# HiFi verb for the AoC sound card on raven (Pixel 6 Pro, gs101), after the stock audio HAL's
# own configuration (vendor/etc/mixer_paths.xml and
# audio_platform_configuration.xml):
#
#   Speaker  deep-buffer playback, AoC entry point 6 ("EP6 playback", stock
#            PCM 5), routed to TDM 0, where the two CS35L41 amplifiers play
#            slot 0 (top, left) and slot 1 (bottom, right);
#   Mic      recording, AoC entry point 1 ("EP1 capture", stock PCM 8), from
#            the built-in microphones (AoC mic IDs 0, 1, 2: raven's handset-mic path).
#
# The PCMs are found by their id, so the profile works whether the card has
# the stock PCM numbers or not (the AoC driver refuses a PCM whose number is
# not its entry point, so playback only works with the stock order anyway).
#
# The routes are set by the verb rather than by each device: an ASoC DPCM
# front end with no back end connected fails at prepare ("no backend DAIs
# enabled"), and PipeWire opens the PCMs while it probes the profile.
#
# Nothing here touches the amplifiers: their PCM source, DSP, calibration and
# gains belong to omamobile-speaker-protection (cheetah AOC-PLAN.md C8, raven AUDIO-PLAN.md R4).

SectionVerb {
	EnableSequence [
		# TDM 0, as the stock mixer_paths.xml sets it at init: four 32-bit
		# slots at 48 kHz. The format also sets the amplifiers' slot width
		# (cs35l41 hw_params takes it from the sample width), so the default
		# S16_LE would give them 16-bit slots against the AoC's 32-bit ones.
		cset "name='TDM_0_RX Chan' Four"
		cset "name='TDM_0_RX Format' S32_LE"
		cset "name='TDM_0_RX Sample Rate' SR_48K"
		cset "name='TDM_0_TX Chan' Four"
		cset "name='TDM_0_TX Format' S32_LE"
		cset "name='TDM_0_TX Sample Rate' SR_48K"

		# deep-buffer-playbackP: EP6 to TDM 0
		cset "name='TDM_0_RX Mixer EP6' 1"

		# handset-mic, handset-mic-post and audio-recordC
		cset "name='BUILDIN MIC ID CAPTURE LIST' 0,1,2,-1"
		cset "name='MIC DC Blocker' 1"
		cset "name='MIC Record Soft Gain (dB)' 22"
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' 1"
	]

	DisableSequence [
		cset "name='TDM_0_RX Mixer EP6' 0"
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},${find-device:type=pcm,stream=playback,field=id,regex='^EP6 playback'}"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},${find-device:type=pcm,stream=capture,field=id,regex='^EP1 capture'}"
		CaptureChannels 2
		CaptureRate 48000
	}
}
