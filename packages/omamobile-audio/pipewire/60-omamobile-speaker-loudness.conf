# SPDX-License-Identifier: MIT
# Tone and level shaping for the built-in speakers, before the amplifiers'
# protection DSP (device/cheetah/AOC-PLAN.md C9g). Left is the top speaker
# (the earpiece), right the bottom loudspeaker, as stock maps them.
#
# Stock shapes the speaker signal on the AoC (Waves; AOC-TUNING-RESEARCH.md),
# which we don't send yet, so without this the phone plays flat and sounds
# thin. In order:
#   mtx_t, mtx_b  input matrix: which input channel each speaker plays, and
#           how much of the other (stereo width; left/right swapped when the
#           phone is held in landscape the other way round; set by
#           omamobile-speaker-eq orient/follow). Normal: top = left,
#           bottom = right.
#   xlp*, xhp*  bass management (off by default): a 4th-order
#           Linkwitz-Riley crossover; with "bassmono" on, everything below it
#           goes, summed to mono, to the bottom speaker only, since the
#           earpiece can't play it
#   hsrc*, habs, hhp*, hlp  bass harmonics (off by default): the bass below
#           harm_freq is full-wave rectified, which makes its 2nd and 4th
#           harmonics at a level proportional to its own, and band-limited;
#           the ear hears the missing fundamental from them
#   pre_t, pre_b  mix of the above per speaker (gains set by the tool)
# then per speaker:
#   hp      high-pass, 4th-order Butterworth (two stages), at 20 Hz by
#           default since 0.5.4 (it was 100 Hz: below that these speakers
#           make no sound, only cone excursion; the protection firmware
#           and the limiter now carry that, and the owner preferred the
#           flat sound, AOC-PLAN C9j)
#   bass    low shelf, 0 dB by default since 0.5.4 (was +4 dB at 400 Hz)
#   dip     peaking cut in the presence region, 0 dB by default since
#           0.5.4 (was -2 dB at 3.5 kHz): with the boost converter off the
#           speakers are no longer harsh there
#   treble  high shelf (flat by default; for the earpiece's brightness)
#   trim    channel level (linear factor), for the balance between the two
#   lim     a look-ahead limiter per speaker at -3 dBFS, "drive" 6 dB by
#           default since 0.5.4: streamed music sits 10-15 dB under a test
#           tone, and the make-up gain gives it back while nothing reaches
#           the amplifiers above -3 dBFS (at "drive" 0 it only catches peaks). One per speaker, so bass peaks on
#           the bottom speaker don't duck the earpiece.
# The amplifiers stay at the stage's levels and ceilings
# (omamobile-speaker-protection); the protection firmware sees and tracks the
# shaped signal, and its excursion limiter assumes stock's higher analog gain.
#
# Every value can be changed while playing, for listening tests:
#   omamobile-speaker-eq show | preset default|flat|waves | set bass=3 ...
# (until PipeWire restarts; its "default" preset reads this file).
# "omamobile-speaker-eq save" keeps the user's values in a copy of this file
# under ~/.config/pipewire/pipewire.conf.d/ that sets omamobile.speaker-eq to
# "user", and this module then stays unloaded (its condition).
# A smart filter: WirePlumber puts it in front of the speaker sink only, so
# Bluetooth and USB audio are untouched. "nofail": if the filter can't load
# (a missing plugin), PipeWire still starts and the speaker plays unfiltered.
# Needs PipeWire's builtin "abs" (PipeWire 1.4 or later) and swh-plugins.
context.properties = {
    omamobile.speaker-eq = package
}
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        condition = [ { omamobile.speaker-eq = package } ]
        args = {
            node.description = "Speaker loudness"
            media.name = "Speaker loudness"
            filter.graph = {
                nodes = [
                    { type = builtin name = in_l     label = copy }
                    { type = builtin name = in_r     label = copy }
                    { type = builtin name = mtx_t    label = mixer        control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
                    { type = builtin name = mtx_b    label = mixer        control = { "Gain 1" = 0.0 "Gain 2" = 1.0 } }
                    { type = builtin name = sum      label = mixer        control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
                    { type = builtin name = xlp1     label = bq_lowpass   control = { "Freq" = 500.0 "Q" = 0.707 } }
                    { type = builtin name = xlp2     label = bq_lowpass   control = { "Freq" = 500.0 "Q" = 0.707 } }
                    { type = builtin name = xhp_t1   label = bq_highpass  control = { "Freq" = 500.0 "Q" = 0.707 } }
                    { type = builtin name = xhp_t2   label = bq_highpass  control = { "Freq" = 500.0 "Q" = 0.707 } }
                    { type = builtin name = xhp_b1   label = bq_highpass  control = { "Freq" = 500.0 "Q" = 0.707 } }
                    { type = builtin name = xhp_b2   label = bq_highpass  control = { "Freq" = 500.0 "Q" = 0.707 } }
                    { type = builtin name = hsrc1    label = bq_lowpass   control = { "Freq" = 200.0 "Q" = 0.707 } }
                    { type = builtin name = hsrc2    label = bq_lowpass   control = { "Freq" = 200.0 "Q" = 0.707 } }
                    { type = builtin name = habs     label = abs }
                    { type = builtin name = hhp1     label = bq_highpass  control = { "Freq" = 200.0 "Q" = 0.707 } }
                    { type = builtin name = hhp2     label = bq_highpass  control = { "Freq" = 200.0 "Q" = 0.707 } }
                    { type = builtin name = hlp      label = bq_lowpass   control = { "Freq" = 800.0 "Q" = 0.707 } }
                    { type = builtin name = pre_t    label = mixer        control = { "Gain 1" = 1.0 "Gain 2" = 0.0 "Gain 3" = 0.0 } }
                    { type = builtin name = pre_b    label = mixer        control = { "Gain 1" = 1.0 "Gain 2" = 0.0 "Gain 3" = 0.0 "Gain 4" = 0.0 } }
                    { type = builtin name = hp_l     label = bq_highpass  control = { "Freq" = 20.0 "Q" = 0.5412 } }
                    { type = builtin name = hp2_l    label = bq_highpass  control = { "Freq" = 20.0 "Q" = 1.3066 } }
                    { type = builtin name = hp_r     label = bq_highpass  control = { "Freq" = 20.0 "Q" = 0.5412 } }
                    { type = builtin name = hp2_r    label = bq_highpass  control = { "Freq" = 20.0 "Q" = 1.3066 } }
                    { type = builtin name = bass_l   label = bq_lowshelf  control = { "Freq" = 400.0 "Q" = 0.707 "Gain" = 0.0 } }
                    { type = builtin name = bass_r   label = bq_lowshelf  control = { "Freq" = 400.0 "Q" = 0.707 "Gain" = 0.0 } }
                    { type = builtin name = dip_l    label = bq_peaking   control = { "Freq" = 3500.0 "Q" = 1.2 "Gain" = 0.0 } }
                    { type = builtin name = dip_r    label = bq_peaking   control = { "Freq" = 3500.0 "Q" = 1.2 "Gain" = 0.0 } }
                    { type = builtin name = treble_l label = bq_highshelf control = { "Freq" = 6000.0 "Q" = 0.707 "Gain" = 0.0 } }
                    { type = builtin name = treble_r label = bq_highshelf control = { "Freq" = 6000.0 "Q" = 0.707 "Gain" = 0.0 } }
                    { type = builtin name = trim_l   label = linear       control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = builtin name = trim_r   label = linear       control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = ladspa  name = lim_t    plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter control = { "Input gain (dB)" = 6.0 "Limit (dB)" = -3.0 "Release time (s)" = 0.2 } }
                    { type = ladspa  name = lim_b    plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter control = { "Input gain (dB)" = 6.0 "Limit (dB)" = -3.0 "Release time (s)" = 0.2 } }
                ]
                links = [
                    { output = "in_l:Out"     input = "mtx_t:In 1" }
                    { output = "in_r:Out"     input = "mtx_t:In 2" }
                    { output = "in_l:Out"     input = "mtx_b:In 1" }
                    { output = "in_r:Out"     input = "mtx_b:In 2" }
                    { output = "mtx_t:Out"    input = "sum:In 1" }
                    { output = "mtx_b:Out"    input = "sum:In 2" }
                    { output = "sum:Out"      input = "xlp1:In" }
                    { output = "xlp1:Out"     input = "xlp2:In" }
                    { output = "mtx_t:Out"    input = "xhp_t1:In" }
                    { output = "xhp_t1:Out"   input = "xhp_t2:In" }
                    { output = "mtx_b:Out"    input = "xhp_b1:In" }
                    { output = "xhp_b1:Out"   input = "xhp_b2:In" }
                    { output = "sum:Out"      input = "hsrc1:In" }
                    { output = "hsrc1:Out"    input = "hsrc2:In" }
                    { output = "hsrc2:Out"    input = "habs:In" }
                    { output = "habs:Out"     input = "hhp1:In" }
                    { output = "hhp1:Out"     input = "hhp2:In" }
                    { output = "hhp2:Out"     input = "hlp:In" }
                    { output = "mtx_t:Out"    input = "pre_t:In 1" }
                    { output = "xhp_t2:Out"   input = "pre_t:In 2" }
                    { output = "hlp:Out"      input = "pre_t:In 3" }
                    { output = "mtx_b:Out"    input = "pre_b:In 1" }
                    { output = "xhp_b2:Out"   input = "pre_b:In 2" }
                    { output = "xlp2:Out"     input = "pre_b:In 3" }
                    { output = "hlp:Out"      input = "pre_b:In 4" }
                    { output = "pre_t:Out"    input = "hp_l:In" }
                    { output = "hp_l:Out"     input = "hp2_l:In" }
                    { output = "hp2_l:Out"    input = "bass_l:In" }
                    { output = "bass_l:Out"   input = "dip_l:In" }
                    { output = "dip_l:Out"    input = "treble_l:In" }
                    { output = "treble_l:Out" input = "trim_l:In" }
                    { output = "trim_l:Out"   input = "lim_t:Input 1" }
                    { output = "pre_b:Out"    input = "hp_r:In" }
                    { output = "hp_r:Out"     input = "hp2_r:In" }
                    { output = "hp2_r:Out"    input = "bass_r:In" }
                    { output = "bass_r:Out"   input = "dip_r:In" }
                    { output = "dip_r:Out"    input = "treble_r:In" }
                    { output = "treble_r:Out" input = "trim_r:In" }
                    { output = "trim_r:Out"   input = "lim_b:Input 1" }
                ]
                inputs = [ "in_l:In" "in_r:In" ]
                outputs = [ "lim_t:Output 1" "lim_b:Output 1" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "effect_input.omamobile_speaker_loudness"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "omamobile-speaker-loudness"
                # The node name is the same on every AoC phone (the Pixel 9a's
                # speaker sink has it too); the card name keeps the filter on
                # the Pixel 7 Pro's card. Every key must match.
                filter.smart.target = {
                    node.name = "alsa_output.platform-sound-aoc.HiFi__Speaker__sink"
                    api.alsa.card.name = "google,aoc-snd-card"
                }
            }
            playback.props = {
                node.name = "effect_output.omamobile_speaker_loudness"
                node.passive = true
            }
        }
    }
]
