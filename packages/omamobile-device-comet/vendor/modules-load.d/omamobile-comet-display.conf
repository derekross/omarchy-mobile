# The inner display and its GPU, loaded early in boot so that SDDM finds a
# DRM card. Order is the dependency order: the DSI command host, then DECON
# (stage 2 = KMS, the default), then Panthor. Proven by hand on kernel #5
# (DISPLAY-PLAN.md). The cover panel (panel_google_ct3d), touch, gauge,
# charger, haptics and Wi-Fi stay out: each waits for its own runbook.
gs_dsim_cmd
gs_decon
panthor
