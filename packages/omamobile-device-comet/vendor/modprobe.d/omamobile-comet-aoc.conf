# SPDX-License-Identifier: MIT
# Offline AoC preparation only: no automatic load, start, or firmware request.
# Explicit modprobe is reserved for an approved AOC-PLAN stage.
# These are the Trusty, GSA, AoC and amplifier modules the comet zumapro
# kernel builds (its AoC/Trusty stack is not in linux-omarchy-mobile yet).
# gs201's AoC module names are not built for zumapro and are not listed.
blacklist trusty
blacklist trusty_log
blacklist trusty_irq
blacklist trusty_ipc
blacklist trusty_virtio
blacklist exynos_gsa
blacklist comet_aoc_s2mpu
blacklist aoc
blacklist aoc_channel
blacklist aoc_usf
blacklist aoc_usf_iio
blacklist aoc_audio
blacklist hci_aoc
blacklist snd_soc_cs35l41_spi
