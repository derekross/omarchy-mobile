# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 9 Pro Fold (comet), headless internal root.
# See NOTES.md. Data only: this is a staged port, not an installable
# release. No shell.
CODENAME=comet
NAME="Pixel 9 Pro Fold"
SOC=zumapro
COMPATIBLE="google,zumapro-comet"
PACKAGE=omamobile-device-comet

# The PMIC variant is flattened into the board file on comet-dt-board.
DTB=exynos/google/zumapro-comet.dtb
# Deliberately no SOC_IDS: this loader uses /soc_compatible matching.
# Stock vendor_kernel_boot carries four zumapro DTBs (NOTES.md):
# product_id 0x9875, major 0, minor 0/1, FOPLP (pkg_mode 0) and IPOP
# (pkg_mode 1). The staged common DT carries this verified candidate union;
# this does not identify the retail phone's exact package and stepping.
SOC_COMPATIBLE="a0-foplp:0x9875:0:0:0 a1-foplp:0x9875:0:1:0 a0-ipop:0x9875:0:0:1 a1-ipop:0x9875:0:1:1"
# Do not use a dummy soc_id or borrow another SoC's values to bypass
# the check. Requires the shared-base kernel and BRINGUP-M1.md;
# this is a headless bring-up configuration, not a supported release.
# Stock boot and init_boot: AOSP avbtool info_image and verify_image,
# CP3A.261005.005 (NOTES.md). Both use the same rollback index.
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
AVB_ROLLBACK_INDEX=1791158400
AVB_SECURITY_PATCH=2026-10-05

DTBO_SOURCE=comet-m1-overlay.dts
DTBO_BOARD_ID=0x60606
DTBO_BOARD_REV=0x10000
DTB_OVERLAYS=""
VENDOR_CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
# Stock CP3A.261005.005 init_boot header; check against the build on
# both slots before flashing (CONTRIBUTING.md section 3.1).
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10
BOOT_METHOD=android-v4
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

INITRAMFS_INIT=/initramfs/init
# No SIMPLEFB_TRIG_CON: no Comet display register write is admitted,
# and writing the wrong DECON (cover vs inner) is a display fault, not
# a fallback. No BRINGUP_PROBE either: its reads cover every display
# DMA channel, including the inner panel.
PANEL_SIZE=1080x2424
# Cover panel, portrait (dumpsys display); inner is 2076x2152.

INITRAMFS_MODULES="exynos-mailbox sec-acpm s2mps11 phy-snps-eusb2 phy-exynos5-usbdrd dwc3-zumapro phy-exynos-ufs ufs-exynos"

# Require our root label before handing over to userdata.
ROOT_LABEL=omamobile-root
