# SPDX-License-Identifier: MIT
# omamobile-waydroid settings, read by omamobile-waydroid (WAYDROID-PLAN.md).
# Android system image for "omamobile-waydroid init": VANILLA (no Google)
# or FOSS. The project doesn't ship or set up Google apps.
SYSTEM_TYPE=VANILLA
# Android's density: the shell's 3x scale (160 dpi * 3).
LCD_DENSITY=480
# One Hyprland window per Android app (Waydroid's multi-window mode).
MULTI_WINDOWS=true
