# SPDX-License-Identifier: MIT
# Included at the end of /var/lib/waydroid/lxc/waydroid/config by
# omamobile-waydroid-harden (WAYDROID-PLAN.md W3).
#
# Waydroid's container is privileged and keeps CAP_MKNOD and CAP_SYS_ADMIN.
# Nothing Android needs here is a block device, so deny all of them: Android
# must never be able to make a node for the UFS (/dev/sda...), clear the
# storage guard's read-only flag or write a partition.
#
# With LXC 7's cgroup2 device filter a list with only a deny rule allows
# nothing at all, not even /dev/null, and lxc-start dies with "Can't open
# /dev/null: Operation not permitted". So allow the character devices Android
# uses first, then deny every block device. The allow lines must stay ahead
# of the deny (test/all checks the order). They are the standard nodes and the
# ones Waydroid binds (its generated config_nodes); each is checked on a
# Pixel 7 Pro: the container starts, Android boots, GLES is Mesa/Panfrost and
# the network works. Of these only binder was shown to be needed (without it
# Android's init reboots the container); the others are the nodes Waydroid
# binds or Android opens.
lxc.cgroup2.devices.allow = c 1:3 rwm
lxc.cgroup2.devices.allow = c 1:5 rwm
lxc.cgroup2.devices.allow = c 1:7 rwm
lxc.cgroup2.devices.allow = c 1:8 rwm
lxc.cgroup2.devices.allow = c 1:9 rwm
lxc.cgroup2.devices.allow = c 1:11 rwm
lxc.cgroup2.devices.allow = c 5:* rwm
lxc.cgroup2.devices.allow = c 136:* rwm
lxc.cgroup2.devices.allow = c 10:200 rwm
lxc.cgroup2.devices.allow = c 10:229 rwm
lxc.cgroup2.devices.allow = c 226:128 rwm
# binderfs (binder, vndbinder, hwbinder). Its major is assigned when the
# kernel boots, not fixed: 507 on the cheetah kernel. omamobile-waydroid-check
# compares this line with the "binder" line of /proc/devices before every
# container start and refuses to start when they differ.
lxc.cgroup2.devices.allow = c 507:* rwm
lxc.cgroup2.devices.deny = b *:* rwm
