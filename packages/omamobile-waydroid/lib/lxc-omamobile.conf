# Included at the end of /var/lib/waydroid/lxc/waydroid/config by
# omamobile-waydroid-harden (WAYDROID-PLAN.md W3).
#
# Waydroid's container is privileged and keeps CAP_MKNOD and CAP_SYS_ADMIN.
# Nothing Android needs here is a block device, so deny all of them: Android
# must never be able to make a node for the UFS (/dev/sda...), clear the
# storage guard's read-only flag or write a partition.
#
# How LXC 7's cgroup2 device filter treats this file: it starts in "block
# everything" mode, and in that mode deny rules are left out of the device
# program. So with only a deny rule nothing is allowed, not even /dev/null,
# and lxc-start dies with "Can't open /dev/null: Operation not permitted".
# The allow lines below are the character devices Android uses. Block devices
# are refused because no rule allows a "b" device; the order of the allow and
# deny lines does not matter. The deny line still matters in one case: an
# "lxc.cgroup2.devices.allow = a" placed before this include switches LXC to
# "allow everything" mode, and the deny is what keeps block devices out then.
# A global "allow = a" placed after this include would clear every rule above
# it and open all devices: never add one (test/all fails if this file has one,
# and omamobile-waydroid-harden verify refuses one in Waydroid's generated
# config files before every container service start).
#
# The allow lines are the standard nodes and the ones Waydroid binds (its
# generated config_nodes); each is checked on a Pixel 7 Pro: the container
# starts, Android boots, GLES is Mesa/Panfrost and the network works. Of these
# only binder was shown to be needed (without it Android's init reboots the
# container); the others are the nodes Waydroid binds or Android opens.
#
# /dev/uhid (c 10:239) is deliberately left out, although Waydroid binds it
# for adb. It creates real HID devices on the host, which Hyprland picks up
# like any keyboard or mouse, so root inside the container could type into the
# phone's own session. Android boots without it and nothing in logcat or dmesg
# asks for it. If an Android feature turns out to need it, add it back with
# that feature as the reason.
lxc.cgroup2.devices.allow = c 1:3 rwm
lxc.cgroup2.devices.allow = c 1:5 rwm
lxc.cgroup2.devices.allow = c 1:7 rwm
lxc.cgroup2.devices.allow = c 1:8 rwm
lxc.cgroup2.devices.allow = c 1:9 rwm
lxc.cgroup2.devices.allow = c 1:11 rwm
lxc.cgroup2.devices.allow = c 5:* rwm
lxc.cgroup2.devices.allow = c 136:* rwm
lxc.cgroup2.devices.allow = c 10:200 rwm
lxc.cgroup2.devices.allow = c 10:229 rwm
lxc.cgroup2.devices.allow = c 226:128 rwm
# binderfs (binder, vndbinder, hwbinder). Its major is assigned when the
# kernel boots, not fixed (507 on the cheetah kernel), so these are given as
# paths: LXC reads each node's major and minor with stat() when the container
# starts, after Waydroid has mounted binderfs on /dev/binderfs. If one of the
# nodes is missing then, lxc-start fails ("Failed to parse device rule")
# instead of starting an Android that cannot boot. binder-control is not
# allowed. omamobile-waydroid-check refuses to start without these three lines.
lxc.cgroup2.devices.allow = /dev/binderfs/binder rwm
lxc.cgroup2.devices.allow = /dev/binderfs/vndbinder rwm
lxc.cgroup2.devices.allow = /dev/binderfs/hwbinder rwm
lxc.cgroup2.devices.deny = b *:* rwm
