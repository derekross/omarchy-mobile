# The OnePlus 8T's two TFA9874 amplifiers share the tertiary MI2S port, one
# 16-bit TDM slot each (top/earpiece slot 0, bottom slot 1). A 24-bit
# stream widens the port's slots, so the bottom amplifier reads the wrong
# bits and only the earpiece plays. Keep the speaker sink at 16 bits.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*Speaker.*" } ]
    actions = { update-props = { audio.format = "S16LE" } }
  }
]
