# Use case configuration for the OnePlus 8T (kebab), SM8250.
# Speakers: two NXP TFA9874 amplifiers on the tertiary MI2S port, fed from
# MultiMedia1 (PCM 0) through the ADSP's routing mixer.
# Microphone: the main digital mic on DMIC3 (stock's handset mic; DMIC1 is
# the second mic), read through the VA macro into MultiMedia3 (PCM 2). At
# the decimator's default 0 dB speech is very quiet; +20 dB (104) suits it.

SectionVerb {
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	EnableSequence [
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC3"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 104"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
