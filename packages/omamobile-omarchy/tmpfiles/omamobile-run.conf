# /run is 0755, as systemd mounts it. Boot images from before 2026-11-11
# (#437) mounted it with tmpfs's default, 1777, and Omarchy 4.5 refuses to
# work under a /run anyone can write: its sudo migration (1788163635) stops
# `omarchy update`, and its pacman hooks abort later transactions (#447).
# A new boot image only helps after a restart, and only where a device
# package carries one. This line is applied by pacman's own tmpfiles hook in
# the transaction that installs it, before Omarchy's migrations run, and at
# every boot.
z /run 0755 root root - -
