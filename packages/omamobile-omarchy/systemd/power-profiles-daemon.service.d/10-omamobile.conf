# Omamobile: a phone has no P-state driver and no ACPI platform profile, so
# power-profiles-daemon would fall back to its placeholder, which offers only
# Power-saver and Balanced. Its fake driver offers all three; like the
# placeholder it changes nothing itself, and omamobile-power-profile.service
# sets the CPU limits for each (#1027). It reads no keys unless its output is
# a terminal, which under systemd it never is.
[Service]
Environment=POWER_PROFILE_DAEMON_FAKE_DRIVER=1
