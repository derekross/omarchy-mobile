[Unit]
# A phone's kernels come as modules trees from `bin/omamobile modules-push`,
# never from pacman. Arch's cleanup moves every tree that isn't the running
# kernel and that no package owns to /usr/lib/modules/.old at each boot, so a
# boot between a push and the reboot into the new kernel took the next
# kernel's drivers away. Held off while this
# package is installed; omamobile-modules-cleanup.timer prunes instead,
# keeping the running, next-boot and rollback trees.
ConditionPathExists=!/usr/share/omamobile/omarchy/version
