# Omarchy Mobile: swap on zram at half the RAM, not Omarchy's whole RAM.
# Omarchy's 90-omarchy.conf sets zram-size = ram. On the Pixel 9a (7.4 GB)
# that hung the phone under a 6 GB load until a restart, while ram / 2,
# stock Android's size there, took 5 GB more with no OOM kill and SSH still
# answering (device/tegu/NOTES.md, 2026-11-08). Drop-ins are read in name
# order across /usr/lib, /run and /etc, so this one, sorting after
# 90-omarchy.conf, sets the size and leaves Omarchy's other settings
# (zstd, the swap priority) alone. A local size goes in
# /etc/systemd/zram-generator.conf.d/99-local.conf, which sorts after this.
[zram0]
zram-size = ram / 2
