# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel Fold (felix), first light.
#
# Same rules as device/cheetah/device.conf. No shell.

# --- Identity ---
CODENAME=felix
NAME="Pixel Fold"
SOC=gs201
COMPATIBLE="google,gs201-felix"
# Storage guard and USB networking. No radio, charge, or camera services,
# and no boot-success marker.
PACKAGE=omamobile-device-felix

# --- Kernel and device tree ---
DTB=exynos/google/gs201-felix.dtb
# Built value first. The packer rewrites a second copy for the other id.
SOC_IDS="b0:0x9855001 a0:0x9855000"
# No DTB_OVERLAYS by default. cover-touch.dtso is the gated cover-touch
# id read (COVER-TOUCH-PLAN.md). New nodes stay disabled until that
# overlay is applied for one boot.

# --- Bootloader glue ---
DTBO_SOURCE=felix-m1-overlay.dts
DTBO_BOARD_ID=0x30606
DTBO_BOARD_REV=0x10000
VENDOR_CMDLINE="console=tty0 earlycon=exynos4210,0x10A00000 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10

# --- Storage guard ---
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

# --- Initramfs ---
# Shared script. Pairs on one line: the descriptor parser accepts only
# KEY=value. Cover DECON1 uses tear source DDI1. Inner DECON0 uses tear
# source DDI0. Neither pair is the 120 Hz sequence. The inner write makes
# DECON0 scan 0xfac00000. A Fold image with this descriptor needs the
# reservation in linux-omarchy-mobile#72. Do not pack it onto a kernel
# that leaves that range as ordinary RAM.
# No BRINGUP_PROBE: those reads cover every DPP, including the inner one.
INITRAMFS_INIT=/initramfs/init
SIMPLEFB_TRIG_CON="0x1c241030 0x01003061 0x1c240030 0x00003061"
# Cover panel, portrait. The init draws a splash only when the command
# line says splash, which this phone's bootargs do not.
PANEL_SIZE=1080x2092
