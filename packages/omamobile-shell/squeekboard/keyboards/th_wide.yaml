# SPDX-License-Identifier: GPL-3.0-or-later
# squeekboard 1.43.1's th_wide.yaml (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later), with two changes for Omarchy Mobile: the
# action row (Mic, Paste, Emoji, Hide; XF86 keysyms that hypr/phone.lua
# binds for squeekboard only) on top of every view, and the globe key
# sending XF86MediaLanguageMenu (the shell's language sheet) instead of
# opening squeekboard's popover. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 672: 2 x 201.6 + 2 x 134.4.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: Thai
---
outlines:
    default:       { width: 56,  height: 42 }
    change-view:   { width: 56,  height: 42 }
    change-view-2: { width: 112, height: 42 }
    fill:          { width: 112, height: 42 }
    large:         { width: 70,  height: 42 }
    placeholder:   { width: 56,  height: 42 }
    spaceline:     { width: 308, height: 42 }
    special:       { width: 56,  height: 42 }
    special-2:     { width: 70,  height: 42 }
    special-3:     { width: 112, height: 42 }
    mic:           { width: 201.6, height: 32 }
    paste:         { width: 201.6, height: 32 }
    emoji:         { width: 134.4, height: 32 }
    hide:          { width: 134.4, height: 32 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "ๅ / _ ภ ถ ุ ึ ค ต จ ข ช"
        - "ๆ ไ ำ พ ะ ั ี ร น ย บ ล"
        - "ฟ ห ก ด เ ้ ่ า ส ว ง ฃ"
        - "show_upper ผ ป แ อ ิ ื ท ม ใ ฝ BackSpace"
        - "show_numbers preferences space .-large Return"
    upper:
        - "Mic Paste Emoji Hide"
        - "+ ๑ ๒ ๓ ๔ ู ฿ ๕ ๖ ๗ ๘ ๙"
        - "๐ \" ฎ ฑ ธ ํ ๊ ณ ฯ ญ ฐ ,"
        - "ฤ ฆ ฏ โ ฌ ็ ๋ ษ ศ ซ . ฅ"
        - "show_upper ( ) ฉ ฮ ฺ ์ ? ฒ ฬ ฦ BackSpace"
        - "show_numbers preferences space .-large Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "-- -- -- -- -- -- -- -- -- -- ² ³"
        - "1 2 3 4 5 6 7 8 9 0"
        - "@ # $ % & - _ + ( )"
        - "show_symbols , \" ' : ; ! ? BackSpace"
        - "show_letters preferences space .-large Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "-- -- -- -- -- -- -- -- -- -- ² ²"
        - "© ® £ € ¥ ^ ° * { }"
        - "~ ` | · √ π τ ÷ × ¶"
        - "show_numbers_from_symbols \\ / < > = [ ] BackSpace"
        - "show_letters preferences space .-large Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        keysym: "XF86MediaLanguageMenu"
        outline: "special-2"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view-2"
        label: "123"
    show_numbers_from_symbols:
        action:
            set_view: "numbers"
        outline: "change-view-2"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view-2"
        label: "กขค"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view-2"
        label: "*/="
    space:
        outline: "spaceline"
        text: " "
    Return:
        outline: "special-3"
        icon: "key-enter"
        keysym: "Return"
    --:
        outline: "placeholder"
        text: ""
    .-large:
        outline: "large"
        text: "."
    5:
        outline: "fill"
    6:
        outline: "fill"
    "&":
        outline: "fill"
    -:
        outline: "fill"
    "'":
        outline: "fill"
    ::
        outline: "fill"
    ¥:
        outline: "fill"
    ^:
        outline: "fill"
    √:
        outline: "fill"
    π:
        outline: "fill"
    <:
        outline: "fill"
    ">":
        outline: "fill"
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
