# SPDX-License-Identifier: GPL-3.0-or-later
# at.yaml (German (Austria)): xkeyboard-config 2.48's symbols for "at", default variant
# (squeekboard/xkb/at.txt, xkeyboard-config's licence in squeekboard/xkb/COPYING),
# on squeekboard 1.43.1's de.yaml as the template (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later): each letter key types what xkb has on the
# same key, level 1 in the base view and level 2 in upper.
# Template keys moved to another letter: none.
# Letters in a row of their own under the action row: ü ö ä.
# Follows the xkb default, not yet checked by a speaker: corrections
# from people who type it are welcome (docs/KEYBOARD-LAYOUTS.md).
# With the action row and the globe key of every layout. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 356.57: 2 x 106.971 + 2 x 71.314.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: German (Austria)
---
outlines:
    default:          { width: 35.657, height: 52 }
    change-view:      { width: 53.485, height: 52 }
    spaceline:        { width: 89.144, height: 52 }
    special:          { width: 35.657, height: 52 }
    special-2:        { width: 53.485, height: 52 }
    subtle-highlight: { width: 35.657, height: 52 }
    mic:              { width: 106.971, height: 40 }
    paste:            { width: 106.971, height: 40 }
    emoji:            { width: 71.314, height: 40 }
    hide:             { width: 71.314, height: 40 }
    extra:            { width: 35.657, height: 32 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "ü-extra ö-extra ä-extra"
        - "q w e r t z u i o p"
        - "a s d f g h j k l ß"
        - "show_upper y x c v b n m BackSpace"
        - "show_numbers show_eschars preferences space , . Return"
    upper:
        - "Mic Paste Emoji Hide"
        - "Ü-extra Ö-extra Ä-extra"
        - "Q W E R T Z U I O P"
        - "A S D F G H J K L -"
        - "show_upper Y X C V B N M BackSpace"
        - "show_numbers show_eschars preferences space ! ? Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "1 2 3 4 5 6 7 8 9 0"
        - "@ # € % & - _ + ( )"
        - "show_symbols ; \" ' : = < > BackSpace"
        - "show_letters show_eschars preferences space , . Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "~ ` ´ | · √ µ ÷ × ¶"
        - "© ® £ $ ¥ ^ ° * { }"
        - "show_numbers \\ / § π τ [ ] BackSpace"
        - "show_letters show_eschars preferences space , . Return"
    eschars:
        - "Mic Paste Emoji Hide"
        - "ä è é ö ü Ä È É Ö Ü"
        - "à â ê î ô À Â Ê Î Ô"
        - "show_numbers « » ç Ç æ œ ß-subtle-highlight BackSpace"
        - "show_letters show_eschars preferences space „ “ Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special-2"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        keysym: "XF86MediaLanguageMenu"
        outline: "special"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view"
        label: "ABC"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view"
        label: "*/="
    show_eschars:
        action:
            locking:
                lock_view: "eschars"
                unlock_view: "base"
        outline: "change-view"
        label: "Ää"
    space:
        outline: "spaceline"
        text: " "
    Return:
        outline: "special-2"
        icon: "key-enter"
        keysym: "Return"
    ä:
        outline: "subtle-highlight"
    ö:
        outline: "subtle-highlight"
    ü:
        outline: "subtle-highlight"
    Ä:
        outline: "subtle-highlight"
    Ö:
        outline: "subtle-highlight"
    Ü:
        outline: "subtle-highlight"
    ß-subtle-highlight:
        outline: "subtle-highlight"
        text: "ß"
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
    # Letters xkb has on keys the template has no place for, one key each
    ü-extra:
        outline: "extra"
        text: "ü"
    ö-extra:
        outline: "extra"
        text: "ö"
    ä-extra:
        outline: "extra"
        text: "ä"
    Ü-extra:
        outline: "extra"
        text: "Ü"
    Ö-extra:
        outline: "extra"
        text: "Ö"
    Ä-extra:
        outline: "extra"
        text: "Ä"
