# SPDX-License-Identifier: GPL-3.0-or-later
# squeekboard 1.43.1's rs_wide.yaml (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later), with two changes for Omarchy Mobile: the
# action row (Mic, Paste, Emoji, Hide; XF86 keysyms that hypr/phone.lua
# binds for squeekboard only) on top of every view, and the globe key
# sending XF86MediaLanguageMenu (the shell's language sheet) instead of
# opening squeekboard's popover. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 537.592: 2 x 161.278 + 2 x 107.518.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: Serbian
---
outlines:
    default:     { width: 48.872, height: 42 }
    change-view: { width: 73.308, height: 42 }
    placeholder: { width: 48.872, height: 42 }
    spaceline:   { width: 244.36, height: 42 }
    special:     { width: 48.872, height: 42 }
    special-2:   { width: 73.308, height: 42 }
    special-3:   { width: 73.308, height: 42 }
    mic:         { width: 161.278, height: 32 }
    paste:       { width: 161.278, height: 32 }
    emoji:       { width: 107.518, height: 32 }
    hide:        { width: 107.518, height: 32 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "љ њ е р т з у и о п ш"
        - "а с д ф г х ј к л ч ћ"
        - "show_upper џ ц в б н м ђ ж BackSpace"
        - "show_numbers preferences space , . Return"
    upper:
        - "Mic Paste Emoji Hide"
        - "Љ Њ Е Р Т З У И О П Ш"
        - "А С Д Ф Г Х Ј К Л Ч Ћ"
        - "show_upper Џ Ц В Б Н М Ђ Ж BackSpace"
        - "show_numbers preferences space ! ? Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "1 2 3 4 5 6 7 8 9 0 ²"
        - "@ # $ % & - _ + ( ) ³"
        - "show_symbols , \" ' : ; ! ? -- BackSpace"
        - "show_letters preferences space , . Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "~ ` | · √ π τ ÷ × ¶ ²"
        - "© ® £ € ¥ ^ ° * { } ³"
        - "show_numbers \\ / < > = [ ] -- BackSpace"
        - "show_letters preferences space , . Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special-2"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        keysym: "XF86MediaLanguageMenu"
        outline: "special"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view"
        label: "ABC"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view"
        label: "*/="
    space:
        outline: "spaceline"
        text: " "
    Return:
        outline: "special-3"
        icon: "key-enter"
        keysym: "Return"
    --:
        outline: "placeholder"
        text: ""
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
