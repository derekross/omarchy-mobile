# SPDX-License-Identifier: GPL-3.0-or-later
# squeekboard 1.43.1's ua.yaml (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later), with two changes for Omarchy Mobile: the
# action row (Mic, Paste, Emoji, Hide; XF86 keysyms that hypr/phone.lua
# binds for squeekboard only) on top of every view, and the globe key
# sending XF86MediaLanguageMenu (the shell's language sheet) instead of
# opening squeekboard's popover. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 356.565: 2 x 106.969 + 2 x 71.313.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: Ukrainian
---
outlines:
    default:        { width: 32.415,  height: 52 }
    change-view:    { width: 32.415,  height: 52 }
    change-view-2:  { width: 64.83,   height: 52 }
    fill:           { width: 64.83,   height: 52 }
    large:          { width: 35.656,  height: 52 }
    spaceline:      { width: 90.763,  height: 52 }
    spaceline-fill: { width: 155.593, height: 52 }
    special:        { width: 32.415,  height: 52 }
    special-2:      { width: 35.656,  height: 52 }
    special-3:      { width: 64.83,   height: 52 }
    mic:            { width: 106.969, height: 40 }
    paste:          { width: 106.969, height: 40 }
    emoji:          { width: 71.313, height: 40 }
    hide:           { width: 71.313, height: 40 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "й ц у к е н г ш щ з х"
        - "ф і в а п р о л д ж є"
        - "show_upper я ч с м и т ь б ю BackSpace"
        - "show_numbers preferences ґ space ї . Return"
    upper:
        - "Mic Paste Emoji Hide"
        - "Й Ц У К Е Н Г Ш Щ З Х"
        - "Ф І В А П Р О Л Д Ж Є"
        - "show_upper Я Ч С М И Т Ь Б Ю BackSpace"
        - "show_numbers preferences Ґ space Ї ,-large Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "1 2 3 4 5 6 7 8 9 0 ²"
        - "@ # $ % & - _ + ( ) ³"
        - "show_symbols , \" ' : ; ! ? BackSpace-wide"
        - "show_letters preferences space-fill . Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "~ ` | · √ π τ ÷ × ¶ ²"
        - "© ® £ € ¥ ^ ° * { } ³"
        - "show_numbers \\ / < > = [ ] BackSpace-wide"
        - "show_letters preferences space-fill . Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special"
        icon: "edit-clear-symbolic"
        action: "erase"
    BackSpace-wide:
        outline: "special-3"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        keysym: "XF86MediaLanguageMenu"
        outline: "special-2"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view-2"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view-2"
        label: "АБВ"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view-2"
        label: "*/="
    space:
        outline: "spaceline"
        text: " "
    space-fill:
        outline: "spaceline-fill"
        text: " "
    Return:
        outline: "special-3"
        icon: "key-enter"
        keysym: "Return"
    .:
        outline: "large"
    ",-large":
        outline: "large"
        text: ","
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
