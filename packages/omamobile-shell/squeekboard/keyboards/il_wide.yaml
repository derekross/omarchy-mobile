# SPDX-License-Identifier: GPL-3.0-or-later
# squeekboard 1.43.1's il_wide.yaml (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later), with one change for Omarchy Mobile: the
# action row (Mic, Paste, Emoji, Hide; XF86 keysyms that hypr/phone.lua
# binds for squeekboard only) on top of every view. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 537.6: 2 x 161.28 + 2 x 107.52.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: Hebrew
---
outlines:
    default:     { width: 53.76,  height: 42 }
    change-view: { width: 107.52, height: 42 }
    spaceline:   { width: 161.28, height: 42 }
    special:     { width: 53.76,  height: 42 }
    special-2:   { width: 107.52, height: 42 }
    mic:         { width: 161.28, height: 32 }
    paste:       { width: 161.28, height: 32 }
    emoji:       { width: 107.52, height: 32 }
    hide:        { width: 107.52, height: 32 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "' - ק  ר א ט ו ן ם פ"
        - "ש ד ג כ ע י ח ל ך ף"
        - "ז ס ב ה נ מ צ ת ץ BackSpace"
        - "show_numbers preferences , space . Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "1 2 3 4 5 6 7 8 9 0"
        - "@ # ₪ % & - _ + ( )"
        - "show_symbols , \" ' : ; ! ? BackSpace"
        - "show_letters preferences , space . Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "~ ` | · √ π τ ÷ × ¶"
        - "© ® £ € $ ^ ° * { }"
        - "show_numbers \\ / < > = [ ] BackSpace"
        - "show_letters preferences , space . Return"

buttons:
    BackSpace:
        outline: "special"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        action: "show_prefs"
        outline: "special"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view"
        label: "ABC"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view"
        label: "*/="
    space:
        outline: "spaceline"
        text: " "
    Return:
        outline: "special-2"
        icon: "key-enter"
        keysym: "Return"
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
