# SPDX-License-Identifier: GPL-3.0-or-later
# squeekboard 1.43.1's in+mal.yaml (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later), with two changes for Omarchy Mobile: the
# action row (Mic, Paste, Emoji, Hide; XF86 keysyms that hypr/phone.lua
# binds for squeekboard only) on top of every view, and the globe key
# sending XF86MediaLanguageMenu (the shell's language sheet) instead of
# opening squeekboard's popover. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 445.705: 2 x 133.712 + 2 x 89.141.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: Malayalam
---
outlines:
    default:     { width: 34.285, height: 52 }
    change-view: { width: 68.57,  height: 52 }
    placeholder: { width: 34.285, height: 52 }
    spaceline:   { width: 274.28, height: 52 }
    special:     { width: 34.285, height: 52 }
    special-2:   { width: 68.57,  height: 52 }
    mic:         { width: 133.712, height: 40 }
    paste:       { width: 133.712, height: 40 }
    emoji:       { width: 89.141, height: 40 }
    hide:        { width: 89.141, height: 40 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - " ൊ ൧ ൨ ൩ ൪ ൫ ൬ ൭ ൮ ൯ ൦ - ൃ "
        - " ൗ ൈ ാ ീ ൂ ബ ഹ ഗ ദ ജ ഡ zwj zwnj "
        - " -- ോ േ ് ി ു പ ര ക ത ച ട zwsp "
        - "show_upper െ ം മ ന വ ല സ യ -- BackSpace"
        - "show_numbers preferences space Return"
    upper:
        - "Mic Paste Emoji Hide"
        - " ഒ ! @ # ₹ % ^ & ൾ ( ) ഃ ഋ "
        - " ഔ ഐ ആ ഈ ഊ ഭ ങ ഘ ധ ഝ ഢ ഞ ർ "
        - " -- ഓ ഏ അ ഇ ഉ ഫ റ ഖ ഥ ഛ ഠ -- "
        - "show_upper എ ൺ ണ ൻ ഴ ള ശ ഷ ൽ BackSpace"
        - "show_numbers preferences space Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - " -- ൧ ൨ ൩ ൪ ൫ ൬ ൭ ൮ ൯ ൦ -- -- "
        - "-- 1 2 3 4 5 6 7 8 9 0 ² --"
        - "-- @ # $ % & - _ + ( ) ³ --"
        - "show_symbols ₹ , \" ' : ; ! ? -- BackSpace"
        - "show_letters  preferences space Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "-- -- -- -- -- -- -- -- -- -- -- -- --"
        - "-- ~ ` | · √ π τ ÷ × ¶ ² --"
        - "-- © ® £ € ¥ ^ ° * { } ³ --"
        - "show_numbers -- \\ / < > = [ ] -- BackSpace"
        - "show_letters  preferences space Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special-2"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        keysym: "XF86MediaLanguageMenu"
        outline: "special"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view"
        label: "ABC"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view"
        label: "*/="
    space:
        outline: "spaceline"
        text: " "
    Return:
        outline: "special-2"
        icon: "key-enter"
        keysym: "Return"
    --:
        outline: "placeholder"
        text: ""
# U+200B - zero-width-space
    zwsp:
        icon: "zwsp"
        text: "​"
# U+200C - zero-width-non-joiner
    zwnj:
        icon: "zwnj"
        text: "‌"
# U+200D - zero-width-joiner
    zwj:
        icon: "zwj"
        text: "‍"
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
