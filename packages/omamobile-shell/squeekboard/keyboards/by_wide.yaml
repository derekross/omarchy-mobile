# SPDX-License-Identifier: GPL-3.0-or-later
# squeekboard 1.43.1's by_wide.yaml (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later), with two changes for Omarchy Mobile: the
# action row (Mic, Paste, Emoji, Hide; XF86 keysyms that hypr/phone.lua
# binds for squeekboard only) on top of every view, and the globe key
# sending XF86MediaLanguageMenu (the shell's language sheet) instead of
# opening squeekboard's popover. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 537.592: 2 x 161.278 + 2 x 107.518.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: Belarusian
---
outlines:
    default:        { width: 48.872,  height: 42 }
    change-view:    { width: 48.872,  height: 42 }
    change-view-2:  { width: 97.744,  height: 42 }
    fill:           { width: 97.744,  height: 42 }
    spaceline:      { width: 146.616, height: 42 }
    spaceline-fill: { width: 244.36,  height: 42 }
    special:        { width: 48.872,  height: 42 }
    special-2:      { width: 97.744,  height: 42 }
    mic:            { width: 161.278, height: 32 }
    paste:          { width: 161.278, height: 32 }
    emoji:          { width: 107.518, height: 32 }
    hide:           { width: 107.518, height: 32 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "й ц у к е н г ш ў з х"
        - "ф ы в а п р о л д ж э"
        - "show_upper я ч с м і т ь б ю BackSpace"
        - "show_numbers preferences ё space , . Return"
    upper:
        - "Mic Paste Emoji Hide"
        - "Й Ц У К Е Н Г Ш Ў З Х"
        - "Ф Ы В А П Р О Л Д Ж Э"
        - "show_upper Я Ч С М І Т Ь Б Ю BackSpace"
        - "show_numbers preferences Ё space , . Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "1 2 3 4 5 6 7 8 9 0 ²"
        - "@ # $ % & - _ + ( ) ³"
        - "show_symbols , \" ' : ; ! ? BackSpace-wide"
        - "show_letters preferences space-fill . Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "~ ` | · √ π τ ÷ × ¶ ²"
        - "© ® £ € ¥ ^ ° * { } ³"
        - "show_numbers \\ / < > = [ ] BackSpace-wide"
        - "show_letters preferences space-fill . Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special"
        icon: "edit-clear-symbolic"
        action: "erase"
    BackSpace-wide:
        outline: "special-2"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        keysym: "XF86MediaLanguageMenu"
        outline: "special"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view-2"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view-2"
        label: "АБВ"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view-2"
        label: "*/="
    space:
        outline: "spaceline"
        text: " "
    space-fill:
        outline: "spaceline-fill"
        text: " "
    Return:
        outline: "special-2"
        icon: "key-enter"
        keysym: "Return"
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
