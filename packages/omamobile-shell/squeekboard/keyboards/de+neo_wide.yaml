# SPDX-License-Identifier: GPL-3.0-or-later
# squeekboard 1.43.1's de+neo_wide.yaml (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later), with one change for Omarchy Mobile: the
# action row (Mic, Paste, Emoji, Hide; XF86 keysyms that hypr/phone.lua
# binds for squeekboard only) on top of every view. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 537.592: 2 x 161.278 + 2 x 107.518.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: German (Neo 2)
---
outlines:
    default:            { width: 48.872,  height: 42 }
    change-view:        { width: 73.308,  height: 42 }
    fill:               { width: 97.744,  height: 42 }
    spaceline:          { width: 171.052, height: 42 }
    special:            { width: 48.872,  height: 42 }
    special-2:          { width: 73.308,  height: 42 }
    subtle-highlight:   { width: 48.872,  height: 42 }
    subtle-highlight-2: { width: 97.744,  height: 42 }
    mic:                { width: 161.278, height: 32 }
    paste:              { width: 161.278, height: 32 }
    emoji:              { width: 107.518, height: 32 }
    hide:               { width: 107.518, height: 32 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "x v l c w k h g f q ß"
        - "u i a e o s n r t d y"
        - "show_upper ü ö ä p z b m j BackSpace"
        - "show_numbers show_eschars preferences space , . Return"
    upper:
        - "Mic Paste Emoji Hide"
        - "X V L C W K H G F Q ẞ"
        - "U I A E O S N R T D Y"
        - "show_upper Ü Ö Ä P Z B M J BackSpace"
        - "show_numbers show_eschars preferences space ! ? Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "1 2 3 4 5 6 7 8 9 0 ²"
        - "@ # € % & - _ + ( ) ³"
        - "show_symbols ; \" ' : = < > BackSpace"
        - "show_letters show_eschars preferences space , . Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "~ ` ´ | · √ µ ÷ × ¶ ²"
        - "© ® £ $ ¥ ^ ° * { } ³"
        - "show_numbers \\ / § π τ [ ] BackSpace"
        - "show_letters show_eschars preferences space , . Return"
    eschars:
        - "Mic Paste Emoji Hide"
        - "ä-subtle-highlight è é ö-subtle-highlight ü-subtle-highlight-2 Ä-subtle-highlight È É Ö-subtle-highlight Ü-subtle-highlight"
        - "à â ê î ô À Â Ê Î Ô"
        - "show_numbers « » ç Ç æ œ ß-subtle-highlight BackSpace"
        - "show_letters show_eschars preferences space „ “ Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special-2"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        action: "show_prefs"
        outline: "special"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view"
        label: "ABC"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view"
        label: "*/="
    show_eschars:
        action:
            locking:
                lock_view: "eschars"
                unlock_view: "base"
        outline: "change-view"
        label: "Ää"
    space:
        outline: "spaceline"
        text: " "
    Return:
        outline: "special-2"
        icon: "key-enter"
        keysym: "Return"
    ä-subtle-highlight:
        outline: "subtle-highlight"
        text: "ä"
    ö-subtle-highlight:
        outline: "subtle-highlight"
        text: "ö"
    ü-subtle-highlight-2:
        outline: "subtle-highlight-2"
        text: "ü"
    Ä-subtle-highlight:
        outline: "subtle-highlight"
        text: "Ä"
    Ö-subtle-highlight:
        outline: "subtle-highlight"
        text: "Ö"
    Ü-subtle-highlight:
        outline: "subtle-highlight"
        text: "Ü"
    ß-subtle-highlight:
        outline: "subtle-highlight"
        text: "ß"
    ô:
        outline: "fill"
    Ç:
        outline: "fill"
    ":":
        outline: "fill"
    π:
        outline: "fill"
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"