# SPDX-License-Identifier: GPL-3.0-or-later
# squeekboard 1.43.1's ge.yaml (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later), with two changes for Omarchy Mobile: the
# action row (Mic, Paste, Emoji, Hide; XF86 keysyms that hypr/phone.lua
# binds for squeekboard only) on top of every view, and the globe key
# sending XF86MediaLanguageMenu (the shell's language sheet) instead of
# opening squeekboard's popover. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 356.57: 2 x 106.971 + 2 x 71.314.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: Georgian
---
outlines:
    default:       { width: 35.657,  height: 52 }
    change-view:   { width: 53.485,  height: 52 }
    change-view-2: { width: 62.399,  height: 52 }
    large:         { width: 53.485,  height: 52 }
    spaceline:     { width: 124.802, height: 52 }
    special:       { width: 53.485,  height: 52 }
    special-2:     { width: 62.399,  height: 52 }
    mic:           { width: 106.971, height: 40 }
    paste:         { width: 106.971, height: 40 }
    emoji:         { width: 71.314, height: 40 }
    hide:          { width: 71.314, height: 40 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "ქ წ ე რ ტ ყ უ ი ო პ"
        - "ა ს დ ფ გ ჰ ჯ კ ლ"
        - "show_upper ზ ხ ც ვ ბ ნ მ BackSpace"
        - "show_numbers preferences space . Return"
    upper:
        - "Mic Paste Emoji Hide"
        - "ქ ჭ ე ღ თ ყ უ ი ო პ"
        - "ა შ დ ფ გ ჰ ჟ კ ლ"
        - "show_upper ძ ხ ჩ ვ ბ ნ მ BackSpace"
        - "show_numbers preferences space . Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "1 2 3 4 5 6 7 8 9 0"
        - "! @ # $ % ^ & * ( )"
        - "show_symbols - ' \" : ; , ? BackSpace"
        - "show_letters preferences space . Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "+ ⨯ ÷ = / _ € £ ¥ ₾"
        - "~ ` | · √ π τ ° { }"
        - "show_numbers_from_symbols \\ / < > = [ ] BackSpace"
        - "show_letters preferences space . Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        keysym: "XF86MediaLanguageMenu"
        outline: "special"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view-2"
        label: "123"
    show_numbers_from_symbols:
        action:
            set_view: "numbers"
        outline: "change-view"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view-2"
        label: "ABC"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view"
        label: "*/="
    space:
        outline: "spaceline"
        text: " "
    .:
        outline: "large"
    Return:
        outline: "special-2"
        icon: "key-enter"
        keysym: "Return"
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
