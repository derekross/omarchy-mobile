# SPDX-License-Identifier: GPL-3.0-or-later
# kz.yaml (Kazakh): xkeyboard-config 2.48's symbols for "kz", default variant
# (squeekboard/xkb/kz.txt, xkeyboard-config's licence in squeekboard/xkb/COPYING),
# on squeekboard 1.43.1's ru.yaml as the template (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later): each letter key types what xkb has on the
# same key, level 1 in the base view and level 2 in upper.
# Template keys moved to another letter: ә on ru's ё.
# Letters in a row of their own under the action row: і ң ғ ү ұ қ ө һ.
# Added to that row, not on levels 1 or 2 in xkb: ё.
# Follows the xkb default, not yet checked by a speaker: corrections
# from people who type it are welcome (docs/KEYBOARD-LAYOUTS.md).
# With the action row and the globe key of every layout. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 356.565: 2 x 106.969 + 2 x 71.313.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: Kazakh
---
outlines:
    default:        { width: 32.415,  height: 52 }
    change-view:    { width: 32.415,  height: 52 }
    change-view-2:  { width: 64.83,   height: 52 }
    fill:           { width: 64.83,   height: 52 }
    large:          { width: 35.656,  height: 52 }
    spaceline:      { width: 90.763,  height: 52 }
    spaceline-fill: { width: 155.593, height: 52 }
    special:        { width: 32.415,  height: 52 }
    special-2:      { width: 35.656,  height: 52 }
    special-3:      { width: 64.83,   height: 52 }
    mic:            { width: 106.969, height: 40 }
    paste:          { width: 106.969, height: 40 }
    emoji:          { width: 71.313, height: 40 }
    hide:           { width: 71.313, height: 40 }
    extra:          { width: 32.415, height: 32 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "і-extra ң-extra ғ-extra ү-extra ұ-extra қ-extra ө-extra һ-extra ё-extra"
        - "й ц у к е н г ш щ з х"
        - "ф ы в а п р о л д ж э"
        - "show_upper я ч с м и т ь б ю BackSpace"
        - "show_numbers preferences ә space ъ . Return"
    upper:
        - "Mic Paste Emoji Hide"
        - "І-extra Ң-extra Ғ-extra Ү-extra Ұ-extra Қ-extra Ө-extra Һ-extra Ё-extra"
        - "Й Ц У К Е Н Г Ш Щ З Х"
        - "Ф Ы В А П Р О Л Д Ж Э"
        - "show_upper Я Ч С М И Т Ь Б Ю BackSpace"
        - "show_numbers preferences Ә space Ъ ,-large Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "1 2 3 4 5 6 7 8 9 0 ²"
        - "@ # $ % & - _ + ( ) ³"
        - "show_symbols , \" ' : ; ! ? BackSpace-wide"
        - "show_letters preferences space-fill . Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "~ ` | · √ π τ ÷ × ¶ ²"
        - "© ® £ € ¥ ^ ° * { } ³"
        - "show_numbers \\ / < > = [ ] BackSpace-wide"
        - "show_letters preferences space-fill . Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special"
        icon: "edit-clear-symbolic"
        action: "erase"
    BackSpace-wide:
        outline: "special-3"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        keysym: "XF86MediaLanguageMenu"
        outline: "special-2"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view-2"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view-2"
        label: "АБВ"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view-2"
        label: "*/="
    space:
        outline: "spaceline"
        text: " "
    space-fill:
        outline: "spaceline-fill"
        text: " "
    Return:
        outline: "special-3"
        icon: "key-enter"
        keysym: "Return"
    .:
        outline: "large"
    ",-large":
        outline: "large"
        text: ","
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
    # Letters xkb has on keys the template has no place for, one key each
    і-extra:
        outline: "extra"
        text: "і"
    ң-extra:
        outline: "extra"
        text: "ң"
    ғ-extra:
        outline: "extra"
        text: "ғ"
    ү-extra:
        outline: "extra"
        text: "ү"
    ұ-extra:
        outline: "extra"
        text: "ұ"
    қ-extra:
        outline: "extra"
        text: "қ"
    ө-extra:
        outline: "extra"
        text: "ө"
    һ-extra:
        outline: "extra"
        text: "һ"
    ё-extra:
        outline: "extra"
        text: "ё"
    І-extra:
        outline: "extra"
        text: "І"
    Ң-extra:
        outline: "extra"
        text: "Ң"
    Ғ-extra:
        outline: "extra"
        text: "Ғ"
    Ү-extra:
        outline: "extra"
        text: "Ү"
    Ұ-extra:
        outline: "extra"
        text: "Ұ"
    Қ-extra:
        outline: "extra"
        text: "Қ"
    Ө-extra:
        outline: "extra"
        text: "Ө"
    Һ-extra:
        outline: "extra"
        text: "Һ"
    Ё-extra:
        outline: "extra"
        text: "Ё"
