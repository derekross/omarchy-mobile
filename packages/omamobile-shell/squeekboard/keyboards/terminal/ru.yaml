# SPDX-License-Identifier: GPL-3.0-or-later
# Russian terminal layout for Omamobile: squeekboard 1.43.1's terminal/us.yaml
# (https://gitlab.gnome.org/World/Phosh/squeekboard, tag v1.43.1,
# GPL-3.0-or-later) as changed for Omamobile (the action row, the terminal
# row of Esc, Tab, Ctrl, Alt, | / and the arrows, the globe key sending
# XF86MediaLanguageMenu), with the letter rows, numbers and symbols of
# squeekboard's ru.yaml. Squeekboard has no Russian terminal layout, so
# Russian users got the English one in a terminal (#695). Written by hand
# like terminal/gr.yaml.
# Widths: the Russian layout's letter key, 32.415, and its widest row, 11 keys,
# 356.565; the terminal row's keys are 55/48 and 11/12 of a letter key so that it
# fills that width too, and the heights are terminal/us's.
# The base view keeps ru's bottom row (ё, ъ and .); the F-keys (>_) are in
# the shift view, where , was. - and the rest are in the numbers view.
# omamobile-setup-user links it as
# ~/.local/share/squeekboard/keyboards/terminal/ru.yaml, the only place
# squeekboard reads layouts from besides its built-in ones.
# Ctrl and Alt combos: foot (input.c) sends Ctrl+с as CSI 27;5;<keysym>~,
# not ^C, and squeekboard's keymap has only the keysyms the layout's keys
# use, so Ctrl+C needs a Latin c. The abc key (in place of ~ in the base view)
# latches a Latin view for one key: Ctrl, abc, c sends Ctrl+C and comes back
# to Russian; abc twice keeps the Latin view. Press Ctrl before abc, since any
# modifier key unlatches a latched view (squeekboard src/layout.rs).
# Language: Russian
---
outlines:
    default:        { width: 32.415, height: 52 }
    action:         { width: 59.427, height: 52 }
    change-view:    { width: 32.415, height: 52 }
    change-view-2:  { width: 64.83, height: 52 }
    halfwidth:      { width: 16.207, height: 52 }
    large:          { width: 35.657, height: 52 }
    small-row:      { width: 41.599, height: 32 }
    term-key:       { width: 37.142, height: 32 }
    term-narrow:    { width: 29.714, height: 32 }
    spaceline:      { width: 90.762, height: 52 }
    spaceline-fill: { width: 155.592, height: 52 }
    special:        { width: 32.415, height: 52 }
    special-2:      { width: 35.657, height: 52 }
    special-3:      { width: 64.83, height: 52 }
    mic:            { width: 106.969, height: 36 }
    paste:          { width: 106.969, height: 36 }
    emoji:          { width: 71.313, height: 36 }
    hide:           { width: 71.313, height: 36 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "Esc-small Tab-small Ctrl Alt |-small show_latin /-small ← ↑ ↓ →"
        - "й ц у к е н г ш щ з х"
        - "ф ы в а п р о л д ж э"
        - "show_upper я ч с м и т ь б ю BackSpace"
        - "show_numbers preferences ё space ъ . Return"
    latin:
        - "Mic Paste Emoji Hide"
        - "Esc-small Tab-small Ctrl Alt |-small show_latin /-small ← ↑ ↓ →"
        - "q w e r t y u i o p"
        - ".-thin a s d f g h j k l --thin"
        - "show_russian z x c v b n m BackSpace"
        - "show_numbers preferences space-fill show_actions Return"
    upper:
        - "Mic Paste Emoji Hide"
        - "Esc-small Tab-small Ctrl Alt Shift PageUp PageDown Home End"
        - "Й Ц У К Е Н Г Ш Щ З Х"
        - "Ф Ы В А П Р О Л Д Ж Э"
        - "show_upper Я Ч С М И Т Ь Б Ю BackSpace"
        - "show_numbers preferences Ё space Ъ show_actions Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "Esc-small Tab-small Ctrl Alt |-small ~-small /-small ← ↑ ↓ →"
        - "1 2 3 4 5 6 7 8 9 0 ²"
        - "@ # $ % & - _ + ( ) ³"
        - "show_symbols , \" ' : ; ! ? BackSpace-wide"
        - "show_letters preferences space-fill . Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "Esc-small Tab-small Ctrl Alt |-small ~-small /-small ← ↑ ↓ →"
        - "~ ` | · √ π τ ÷ × ¶ ²"
        - "© ® £ € ¥ ^ ° * { } ³"
        - "show_numbers \\ / < > = [ ] BackSpace-wide"
        - "show_letters preferences space-fill . Return"
    actions:
        - "Mic Paste Emoji Hide"
        - "Esc-small Tab-small Ctrl Alt Shift PageUp PageDown Home End"
        - "F1  F2  F3  F4  F5  F6"
        - "F7  F8  F9  F10 F11 F12"
        - "Esc Tab Pause Insert Up Del"
        - "show_letters_actions Menu Break Left Down Right"

buttons:
    show_latin:
        action:
            locking:
                lock_view: "latin"
                unlock_view: "base"
        outline: "term-narrow"
        label: "abc"
    show_russian:
        action:
            set_view: "base"
        outline: "change-view-2"
        label: "АБВ"
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special"
        icon: "edit-clear-symbolic"
        action: "erase"
    BackSpace-wide:
        outline: "special-3"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        keysym: "XF86MediaLanguageMenu"
        outline: "special-2"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view-2"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view-2"
        label: "АБВ"
    show_letters_actions:
        action:
            set_view: "base"
        outline: "action"
        label: "АБВ"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view-2"
        label: "*/="
    show_actions:
        action:
            set_view: "actions"
        outline: "large"
        label: ">_"
    ".":
        outline: "large"
    space:
        outline: "spaceline"
        text: " "
    space-fill:
        outline: "spaceline-fill"
        text: " "
    Return:
        outline: "special-3"
        icon: "key-enter"
        keysym: "Return"
    F1:
        outline: "action"
        keysym: "F1"
    F2:
        outline: "action"
        keysym: "F2"
    F3:
        outline: "action"
        keysym: "F3"
    F4:
        outline: "action"
        keysym: "F4"
    F5:
        outline: "action"
        keysym: "F5"
    F6:
        outline: "action"
        keysym: "F6"
    F7:
        outline: "action"
        keysym: "F7"
    F8:
        outline: "action"
        keysym: "F8"
    F9:
        outline: "action"
        keysym: "F9"
    F10:
        outline: "action"
        keysym: "F10"
    F11:
        outline: "action"
        keysym: "F11"
    F12:
        outline: "action"
        keysym: "F12"
    Esc:
        outline: "action"
        keysym: "Escape"
    Esc-small:
        outline: "term-key"
        keysym: "Escape"
        label: "Esc"
    Tab:
        outline: "action"
        keysym: "Tab"
    Tab-small:
        outline: "term-key"
        keysym: "Tab"
        label: "Tab"
    Del:
        outline: "action"
        keysym: "Delete"
    Insert:
        outline: "action"
        keysym: "Insert"
    Menu:
        outline: "action"
        keysym: "Menu"
    Pause:
        outline: "action"
        keysym: "Pause"
    Break:
        outline: "action"
        keysym: "Break"
    Home:
        outline: "small-row"
        keysym: "Home"
    End:
        outline: "small-row"
        keysym: "End"
    PageUp:
        outline: "small-row"
        keysym: "Page_Up"
        label: "Page ↑"
    PageDown:
        outline: "small-row"
        keysym: "Page_Down"
        label: "Page ↓"
    "↑":
        outline: "term-narrow"
        keysym: "Up"
    "↓":
        outline: "term-narrow"
        keysym: "Down"
    "←":
        outline: "term-narrow"
        keysym: "Left"
    "→":
        outline: "term-narrow"
        keysym: "Right"
    Up:
        label: "↑"
        outline: "action"
        keysym: "Up"
    Left:
        label: "←"
        outline: "action"
        keysym: "Left"
    Down:
        label: "↓"
        outline: "action"
        keysym: "Down"
    Right:
        label: "→"
        outline: "action"
        keysym: "Right"
    Ctrl:
        modifier: "Control"
        outline: "term-key"
        label: "Ctrl"
    Alt:
        modifier: "Alt"
        outline: "term-key"
        label: "Alt"
    Shift:
        modifier: "Shift"
        outline: "small-row"
        label: "Shift"
    --thin:
        outline: "halfwidth"
        text: "-"
    .-thin:
        outline: "halfwidth"
        text: "."
    "|-small":
        outline: "term-narrow"
        text: "|"
    "~-small":
        outline: "term-narrow"
        text: "~"
    "/-small":
        outline: "term-narrow"
        text: "/"
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
