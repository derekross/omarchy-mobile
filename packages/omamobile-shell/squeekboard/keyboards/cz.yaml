# SPDX-License-Identifier: GPL-3.0-or-later
# squeekboard 1.43.1's cz.yaml (https://gitlab.gnome.org/World/Phosh/squeekboard,
# tag v1.43.1, GPL-3.0-or-later), with two changes for Omarchy Mobile: the
# action row (Mic, Paste, Emoji, Hide; XF86 keysyms that hypr/phone.lua
# binds for squeekboard only) on top of every view, and the globe key
# sending XF86MediaLanguageMenu (the shell's language sheet) instead of
# opening squeekboard's popover. Made by
# squeekboard/generate (change the generator, not this file). The row
# sums to the widest row's 356.57: 2 x 106.971 + 2 x 71.314.
# omamobile-setup-user links it into ~/.local/share/squeekboard/keyboards/.
# Language: Czech
---
outlines:
    default:       { width: 35.657,  height: 52 }
    change-view:   { width: 53.485,  height: 52 }
    change-view-2: { width: 35.657,  height: 52 }
    spaceline:     { width: 106.972, height: 52 }
    special:       { width: 35.657,  height: 52 }
    special-2:     { width: 53.485,  height: 52 }
    mic:           { width: 106.971, height: 40 }
    paste:         { width: 106.971, height: 40 }
    emoji:         { width: 71.314, height: 40 }
    hide:          { width: 71.314, height: 40 }

views:
    base:
        - "Mic Paste Emoji Hide"
        - "q w e r t z u i o p"
        - "a s d f g h j k l"
        - "show_upper y x c v b n m BackSpace"
        - "show_numbers show_accents preferences space , . Return"
    upper:
        - "Mic Paste Emoji Hide"
        - "Q W E R T Z U I O P"
        - "A S D F G H J K L"
        - "show_upper Y X C V B N M BackSpace"
        - "show_numbers show_upper_accents preferences space ! ? Return"
    numbers:
        - "Mic Paste Emoji Hide"
        - "1 2 3 4 5 6 7 8 9 0"
        - "@ # $ % & - _ + ( )"
        - "show_symbols , \" ' : ; ! ? BackSpace"
        - "show_letters show_accents preferences space , . Return"
    symbols:
        - "Mic Paste Emoji Hide"
        - "~ ` | · √ π τ ÷ × ¶"
        - "© ® £ € ¥ ^ ° * { }"
        - "show_numbers \\ / < > = [ ] BackSpace"
        - "show_letters show_accents preferences space , . Return"
    accents:
        - "Mic Paste Emoji Hide"
        - "ä ě é ř ť ž ů í ó ö"
        - "á š ď ë ŕ ú ü ô ľ"
        - "show_upper_accents_from_accents ý ß č ç ñ ň ĺ BackSpace"
        - "show_letters show_accents preferences space , . Return"
    upper_accents:
        - "Mic Paste Emoji Hide"
        - "Ä Ě É Ř Ť Ž Ů Í Ó Ö"
        - "Á Š Ď Ë Ŕ Ú Ü Ô Ľ"
        - "show_upper_accents_from_accents Ý ẞ Č Ç Ñ Ň Ĺ BackSpace"
        - "show_letters show_upper_accents preferences space , . Return"

buttons:
    show_upper:
        action:
            locking:
                lock_view: "upper"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    show_upper_accents_from_accents:
        action:
            locking:
                lock_view: "upper_accents"
                unlock_view: "base"
        outline: "change-view"
        icon: "key-shift"
    BackSpace:
        outline: "special-2"
        icon: "edit-clear-symbolic"
        action: "erase"
    preferences:
        keysym: "XF86MediaLanguageMenu"
        outline: "special"
        icon: "keyboard-mode-symbolic"
    show_numbers:
        action:
            set_view: "numbers"
        outline: "change-view"
        label: "123"
    show_letters:
        action:
            set_view: "base"
        outline: "change-view"
        label: "ABC"
    show_symbols:
        action:
            set_view: "symbols"
        outline: "change-view"
        label: "*/="
    show_accents:
        action:
            locking:
                lock_view: "accents"
                unlock_view: "base"
        outline: "change-view-2"
        label: "á"
    show_upper_accents:
        action:
            locking:
                lock_view: "upper_accents"
                unlock_view: "base"
        outline: "change-view-2"
        label: "Á"
    space:
        outline: "spaceline"
        text: " "
    Return:
        outline: "special-2"
        icon: "key-enter"
        keysym: "Return"
    # The action row (hypr/phone.lua binds the keysyms)
    Mic:
        outline: "mic"
        keysym: "XF86Dictate"
        label: "󰍬 Mic"
    Paste:
        outline: "paste"
        keysym: "XF86Paste"
        label: "󰆒 Paste"
    Emoji:
        outline: "emoji"
        keysym: "XF86EmojiPicker"
        label: "󰞅 Emoji"
    Hide:
        outline: "hide"
        keysym: "XF86Keyboard"
        label: "󰌏 Hide"
