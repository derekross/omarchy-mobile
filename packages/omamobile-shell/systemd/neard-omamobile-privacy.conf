# SPDX-License-Identifier: MIT
# NFC off totally (omamobile-privacy@nfc-off.service): neard doesn't start while
# /var/lib/omamobile/privacy/nfc is there, at boot (omamobile-nfc-open's
# Wants=) or by anything else, so nothing can poll for tags.
[Unit]
ConditionPathExists=!/var/lib/omamobile/privacy/nfc
