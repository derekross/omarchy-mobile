# Omamobile: Omarchy's bt-agent.service runs `bt-agent -c NoInputNoOutput`,
# which accepts every pairing request with no prompt. On the phone, pairing
# is the Bluetooth panel's: it runs omamobile-bt-agent, which asks the owner
# on a sheet, and keeps the adapter pairable only while the owner pairs a
# device from it or makes the phone visible. With bt-agent registered, BlueZ
# keeps the adapter pairable whenever it runs (src/agent.c set_io_cap). A
# condition, not a mask: Omarchy's first run enables this unit with
# `enable --now`, which fails on a masked unit and then repeats first run at
# every login (as with omarchy-fcitx5.service). To run it anyway:
# touch ~/.config/omamobile/bt-agent
[Unit]
ConditionPathExists=%h/.config/omamobile/bt-agent
