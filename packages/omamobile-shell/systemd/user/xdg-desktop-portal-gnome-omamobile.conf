# Omarchy Mobile (omamobile-shell): xdg-desktop-portal-gnome serves the phone's
# file chooser (portal/hyprland-portals.conf). Omarchy's session sets
# GDK_BACKEND=wayland,x11,*, and with any GDK_BACKEND other than "wayland" the
# backend refuses its dialogs ("GDK backend forced via env var") and exposes
# Settings only, so every open or save request failed. Give it plain Wayland.
#
# environment.d/20-omamobile-osk.conf sets GDK_DEBUG=portals and
# GTK_USE_PORTAL=1 so that apps open this chooser. Inside the backend itself
# they make GTK 4 ask the main portal for its Settings at start-up, and the
# main portal is waiting for this backend: both stalled until D-Bus gave up
# after 25 s, and the shell, the voice overlay and the file chooser waited
# with them at every boot (#277). The backend must not use the portal.
[Service]
Environment=GDK_BACKEND=wayland
UnsetEnvironment=GDK_DEBUG GTK_USE_PORTAL
