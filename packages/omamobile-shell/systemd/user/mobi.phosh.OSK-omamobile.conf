# squeekboard's own user unit, for a session that starts the keyboard through
# it: the keyboard the owner chose (omamobile-osk), which is squeekboard
# unless they picked another. Whichever it is owns the unit's bus name,
# sm.puri.OSK0.
[Service]
ExecStart=
ExecStart=/usr/bin/omamobile-osk
