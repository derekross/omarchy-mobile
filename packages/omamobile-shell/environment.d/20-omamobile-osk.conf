# SPDX-License-Identifier: MIT
# Omarchy Mobile: text fields talk to the on-screen keyboard through Wayland's
# text-input protocol, which Hyprland hands to squeekboard. Overrides Omarchy's
# 10-omarchy-fcitx.conf (fcitx5 is for desktop compose sequences).
# environment.d can't unset a variable (an empty value is a syntax error), so
# the fcitx ones get explicit "no input method" values.
INPUT_METHOD=none
QT_IM_MODULE=wayland
GTK_IM_MODULE=wayland
XMODIFIERS=@im=none
SDL_IM_MODULE=none

# File pickers (TOUCH-PLAN 3.2): GTK apps open the portal's chooser (Nautilus,
# which fits a phone; portal/hyprland-portals.conf) rather than drawing GTK's
# desktop dialog in-process. GTK_USE_PORTAL is GTK 3's switch, GDK_DEBUG=portals
# GTK 4's. Qt Widgets apps keep Omarchy's QT_QPA_PLATFORMTHEME=gtk3:
# xdgdesktopportal would lose the GTK colours, so that waits for a phone test.
GTK_USE_PORTAL=1
GDK_DEBUG=portals
