# Omarchy Mobile: a screenshot toast's tap ("Tap to view") opens the
# screenshot in the image viewer (Loupe) through omamobile-screenshot-open,
# not in Tensaku, a desktop annotation tool. Omarchy's
# omarchy-capture-screenshot reads this; its default is tensaku-edit.
OMARCHY_SCREENSHOT_EDITOR=omamobile-screenshot-open
