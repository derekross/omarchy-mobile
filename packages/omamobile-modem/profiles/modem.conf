# SPDX-License-Identifier: MIT
# Vendor-chroot profile "modem": Samsung's rfsd (NV file service) and cbd
# (modem boot daemon) from the stock vendor image, booting the S5300 through
# the CPIF port (/dev/umts_boot0, /dev/umts_rfs0). device/cheetah/MODEM-PLAN.md M3.
#
# NV safety, the hard rule of the modem plan: the daemons never see a real
# block device, and nothing here writes one.
#   - The six partitions (efs, efs_backup, modem_userdata, persist, modem_a,
#     modem_b) must read ro=1 at the block layer (the 60-omamobile-modem-nv-ro
#     udev rule, M0.5; persist is checked only for being unmounted).
#   - At start the host reads five of them into RAM (a tmpfs under $RUN) and
#     checks every copy against /etc/omamobile/modem-nv.sha256, which the
#     human writes from the off-repo backup's SHA256SUMS. One mismatch and
#     the profile stops before any daemon runs: a stock boot has changed NV
#     since the backup, so take a fresh backup first.
#   - The chroot gets loop devices of the copies: the modem image read-only
#     (by-name/modem_a and /mnt/vendor/modem_img), efs, efs_backup and
#     modem_userdata read-write (f2fs), and a copy of persist/modem.
#     What the modem writes to NV is lost when the profile stops.
#   - Before any daemon runs, the three NV files in the copies must pass the
#     stock salted checksum (rfsd crashes the CP on purpose if they don't).
#
# Order (the one that booted and registered this phone): rfsd first, alone
# for two seconds, then cbd once in the foreground (-o r: it stays uid 0 in
# the chroot; without -d it boots the CP and exits). rfsd keeps running and
# serves the CP's NV for as long as the CP runs. A watcher records a CP
# crash (omamobile-modem-cp watch); nothing restarts the CP on its own.
#
# Power: the modem stays on once up (MODEM-PLAN.md M2.6: every power-off
# costs one recovered UFS error-handler pass; CPIF refuses cbd's power-off,
# allow_poweroff=0). The profile's stop is the one exception: the CP must be
# off before rfsd goes, so profile_stop powers it off (setting
# allow_poweroff for that one request) before the daemons are signalled. A
# reboot does the same through the unit's stop. Restarting the unit is a
# power cycle: don't; reboot.
# shellcheck shell=bash disable=SC2034

STATE=/var/lib/omamobile-vendor/modem
BINDER=no
BINS=(/vendor/bin/rfsd /vendor/bin/cbd)

NV_SUMS=${OMAMOBILE_MODEM_NV_SUMS:-/etc/omamobile/modem-nv.sha256}
NV=$RUN/nv
# The CPIF character devices the daemons open.
MODEM_NODES=(umts_boot0 umts_rfs0)
# The 9a's GNSS is the CP's Kepler core (device/tegu/MODEM-PLAN.md F5): with
# gnssd in the image (tools/extract-vendor-chroot -p modem -d tegu) and
# gnssif loaded, the GNSS devices go into the chroot, and with
# OMAMOBILE_MODEM_GNSS=1 gnssd starts some seconds after ONLINE. It loads
# the Kepler patch through gnss_boot and talks CHPP over gnss_ipc. Off by
# default until a client asks it for positions: started 0.6 s after ONLINE,
# before the CP's IPC ran, it crashed the CP once.
GNSS_NODES=(gnss_ipc gnss_boot gnss_dump)
MODEM_GNSS=${OMAMOBILE_MODEM_GNSS:-0}
MODEM_GNSS_DELAY=${OMAMOBILE_MODEM_GNSS_DELAY:-20}
# OMAMOBILE_MODEM_STAGE: "rfsd" starts only rfsd; "cbd" (default) boots the
# modem too.
MODEM_STAGE=${OMAMOBILE_MODEM_STAGE:-cbd}
MODEM_CP=${OMAMOBILE_MODEM_CP:-/usr/lib/omamobile-vendor/omamobile-modem-cp}
# cbd boots the CP in about 10-30 s; give up waiting after this.
CBD_TIMEOUT=${OMAMOBILE_MODEM_CBD_TIMEOUT:-120}
# cbd retries a failed boot by itself, with a new power-on each time (every
# ~5 s in M3.4.5, 15 power-ons in 80 s): each one cycles the modem and its
# link, and the link changes disturbed UFS. Stop cbd after this many failed
# attempts ("start boot fail") and leave the CP for diagnosis.
CBD_ATTEMPTS=${OMAMOBILE_MODEM_CBD_ATTEMPTS:-1}

# The kernel name (sdaN) of the partition labelled $1. This root has no
# /dev/disk/by-partlabel, so match PARTNAME in sysfs.
modem_part() {
  local f
  f=$(grep -lx "PARTNAME=$1" /sys/class/block/*/uevent 2>/dev/null | head -1)
  [[ -n $f ]] && basename "$(dirname "$f")"
}

# The board's hardware id, per phone (never in the repo): cbd hands the
# CP its CDT values in the handover block, and without them the S5300's
# main firmware hung after INIT_END on this phone, taking no IPC and
# answering no crash request (MODEM-PLAN M4.1g, M4.1h). Copied from this
# phone's own stock properties into $STATE/props.conf as ro.boot.cdt_hwid
# (and persist.vendor.modem.cdt_hwid, the same value). $1: the file.
modem_cdt_check() {
  local f=$1 ro persist
  ro=$(sed -n 's/^ro\.boot\.cdt_hwid=//p' "$f" 2>/dev/null | tail -1)
  persist=$(sed -n 's/^persist\.vendor\.modem\.cdt_hwid=//p' "$f" 2>/dev/null | tail -1)
  if [[ -z $ro ]]; then
    say "no ro.boot.cdt_hwid in $f: the modem's firmware hangs without it."
    say "copy it from this phone's stock getprop (MODEM-PLAN M4.1h); never into the repo"
    return 1
  fi
  if [[ -n $persist && $persist != "$ro" ]]; then
    say "persist.vendor.modem.cdt_hwid differs from ro.boot.cdt_hwid in $f"
    return 1
  fi
  return 0
}

profile_check() {
  local ok=0 n p d
  modem_cdt_check "$STATE/props.conf" || ok=1
  for n in "${MODEM_NODES[@]}"; do
    [[ -c /dev/$n ]] || { say "no /dev/$n (the CPIF port is not loaded)"; ok=1; }
  done
  [[ -d /sys/devices/platform/cpif ]] || { say "no CPIF platform device"; ok=1; }
  for p in efs efs_backup modem_userdata modem_a modem_b persist; do
    d=$(modem_part "$p")
    if [[ -z $d ]]; then say "no partition $p"; ok=1; continue; fi
    if [[ $p != persist && $(cat "/sys/class/block/$d/ro") != 1 ]]; then
      say "$p (/dev/$d) is writable: install the M0.5 udev rule first"; ok=1
    fi
    if grep -q "^/dev/$d " /proc/mounts; then say "$p (/dev/$d) is mounted"; ok=1; fi
  done
  [[ -s $NV_SUMS ]] || { say "no $NV_SUMS (checksums from the off-repo backup)"; ok=1; }
  [[ -x $MODEM_CP ]] || { say "no $MODEM_CP"; ok=1; }
  grep -qw f2fs /proc/filesystems || modprobe -q f2fs 2>/dev/null ||
    { say "no f2fs in the kernel (CONFIG_F2FS_FS)"; ok=1; }
  return $ok
}

# Read partition $1 into $NV/$1.img and check it against $NV_SUMS.
modem_copy() {
  local p=$1 d want got
  d=$(modem_part "$p")
  want=$(awk -v f="$p.img" '$2 == f || $2 == "*" f { print $1 }' "$NV_SUMS")
  [[ -n $want ]] || die "$NV_SUMS has no line for $p.img"
  dd if="/dev/$d" of="$NV/$p.img" bs=4M iflag=direct status=none ||
    die "cannot read $p"
  got=$(sha256sum "$NV/$p.img" | cut -d' ' -f1)
  [[ $got == "$want" ]] ||
    die "$p differs from the backup (NV changed since; take a fresh backup): stopping"
  say "$p: RAM copy matches the backup"
}

# A loop device on $1 (ro or rw); prints its path.
modem_loop() {
  if [[ $2 == ro ]]; then losetup --show -f -r "$1"; else losetup --show -f "$1"; fi
}

# Mark a mounted loop device for autoclear (losetup -d on a busy device): it
# goes away with its last mount, when the profile's namespace ends.
modem_autoclear() { losetup -d "$1" 2>/dev/null || true; }

# The GNSS devices go in when gnssd is in the image and gnssif is loaded;
# gnssd itself starts only with OMAMOBILE_MODEM_GNSS=1 (or by hand:
# "omamobile-vendor-chroot modem run /vendor/bin/hw/gnssd").
modem_gnss_nodes() {
  [[ -n $(in_image /vendor/bin/hw/gnssd) && -c /dev/gnss_ipc ]]
}
modem_gnss() { [[ $MODEM_GNSS == 1 ]] && modem_gnss_nodes; }

profile_setup() {
  local p l mnt=$ROOT/mnt/vendor
  mkdir -p "$NV"
  mount -t tmpfs -o mode=0700,nosuid,nodev,noexec,size=640m modem-nv "$NV"
  for p in modem_a efs efs_backup modem_userdata persist; do modem_copy "$p"; done

  mkdir -p "$mnt/modem_img" "$mnt/efs" "$mnt/efs_backup" "$mnt/modem_userdata" \
    "$mnt/persist" "$ROOT/dev/block/by-name"
  l=$(modem_loop "$NV/modem_a.img" ro)
  bind "$l" "$ROOT/dev/block/by-name/modem_a"
  # cbd and rfsd also open the unsuffixed name
  bind "$l" "$ROOT/dev/block/by-name/modem"
  mount -t ext4 -o ro,noatime,noload "$l" "$mnt/modem_img"
  modem_autoclear "$l"
  for p in efs efs_backup modem_userdata; do
    l=$(modem_loop "$NV/$p.img" rw)
    mount -t f2fs -o noatime "$l" "$mnt/$p"
    modem_autoclear "$l"
  done
  "$MODEM_CP" nv-check "$mnt/efs" "$mnt/efs_backup" ||
    die "the NV copies fail the stock checksum (rfsd would crash the CP): stopping"
  modem_baseband
  # persist: only its modem directory (cpsha), copied out of the image
  l=$(modem_loop "$NV/persist.img" ro)
  mkdir -p "$NV/persist-ro" "$NV/persist/modem"
  # ext4 on cheetah, f2fs on tegu: a read-only mount of the RAM copy either way
  if [[ $(blkid -o value -s TYPE "$l") == f2fs ]]; then
    mount -t f2fs -o ro,noatime,norecovery "$l" "$NV/persist-ro"
  else
    mount -t ext4 -o ro,noatime,noload "$l" "$NV/persist-ro"
  fi
  if [[ -d $NV/persist-ro/modem ]]; then
    cp -a "$NV/persist-ro/modem/." "$NV/persist/modem/"
  else
    say "persist has no modem directory"
  fi
  umount "$NV/persist-ro"
  losetup -d "$l"
  rm -f "$NV/persist.img"
  bind "$NV/persist" "$mnt/persist"

  for p in "${MODEM_NODES[@]}"; do bind "/dev/$p" "$ROOT/dev/$p"; done
  if modem_gnss_nodes; then
    for p in "${GNSS_NODES[@]}"; do bind "/dev/$p" "$ROOT/dev/$p"; done
    mkdir -p "$STATE/data/vendor/gps/logs" "$STATE/data/vendor/gps/overlay"
  fi
  # cbd logs to the kernel log, next to CPIF's lines
  bind /dev/kmsg "$ROOT/dev/kmsg"
  modem_sysfs
  mkdir -p "$STATE/data/vendor/log/cbd" "$STATE/data/vendor/log/rfsd" \
    "$STATE/data/vendor/radio" "$STATE/data/vendor/ssrdump/coredump"
}

# persist.vendor.modem.baseband.version as Android keeps it: the version in
# the firmware's TOC, read from the file rfsd reads (vendor.modem.bin.path,
# props.conf). rfsd compares the two at start, and on a difference it
# deletes nv_normal.bin and nv_protected.bin ("image changed"; RAM copies,
# but the CP would then boot without its calibration). So no daemon starts
# unless the property holds exactly the TOC's string; a per-phone value
# that differs stops the profile instead of winning.
modem_baseband() {
  local props=$ROOT/dev/__omamobile_props__ key=persist.vendor.modem.baseband.version bin v
  bin=$(cat "$props/vendor.modem.bin.path" 2>/dev/null)
  [[ $bin == /mnt/vendor/modem_img/* && -f $ROOT$bin ]] ||
    die "vendor.modem.bin.path (${bin:-unset}) is not a file in the modem image: stopping"
  v=$("$MODEM_CP" baseband-version "$ROOT$bin") ||
    die "cannot read the baseband version from $bin (rfsd would clear the NV copies): stopping"
  if [[ -s $props/$key && $(cat "$props/$key") != "$v" ]]; then
    die "$key in props.conf differs from the firmware's $v (rfsd would clear the NV copies): stopping"
  fi
  printf '%s' "$v" > "$props/$key"
  say "baseband version $v"
}

# The chroot's /sys is an empty read-only skeleton. cbd reads CPIF's
# platform device (sim/ds_detect), the board data the bootloader puts in
# /chosen (plat: the hardware ids; config), and takes wakelocks, which this
# kernel doesn't have (no CONFIG_PM_WAKELOCKS): give it the first two
# read-only and a writable stand-in for the third.
modem_sysfs() {
  local s=$ROOT/sys n
  bind /sys/devices/platform/cpif "$s/devices/platform/cpif" ro
  for n in plat config; do
    if [[ -d /sys/firmware/devicetree/base/chosen/$n ]]; then
      bind "/sys/firmware/devicetree/base/chosen/$n" \
        "$s/firmware/devicetree/base/chosen/$n" ro
    else
      say "no /chosen/$n in the device tree (cbd reads it)"
    fi
  done
  mkdir -p "$RUN/sys-power"
  for n in wake_lock wake_unlock; do
    : > "$RUN/sys-power/$n"
    bind "$RUN/sys-power/$n" "$s/power/$n"
  done
}

# cbd's output, prefixed, to the journal. An attempt fails at its first
# "ERR! IOCTL_... fail" or at "start boot fail" (counted once per "Power on
# CP"); after CBD_ATTEMPTS of them, TERM to the timeout wrapper, which
# passes it on to cbd. cbd powers on again within ~30 ms of "start boot
# fail", so act on the first error line, before cbd's own retry.
cbd_watch() {
  local line fails=0 failed=0
  while IFS= read -r line; do
    printf '[cbd] %s\n' "$line"
    case $line in
      *"Power on CP"*) failed=0; continue ;;
      *"ERR! IOCTL_"*" fail"* | *"start boot fail"*) ((failed)) && continue ;;
      *) continue ;;
    esac
    failed=1 fails=$((fails + 1))
    if ((fails >= CBD_ATTEMPTS)) && [[ -s $RUN/cbd.pid ]]; then
      say "cbd: $fails failed boot attempt(s): stopping it before another power-on"
      kill -TERM "$(cat "$RUN/cbd.pid")" 2>/dev/null || true
      rm -f "$RUN/cbd.pid"
    fi
  done
}

profile_start() {
  local rc
  spawn rfsd vendor /vendor/bin/rfsd
  # the watcher: drops the start-up marker at ONLINE, records a crash
  "$MODEM_CP" watch "${OMAMOBILE_MODEM_MARK:-}" &
  [[ $MODEM_STAGE == rfsd ]] && return
  sleep 2
  kill -0 "${PIDS[rfsd]}" 2>/dev/null || die "rfsd exited before the modem boot"
  say "booting the modem (cbd, once)"
  android_env vendor
  set +e
  # shellcheck disable=SC2016 # $$ and $0 belong to the inner sh
  sh -c 'echo $$ > "$0"; exec "$@"' "$RUN/cbd.pid" \
    timeout -k 5 "$CBD_TIMEOUT" "${ENV[@]}" "$CHROOT_BIN" "$ROOT" \
    /vendor/bin/cbd -t s5100sit -P by-name/modem_a -s 2 -o r 2>&1 | cbd_watch
  rc=${PIPESTATUS[0]}
  rm -f "$RUN/cbd.pid"
  set -e
  if "$MODEM_CP" state >/dev/null; then
    say "CP ONLINE (cbd exit $rc); rfsd keeps serving its NV"
    if modem_gnss; then
      sleep "$MODEM_GNSS_DELAY"
      say "starting gnssd (the CP's GNSS)"
      spawn_optional gnssd vendor /vendor/bin/hw/gnssd
    fi
  else
    # Left as it is for diagnosis: rfsd keeps running, the start-up marker
    # stays, so the next boot skips the modem until --retry.
    say "cbd exit $rc and the CP is $("$MODEM_CP" state): not ONLINE. Leaving it for diagnosis; reboot to recover"
  fi
}

# A daemon the modem doesn't need (gnssd): the supervisor stops the whole
# profile when any child exits, and stopping powers the CP off. When gnssd
# gives up (on the 9a it does after repeated Kepler faults), the job stays
# alive as a sleep instead, so the modem and rfsd keep running.
spawn_optional() {
  local name=$1 kind=$2; shift 2
  android_env "$kind"
  say "starting $name (its exit leaves the modem up)"
  {
    # The group inherits errexit and pipefail: without the || a failing or
    # killed daemon would end the job here, and the supervisor would stop
    # the profile and power the CP off.
    local rc=0
    "${ENV[@]}" "$CHROOT_BIN" "$ROOT" "$@" 2>&1 | sed -u "s/^/[$name] /" || rc=$?
    say "$name exited ($rc); the modem and rfsd stay up"
    exec sleep infinity
  } &
  PIDS[$name]=$!
}

# Before the daemons are signalled: the CP off, so it never runs without
# rfsd. Bounded at ~15 s by omamobile-modem-cp.
profile_stop() {
  "$MODEM_CP" power-off || say "the CP did not power off; it goes off at the reboot"
}
