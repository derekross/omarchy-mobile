# Property overrides for the modem vendor-chroot profile, applied after the
# image's build.prop files (which already set ro.vendor.cbd.modem_type).
# Installed as /usr/lib/omamobile-vendor/modem/props.conf; per-phone tweaks
# go in /var/lib/omamobile-vendor/modem/props.conf.
# device/cheetah/MODEM-PLAN.md M3.

# What Android's init would have set from the bootloader. The slot is the
# one the RAM copy of the modem image is named after (by-name/modem_a).
# cheetah's; a gs101 phone (raven) overrides both in $STATE/props.conf
ro.boot.hardware.platform=gs201
ro.hardware=cheetah
ro.build.type=user
ro.vendor.build.type=user
ro.debuggable=0
ro.bootmode=normal
ro.boot.slot_suffix=_a
vendor.cbd.partition=modem_a
# One SIM stack for the physical slot, as stock's dual-SIM setting reads.
persist.radio.multisim.config=dsds
# The normal (terrestrial) modem image, not the satellite one.
vendor.cbd.modem_bin_type=0
# The firmware file itself. rfsd reads the image's TOC (NV sizes, version)
# from this path at start, waiting about 5 s for cbd to publish it; unset,
# it falls back to by-name/modem<slot>, whose raw partition starts with a
# tar header, not a TOC ("TOC not found", "TOC record is broken", M3.4.4).
# cbd sets the same path when it finds the image. The runtime "default" is a
# symlink to the version directory inside the image's ext4.
vendor.modem.bin.path=/mnt/vendor/modem_img/images/default/modem.bin

# Pinned so that cbd and rfsd take their normal-boot paths only. Their NV
# is a RAM copy either way (profiles/modem.conf); these keep a surprise
# from costing even that copy.
# efs.clear.action must be "none": EMPTY makes rfsd treat the start as a
# factory reset and clear the (RAM) NV, and "needed" clears it too. Any
# other value only selects the version check below; rfsd writes the
# outcome back here ("none" when nothing was cleared).
persist.vendor.modem.efs.clear.action=none
persist.vendor.cbd.modem.bootmode=
persist.vendor.modem.recovery.enabled=0
persist.vendor.radio.no_modem_board=0
persist.vendor.sys.modem.logging.enable=false
vendor.sys.modem.logging.enable=false
# persist.vendor.modem.baseband.version is set at start from the firmware's
# TOC (profiles/modem.conf); rfsd clears NV if it differs from the TOC, so
# the profile refuses a per-phone value that differs. Per phone, never here:
# /var/lib/omamobile-vendor/modem/props.conf holds ro.boot.cdt_hwid (and
# persist.vendor.modem.cdt_hwid), copied from this phone's stock getprop.
# REQUIRED (0.1.4): without it cbd hands the CP no board id and the modem's
# firmware hangs after INIT_END (MODEM-PLAN M4.1g/M4.1h); the profile's
# check refuses to start without it.
