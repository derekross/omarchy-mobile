# SPDX-License-Identifier: MIT
# libcamera's global configuration for the OnePlus 7T Pro (installed as
# /usr/share/libcamera/configuration.yaml; /etc/libcamera/configuration.yaml
# or the user's ~/.config/libcamera/configuration.yaml replaces it whole).
# The software ISP runs on the GPU (Adreno 640): about 60 fps for the main
# camera's 1992x1500 preview, with noise reduction, sharpening and shading
# correction, which the CPU path lacks. It needs a kernel without
# CONFIG_DMABUF_DEBUG: with it, msm maps imported dma-bufs from scrambled
# page links and the GPU draws nothing (all-zero frames; CAMERA-PLAN C9).
# On such a kernel, set mode: cpu here (or in /etc) for working frames.
---
version: 1
configuration:
  software_isp:
    mode: gpu
