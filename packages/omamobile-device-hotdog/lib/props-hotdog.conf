# SPDX-License-Identifier: MIT
# The OnePlus 7T Pro's properties for the fingerprint chroot, applied after
# the image's build.prop files: what Android's init and OnePlus's init
# scripts would have set from the bootloader. THEORETICAL.
#
# Every value below is a PLACEHOLDER to confirm against the owner's image
# (vendor/build.prop, vendor/etc/init/*.rc, the HAL's strings) before the
# plan's HAL step. Never put the phone's serial or any identifier here: the
# repository is public.
ro.hardware=qcom
ro.boot.hardware=qcom
ro.board.platform=msmnile
ro.product.device=OnePlus7TPro
ro.vendor.product.device=OnePlus7TPro
# OnePlus's HAL picks its sensor vendor from properties like these (names
# UNVERIFIED; stock set them from the fingerprint_detect ID pins at boot):
#persist.vendor.sys.fp.vendor=goodix
#vendor.sys.fp.vendor=goodix
# Set by qseecomd once its listeners are registered; never preset here:
#vendor.sys.listeners.registered=true
