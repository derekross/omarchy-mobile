# OnePlus 7T Pro microphones (device/hotdog/MIC-PLAN.md): capture at S16LE.
# Asked for S24_LE on the MultiMedia2 capture PCM, the ADSP hands back the
# 16-bit SLIMbus samples left-justified in 32-bit words (an S32 layout), so
# a 24-bit reader gets noise at full scale. S16_LE records cleanly.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
