# OnePlus 7T Pro: GeoClue's modem GPS source asks ModemManager for the
# modem's NMEA, but this modem sends only Qualcomm's $PQ sentences, so the
# source never yields a position and would keep the GNSS engine running for
# nothing. Positions come through omamobile-gnss's NMEA socket instead
# (omamobile-gnss-qmi-loc).
[modem-gps]
enable=false
