# OnePlus 7T Pro (hotdog): MultiMedia1 -> ADSP -> quaternary MI2S -> two
# TFA9874 amplifiers (earpiece = left channel, bottom speaker = right).
# The amplifiers have no volume control; PipeWire uses software volume.
#
# Microphones (device/hotdog/MIC-PLAN.md): WCD9340 AMIC -> ADC -> DEC0 ->
# SLIM TX0 -> AIF1_CAP -> SLIMBUS_0_TX -> ADSP -> MultiMedia2 (PCM 1). The
# capture half applies only when the codec is there (the mic overlay and its
# modules); without it the speakers' verb works as before.

SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speakers (earpiece and bottom)"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

If.mic {
	Condition {
		Type ControlExists
		Control "name='AIF1_CAP Mixer SLIM TX0'"
	}
	True {
		SectionVerb {
			EnableSequence [
				cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
				cset "name='AIF1_CAP Mixer SLIM TX0' 1"
				cset "name='CDC_IF TX0 MUX' DEC0"
				cset "name='ADC MUX0' AMIC"
			]
			DisableSequence [
				cset "name='AMIC MUX0' ZERO"
				cset "name='AIF1_CAP Mixer SLIM TX0' 0"
				cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
			]
		}

		# AMIC4: stock's "handset-mic", the voice microphone. Gains are
		# stock's defaults: ADC 12, and DEC 84, which is 0 dB here too
		# (the control counts from its -84 dB minimum; 0 mutes).
		SectionDevice."Mic1" {
			Comment "Voice microphone"

			ConflictingDevice [
				"Mic2"
			]

			EnableSequence [
				cset "name='AMIC4_5 SEL' AMIC4"
				cset "name='AMIC MUX0' ADC4"
				cset "name='ADC4 Volume' 12"
				cset "name='DEC0 Volume' 84"
			]

			DisableSequence [
				cset "name='AMIC MUX0' ZERO"
			]

			Value {
				CapturePriority 100
				CapturePCM "hw:${CardId},1"
				CaptureMixerElem "ADC4"
			}
		}

		# AMIC3: stock's "handset-mic-rec", the recording microphone.
		SectionDevice."Mic2" {
			Comment "Recording microphone"

			ConflictingDevice [
				"Mic1"
			]

			EnableSequence [
				cset "name='AMIC MUX0' ADC3"
				cset "name='ADC3 Volume' 12"
				cset "name='DEC0 Volume' 84"
			]

			DisableSequence [
				cset "name='AMIC MUX0' ZERO"
			]

			Value {
				CapturePriority 90
				CapturePCM "hw:${CardId},1"
				CaptureMixerElem "ADC3"
			}
		}
	}
}
