# SPDX-License-Identifier: MIT
# OnePlus 7T Pro: the modem reads its EFS through rmtfs and its carrier
# configurations through tqftpserv while it comes up, so ModemManager probes
# it only once both serve (device/hotdog/MODEM-PLAN.md).
[Unit]
Wants=omamobile-rmtfs.service omamobile-tqftpserv.service
After=omamobile-rmtfs.service omamobile-tqftpserv.service

# Across suspend ModemManager keeps the modem and puts it in terse mode (no
# unsolicited registration or signal reports, calls and texts still come),
# rather than removing it at sleep and probing it again at resume: the modem
# stays up while the phone sleeps, and the call or SMS that wakes the phone
# must find it there (device/hotdog/SUSPEND-PLAN.md S5).
[Service]
ExecStart=
ExecStart=/usr/bin/ModemManager --test-quick-suspend-resume
