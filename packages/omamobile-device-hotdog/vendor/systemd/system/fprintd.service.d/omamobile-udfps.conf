# libfprint's omamobile_udfps driver finds the sensor through this variable:
# the socket of omamobile-fp-hotdog-bridge (omamobile-fp-hotdog.service). It
# connects when the device is opened, so fprintd may start first. Without
# the bridge running, the device does not open and the lock falls back to
# the password.
[Service]
Environment=FP_OMAMOBILE_UDFPS=/run/omamobile-fp/sock/bridge.sock
