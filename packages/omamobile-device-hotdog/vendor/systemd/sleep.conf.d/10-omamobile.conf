# SPDX-License-Identifier: MIT
# OnePlus 7T Pro: suspend is suspend-to-idle, the only state the kernel offers
# here (the firmware's PSCI has no SYSTEM_SUSPEND), named so a later kernel
# can't pick another. There is no swap to hibernate to
# (device/hotdog/SUSPEND-PLAN.md).
[Sleep]
MemorySleepMode=s2idle
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
