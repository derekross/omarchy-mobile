# The shell and onboarding find the fingerprint stack by its runner. This
# phone's is omamobile-fp-hotdog-chroot, not the Pixels' omamobile-fp-chroot,
# so without these the shell takes the stack for absent: when the bridge
# starts after the shell, the shell never reads its state file, draws no
# glyph and no white disc, and the optical sensor sees an unlit finger.
# Read when the user's session starts.
OMAMOBILE_FP_RUNNER=/usr/lib/omamobile-fp-hotdog/omamobile-fp-hotdog-chroot
OMAMOBILE_FP_IMAGE=/usr/lib/omamobile-fp-hotdog/root
