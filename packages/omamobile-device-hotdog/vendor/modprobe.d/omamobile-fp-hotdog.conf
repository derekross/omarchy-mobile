# The fingerprint stack's /dev/qseecom (device/hotdog/FINGERPRINT-PLAN.md).
# Only the Goodix trusted app and keymaster (whose Gatekeeper signs the
# enrollment tokens) may be loaded or bound, and only the listeners
# qseecomd needs for them may register: 0xa file system, 0xb time, 0x7000
# GP file system, 0x1100 request cancel, 0x9000 QISL, 0x3000 SSD, 0x2000
# RPMB. The RPMB listener stays refused all the same: allow_rpmb is off
# here, and only the owner's opt-in turns it on, together with the
# runner's consent file (omamobile-fp-hotdog-chroot rpmb allow, which
# writes /etc/modprobe.d/omamobile-fp-hotdog-rpmb.conf). Every partition
# stays read-only.
options qcom_qseecom_compat app_allowlist=gfp9558,keymaster64 listener_allowlist=0xa,0xb,0x7000,0x1100,0x9000,0x3000,0x2000
# Mainline's QTEE driver would take smcinvoke, which this stack leaves alone
blacklist qcomtee
