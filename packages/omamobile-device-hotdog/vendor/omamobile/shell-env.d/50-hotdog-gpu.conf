# The Omarchy shell's own environment (omamobile-omarchy's patch 0034 reads
# this for the shell process alone; without it the file does nothing).
#
# freedreno renders the shell straight to memory instead of through GMEM
# tiles. Through GMEM the Adreno 640 faulted (gpu fault ... TRANSLATION,
# source=CCU: the colour cache read just before a render target), Qt lost
# the shell's GL context every few minutes, and after one burst the home
# screen and bar stopped drawing for 18 hours while taps still worked:
# swipes looked dead and the battery and clock stale. With this, 33 minutes
# of use had no fault (2026-11-20). Apps keep GMEM.
FD_MESA_DEBUG=sysmem
