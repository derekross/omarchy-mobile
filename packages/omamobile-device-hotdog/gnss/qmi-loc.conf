# OnePlus 7T Pro: GNSS is the modem's engine, through QMI LOC
# (omamobile-gnss-qmi-loc, package omamobile-gnss). This file's presence
# selects that path for the Location switch.
#
# The phone's EFS still holds the engine lock that Android's Location
# setting left (both lock clients set), and a locked engine refuses every
# session. Clearing it is a write to the modem's EFS, which rmtfs -r keeps
# in RAM (omamobile-rmtfs.service): nothing reaches modemst1/2, and the lock
# is back at the next modem start, so it is cleared at each session start.
ENGINE_UNLOCK=1
