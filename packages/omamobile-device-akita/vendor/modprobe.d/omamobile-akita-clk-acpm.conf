# SPDX-License-Identifier: MIT
# GPU DVFS top level through the ACPM clocks: 890 MHz, the Pixel 8a's own
# stock top (gpu_dvfs_max_freq, the same as the Pixel 8 Pro's), under the GPU
# thermal zone's throttle (device/akita/BRINGUP-M5.md, M5.4). Without it the
# GPU stays at the bootloader's 150 MHz. A kernel without the zuma clk-acpm
# variant ignores the unknown parameter.
options clk_acpm zuma_gpu_max_khz=890000
