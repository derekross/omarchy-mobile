# GPU DVFS top level through the ACPM clocks: 723 MHz, the highest GPU cap
# in the Pixel 8a's battery current limiter (vdroop1 in Google's
# zuma-akita-bcl.dtsi; batoilo and smpl_gm cap it at 649, vdroop2 at 580).
# With no BCL driver nothing runs above stock's caps, so this is below
# stock's DVFS top of 890 MHz, and below the Pixel 8 Pro's setting
# (device/akita/BRINGUP-M5.md, M5.4). The kernel's device tree holds the
# same limit. Without this file the GPU stays at the bootloader's 150 MHz;
# a kernel without the zuma clk-acpm variant ignores the parameter.
options clk_acpm zuma_gpu_max_khz=723000
