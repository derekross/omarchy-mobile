# SPDX-License-Identifier: MIT
# MAX77759 on the Pixel 8a, as on the Pixel 8 Pro (device/akita/BRINGUP-M4.md).
# Binding the PMIC (0x66) also creates its charger, GPIO and NVMEM cells, and
# the charger driver programs the charge limits from the battery node, so none
# of the cell drivers may load on their own: the charger runs only under
# tools/husky-deadman. The fuel gauge (max17042_battery) and the MFD core
# (max77759) still autoload. tcpci_maxim would take over the USB-C port we use
# for SSH: it waits for a Type-C step.
blacklist max77759_charger
blacklist tcpci_maxim
blacklist gpio_max77759
blacklist nvmem_max77759
