# SPDX-License-Identifier: MIT
# Property overrides for the fingerprint chroot, applied after the image's
# build.prop files (omamobile-fp-chroot). Installed as
# /usr/lib/omamobile-fp/props.conf; per-phone tweaks go in
# /var/lib/omamobile-fp/props.conf, which is applied last.

# Our client (the bridge) lights the sensor through the panel driver's
# local_hbm_mode, so the HAL reports halControlsIllumination=false and never
# looks for Google's display HAL.
persist.vendor.udfps.lhbm_controlled_in_hal_supported=false
persist.vendor.udfps.set_lhbm_in_advance=false

# No ambient light sensor service: without this the HAL waits for one.
persist.vendor.udfps.als_feed_forward_supported=false
persist.vendor.udfps.sensor_listener_supported=false
persist.vendor.udfps.listening_lptw_sensor_supported=false

# Touch reaches the HAL through the client's onPointerDown/onPointerUp, not
# through fps_touch_handler (as on stock cheetah).
persist.vendor.udfps.fps_touch_handler_supported=false

# What Android's init would have set from the bootloader: the build type
# here, the phone's own in props-cheetah.conf or props-tegu.conf.
ro.build.type=user
