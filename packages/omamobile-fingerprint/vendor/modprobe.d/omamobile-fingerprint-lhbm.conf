# The under-display fingerprint sensor needs the panel's local high
# brightness mode (LHBM): a bright circle over the sensor while a finger is
# on it. The panel drivers refuse LHBM unless allow_lhbm is set; only
# omamobile-fp-bridge turns it on, during a touch on the sensor, and the
# panel driver turns it off again after at most 3 s
# (device/cheetah/FINGERPRINT-PLAN.md F7; the Pixel 9a's panel in
# device/tegu/FINGERPRINT-PLAN.md F6c-F10; the Pixel 7's panel in
# device/panther/FINGERPRINT-PLAN.md section 4).
options panel_samsung_s6e3hc4 allow_lhbm=1
options panel_google_tg4c allow_lhbm=1
options panel_samsung_s6e3fc3 allow_lhbm=1
