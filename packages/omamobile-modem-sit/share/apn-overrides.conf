# Carriers the system's carrier database (mobile-broadband-provider-info)
# gets wrong for a phone, by the SIM's home network code (MCC/MNC). sitd
# reads this before the database when a [network] value is auto or empty; a
# value in /etc/omamobile/modem-sit.conf always wins over both.
#
# One section per network code, with the keys of modem-sit.conf [network]
# and the same meaning: apn (the internet APN, required), attach_apn (the
# APN the modem registers with when that isn't the internet APN; "none":
# no attach APN is sent and the modem attaches with its carrier profile),
# ims_apn, ims_first (yes/no), internet_cid (1..15, not 2), and the
# modem-managed data profiles as profile_<ID> = the [profiles] line
# ("APN; types=...; ip=...; roaming_ip=..."). "like = MCC/MNC" takes another
# section's values (the section's own keys win), so a carrier's codes are
# listed once. Every entry names its source: the carrier's own public page,
# or our own capture on a phone; add codes only with one. Carriers not
# listed get the database's APNs, with the internet APN as the attach APN
# unless the database types one "ia".

# Verizon, and the resellers on its network whose SIMs carry Verizon's codes.
# The database lists "vzwims" first among Verizon's internet APNs; Verizon's
# own page gives VZWINTERNET for internet access (VZWIMS is for messaging):
# https://www.verizon.com/support/knowledge-base-240220/
# The rest is what registered IMS and carried calls and texts on a Pixel 7
# Pro with a reseller SIM on this network on 2026-11-03
# (device/cheetah/NOTES.md, IMS-SHANNON.md sections 11 and 12), as stock's
# RIL does it: no initial attach APN (the modem attaches with its carrier
# profile; its attach bearer, listed with the network's P-CSCFs, carries
# IMS), the IMS bearer first on CID 2 and the internet on CID 3 (CID 1 is
# the modem's attach context), and stock's four data profiles. An earlier
# entry here gave "vzwims" as the attach APN from the 2026-11-02 captures;
# that registered, but IMS never did (the attach replaced the carrier
# profile's attach and its P-CSCF request).
# The codes are the database's own list for Verizon.
[311/480]
name = Verizon
apn = VZWINTERNET
attach_apn = none
ims_apn = IMS
ims_first = yes
internet_cid = 3
profile_0 = VZWINTERNET; types=default,supl,dun; ip=ipv4v6
profile_2 = IMS; types=ia,ims; ip=ipv4v6; roaming_ip=ipv6
profile_3 = VZWADMIN; types=fota
profile_4 = VZWAPP; types=cbs,mms

[310/010]
like = 311/480

[310/011]
like = 311/480

[310/012]
like = 311/480

