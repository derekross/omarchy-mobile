# Carriers the system's carrier database (mobile-broadband-provider-info)
# gets wrong for a phone, by the SIM's home network code (MCC/MNC). sitd
# reads this before the database when [network] apn is auto or empty; a
# value in /etc/omamobile/modem-sit.conf always wins over both.
#
# One section per network code: apn (the internet APN), and optionally
# attach_apn (the APN the modem registers with, when that isn't the internet
# APN), ims_apn and name. Every entry names its source: the carrier's own
# public page, or our own capture on a phone; add codes only with one.
# Carriers not listed get the database's APNs, with the internet APN as the
# attach APN unless the database types one "ia".

# Verizon, and the resellers on its network whose SIMs carry Verizon's codes.
# The database lists "vzwims" first among Verizon's internet APNs; Verizon's
# own page gives VZWINTERNET for internet access (VZWIMS is for messaging):
# https://www.verizon.com/support/knowledge-base-240220/
# The attach APN is the IMS APN: on 2026-11-02 a SIM on this network never
# registered with vzwinternet as attach APN and registered within 34 s with
# "ims" (our capture on the Pixel 7 Pro, MODEM-PLAN M4).
# The codes are the database's own list for Verizon.
[310/010]
name = Verizon
apn = vzwinternet
attach_apn = ims

[310/011]
name = Verizon
apn = vzwinternet
attach_apn = ims

