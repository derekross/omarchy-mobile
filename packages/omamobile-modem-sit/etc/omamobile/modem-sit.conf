# omamobile-sitd settings (device/cheetah/MODEM-CLIENT.md). Changes apply at
# the next start of omamobile-sitd, which needs a fresh CP: reboot.

[network]
# The carrier's internet APN, as the carrier publishes it. Required: without
# it the start-up stops before the radio is switched on.
apn =
# The APN of the initial LTE attach, if the carrier attaches on another APN
# than its internet APN (some attach only on their IMS APN, e.g. "ims"; the
# internet bearer still uses apn). Empty: the same as apn.
# none: no initial attach APN is sent at all, and the modem attaches with
# its carrier profile's own settings (carrier_manifest below), as stock does
# on a Verizon network. Its attach bearer, listed with the network's P-CSCF
# addresses, then carries IMS: no IMS bearer of our own is set up, and the
# attach bearer is never released by the RIL. If none is listed within 20 s
# of registration, the RIL sets up its own IMS bearer on ims_apn as usual.
# Without an initial attach APN some modems refuse data setups (status 36):
# use none only with the carrier's manifest.
# The attach APN, the data profiles ([profiles] below) and the NR mode are
# sent before the radio is switched on, or with it on if it already is: the
# radio is never cycled.
attach_apn =
# The internet bearer's IP type: ipv4v6, ipv4 or ipv6. The cellular route
# (omamobile-sit-data) is IPv4 only for now.
ip_type = ipv4v6
# IMS (VoLTE calls and SMS over IMS). The IMS APN is "ims" on most carriers.
ims = yes
ims_apn = ims
# If IMS doesn't register within ims_timeout seconds (the IMS values were
# proven on one carrier only), the RIL keeps serving the internet bearer
# without SMS or calls. ims_required = yes ends start-up instead.
ims_required = no
ims_timeout = 120
# The IMS registration needs a P-CSCF from the IMS bearer. "no" registers
# without one when the bearer carries none, leaving it to the modem's IMS
# stack (some networks keep it on the ISIM, not in the bearer).
ims_pcscf_required = yes
# When the IMS bearer carries no P-CSCF, read it from the ISIM's EF_PCSCF
# (one read-only file; nothing else on the ISIM is read), as stock does.
# A name there is resolved to IPv6 over the IMS bearer, else through the
# host's resolver.
ims_pcscf_from_isim = yes
# ims_first = yes sets the IMS bearer up (and announces it) before the
# internet bearer, as stock does; no keeps today's order. internet_cid is the
# CID of sitd's internet bearer (IMS is always 2). Stock keeps CID 1 for the
# modem's attach context and never sets a bearer up there; on a network that
# attaches on the IMS APN, use 3 (and ims_first = yes) so the attach PDN
# keeps its P-CSCF.
ims_first = no
internet_cid = 1
# The modem's carrier profile: the 40-character cfg.db manifest ID for this
# SIM's carrier (a file name under the modem chroot's
# /vendor/firmware/carrierconfig/manifests). Set, it answers the modem's
# request for a carrier config once, and the IMS stack start waits up to
# carrier_manifest_timeout seconds for the modem's answer. Empty: not sent.
carrier_manifest =
carrier_manifest_timeout = 60
# nr = off keeps the modem on LTE (NR mode byte 3 -> 0; the original is kept
# in RAM), set before the radio is switched on. On this phone NR registered
# but carried no traffic. "on" leaves the modem's own setting alone.
nr = off
# Seconds to wait for the SIM, then for packet registration.
sim_timeout = 120
register_timeout = 180

[profiles]
# Extra data profiles the modem manages itself (SET_DATA_PROFILE), sent with
# the attach APN before the radio is switched on, as stock sends its
# carrier's "modem-cognitive" APNs. Empty (the default): only profile 0, the
# internet APN above. One line per profile:
#
#   ID = APN; types=TYPE,TYPE; ip=IP; roaming_ip=IP
#
# ID: 0 default/internet (replaces the one made from apn; the internet
#   bearer still uses apn), 2 IMS, 3 FOTA, 4 CBS (1 tethered, 1000 and up
#   OEM).
# types (required): default, mms, supl, dun, hipri, fota, ims, cbs, ia,
#   emergency, mcx, xcap.
# ip: ipv4v6 (default), ipv4 or ipv6; roaming_ip: the same choices, default ip.
# No authentication. Each profile gets stock's limits: 20 connections in
# 300 s, no wait, enabled, any bearer.
#
# Example, a Verizon-network SIM (Verizon and the carriers on its network),
# as stock sets it up. In [network] above:
#   apn = VZWINTERNET
#   attach_apn = none
#   ims_apn = IMS
#   carrier_manifest = <the 40-character manifest ID for this SIM's carrier,
#                       chosen by the phone's owner>
# and these profiles (stock's profile IDs: internet 0, IMS 2):
#   0 = VZWINTERNET; types=default,supl,dun; ip=ipv4v6
#   2 = IMS; types=ia,ims; ip=ipv4v6; roaming_ip=ipv6
#   3 = VZWADMIN; types=fota
#   4 = VZWAPP; types=cbs,mms

[data]
# Reserved: the route's metric is fixed at 700 (Wi-Fi's default is 600).
metric = 700

[control]
# Members of this group may use the calls/SMS socket (root always can).
group = wheel

[audio]
# The AoC sound card for call audio: "none" connects calls without routing
# any audio; "auto" finds the AoC card in /proc/asound/cards. With a card
# and earpiece = yes, each call runs in the protection service's earpiece
# mode (omamobile-speaker-protection earpiece on: the top amplifier alone
# at 657/6, the bottom muted) and audio is refused unless the service
# reports that mode; with earpiece = no, refused unless the service runs at
# stage media or c8 with the top amplifier at analog 6 or less and both
# within the media stage's ceilings (digital 737, analog 10).
card = none
earpiece = yes
# Microphone gain above stock's 130 cB during calls: 6 (default, judged
# louder and clean in calls on this phone) or 0 (stock).
mic_boost_db = 6
