# SPDX-License-Identifier: MIT
# omamobile-sitd settings (device/cheetah/MODEM-CLIENT.md). Changes apply at
# the next start of omamobile-sitd, which needs a fresh CP: reboot.

[network]
# The carrier's internet APN, as the carrier publishes it. Required: without
# it the start-up stops before the radio is switched on.
apn =
# The internet bearer's IP type: ipv4v6, ipv4 or ipv6. The network may still
# answer with less (an IPv6-only bearer is common); [data] below covers it.
ip_type = ipv4v6
# IMS (VoLTE calls and SMS over IMS). The IMS APN is "ims" on most carriers.
ims = yes
ims_apn = ims
# If IMS doesn't register within ims_timeout seconds (the IMS values were
# proven on one carrier only), the RIL keeps serving the internet bearer
# without SMS or calls. ims_required = yes ends start-up instead.
ims_required = no
ims_timeout = 120
# nr = off keeps the modem on LTE (NR mode byte 3 -> 0; the original is kept
# in RAM). On this phone NR registered but carried no traffic. "on" leaves
# the modem's own setting alone.
nr = off
# Seconds to wait for the SIM, then for packet registration.
sim_timeout = 120
register_timeout = 180

[data]
# Reserved: the routes' metric is fixed at 700 (Wi-Fi's default is 600).
metric = 700
# IPv6 on rmnet0: the network's interface identifier, SLAAC from its router
# advertisements (up to ra_timeout seconds) or the setup response's global
# address, and an IPv6 default route behind Wi-Fi's.
ipv6 = yes
ra_timeout = 10
# CLAT (464XLAT) for an IPv6-only bearer, so IPv4 addresses and IPv4-only
# programs work through the carrier's NAT64: "auto" (needs the tayga package)
# or "off". The NAT64 prefix is asked from the carrier's DNS64 (RFC 7050)
# unless clat_prefix names one, for example 64:ff9b::/96.
clat = auto
clat_prefix =

[ims]
# The carrier's IMS values. The defaults are the ones that registered IMS
# (calls and SMS) on a T-Mobile-network MVNO; another carrier may need others
# (MODEM-CLIENT 1.4). Changes apply at the next start-up (a reboot).
# Hidden-menu items, TAG:VALUE (32-bit), sent in this order:
hidden_menu = 523:30 527:30 529:30 531:30 533:30
# AIMS_ADD_PDN_INFO's ten flag fields (the seventh is 16-bit: the offered
# services, 35 = voice, SMS and mobile):
add_pdn_flags = 17 0 0 1 0 0 35 0 0 1
# Per-network profiles, kept on this phone only (they name a network):
# <profile_dir>/<MCC><MNC>.conf with an [ims] section and the same keys
# replaces the values above while registered on that network.
profile_dir = /etc/omamobile/ims.d

[control]
# Members of this group may use the calls/SMS socket (root always can).
group = wheel

[audio]
# The AoC sound card for call audio: "none" (the default until the earpiece
# mode exists, MODEM-PLAN M5) connects calls without routing any audio;
# "auto" finds the AoC card in /proc/asound/cards. With a card, call audio
# is refused unless speaker protection runs at stage media or c8 with the
# top amplifier (the earpiece) at analog 6 or less and both within the
# media stage's ceilings (digital 737, analog 10).
card = none
# Microphone gain above stock's 130 cB during calls: 6 (default, judged
# louder and clean in calls on this phone) or 0 (stock).
mic_boost_db = 6

[trace]
# A scrubbed record of the SIT traffic for offline fixtures: message IDs,
# lengths, error and status codes, and for a few messages without any
# identifier the byte shape (zero or not). Never a payload value. Off by
# default; the files stay on this phone (directory below, root only).
record = no
directory = /var/lib/omamobile-sit/trace
max_bytes = 4194304
