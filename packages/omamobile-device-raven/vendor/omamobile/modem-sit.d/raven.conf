# Raven's defaults for omamobile-modem-sit (read before
# /etc/omamobile/modem-sit*.conf, which overrides them; device/raven/
# MODEM-PLAN.md). The modem's physical SIM slots in GET_SLOT_STATUS order:
# 0 is the tray, 1 the eSIM, so the shell names the SIMs "SIM 1 (tray)" and
# "SIM 2 (eSIM)". Both run at once (two stacks, one sitd each); the radio is
# driven through SIT (stock's order; AT+CFUN left the S5123 idle); IMS is off
# (the network refused raven's IMS bearer with 2253), so calls and texts use
# CS.
[network]
slot_names = tray, eSIM
stacks = 2
radio = sit
ims = no
