# Raven's sitd waits for the CP, as the Pixel 7 Pro's does (device-cheetah's
# drop-in of the same name). omamobile-modem.service is ready once CPIF's
# ports exist, before cbd has booted the CP (about 3 s more on raven), and a
# sitd started on that alone exits ("CP is not ONLINE": at every raven boot
# with the modem enabled, 2026-11-04). 120 s is the profile's own cbd
# timeout: a CP that never comes up fails sitd here, and the data fallback
# and the Phone and Messages bridge, ordered after it, stay down until the
# reboot.
[Service]
ExecStartPre=/usr/lib/omamobile-vendor/omamobile-modem-cp wait-online 120
