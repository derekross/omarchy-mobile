# Omarchy Mobile: if shutdown hangs (a driver stuck in remove(), say), let the
# hardware watchdog reset the phone after a minute instead of leaving it
# on the shutdown splash until someone holds Power. systemd's default is
# 10 minutes. Nothing holds the watchdog while the system runs.
[Manager]
RebootWatchdogSec=1min
