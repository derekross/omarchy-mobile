# The journal on a phone: 1 GiB at most. systemd's default (10% of the
# file system, up to 4 GiB) let a dead modem link's kernel message flood
# fill 3.3 GiB in three hours, and journald spent 70% of a CPU writing it.
# Vacuuming that much also pushed out how the failure started.
[Journal]
SystemMaxUse=1G
SystemMaxFileSize=64M
RuntimeMaxUse=128M
