# The firmware advertises PSCI SYSTEM_SUSPEND, so the kernel offers "deep"
# sleep, but Linux has no gs101 SoC sleep sequence yet: entering it without
# one doesn't wake. Suspend means suspend-to-idle until SYS_SLEEP exists
# (device/raven/SUSPEND-PLAN.md). There is no swap to hibernate to.
[Sleep]
MemorySleepMode=s2idle
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
