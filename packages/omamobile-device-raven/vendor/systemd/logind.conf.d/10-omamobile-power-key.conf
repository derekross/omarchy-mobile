# Omarchy Mobile: a short press of the power button opens Omarchy's system menu
# (bound in Hyprland by the shell, hypr/phone.lua), as Super + Escape does, instead
# of powering off. A long press still forces a reset in the PMIC hardware.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
