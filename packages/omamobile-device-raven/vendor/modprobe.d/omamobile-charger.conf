# Charging policy for max77759_charger, loaded at boot since
# device/raven/USB-PLAN.md C2 and C3 passed (2026-10-28), as on cheetah
# (omamobile-device-cheetah's file of the same name). Both options belong
# together:
# - default_ilim_ua: without a Type-C source (tcpci_maxim stays blacklisted)
#   the upstream driver turns charging off at probe; this keeps it on at a
#   500 mA input limit instead. On a wall charger the chip still sets the
#   input itself (NO_AUTOIBUS stays clear): 1.2-1.4 A into the battery in C2;
# - temp_guard: stock's step-charging bands from the gauge's temperature
#   and voltage, every 30 s; no reading or out of range stops charging.
# The float voltage (4.45 V) and fast charge current (1.47 A) come from the
# battery node in raven's device tree.
# The gauge loads first, so the guard's first reading succeeds.
options max77759_charger default_ilim_ua=500000 temp_guard=1
softdep max77759_charger pre: max17042_battery
