# SPDX-License-Identifier: MIT
# The modem (S5123) is bring-up only (device/raven/MODEM-PLAN.md): its PCIe
# driver and Google's CPIF never load at boot, even when a bring-up overlay
# enables the device tree nodes they match. Each step loads them by hand,
# the PCIe driver with allow_hw=1, under the plan's runbook.
blacklist pcie_gs201_cp
blacklist cpif
blacklist shm_ipc
blacklist boot_device_spi
