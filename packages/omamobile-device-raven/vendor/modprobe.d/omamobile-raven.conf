# Raven bring-up: modules udev must not autoload from the DT (load by hand
# per device/raven/BRINGUP-M1.md until each has passed on the phone).
#
# The MAX77759: init loads its core, nvmem and nvmem-reboot-mode itself
# (INITRAMFS_MODULES). Its charger turns charging off at probe (cheetah's
# omamobile-max77759.conf); its TCPC driver would take over the USB-C port
# and the role and orientation of the USB link we run on.
blacklist max77759_charger
blacklist tcpci_maxim
blacklist gpio_max77759
# The Mali-G78 (panfrost) loads at boot: it needs the AArch64 page-table
# quirk (kernel omamobile-raven-gpu) and Mesa with the G78 entry
# (packages/mesa 0003).
# Wi-Fi PCIe (WIFI-PLAN): the controller, PHY and brcmfmac load at boot
# (W3/W4 passed). The SysMMU DMA-window helper is not used: brcmfmac's
# buffers come from the restricted DMA pool.
blacklist pcie_gs201_sysmmu
# The display (DISPLAY-PLAN.md): gs-decon takes the screen over from
# simpledrm at boot (D3 passed once the panel rails stayed on), at up to
# 120 Hz (D6 passed).
# The DSIM command path loads at boot and may send DCS to the S6E3HC3:
# brightness and display on/off (passed on the phone 2026-10-15).
options gs_dsim_cmd allow_tx=1
# Bluetooth (BLUETOOTH-PLAN.md): the BCM4389C1 never answers a Write RAM
# record (the stock HAL's fast download), so stream the patch and wait only
# for Launch RAM.
options btbcm patchram_nowait=1
