# Limit this UCM playback route to -24 dBFS at full-scale input.
# The amplifiers lack speaker protection. Direct hardware PCM bypasses this.
pcm.hotdogb_speaker {
	@args [ CARD ]
	@args.CARD { type string default "0" }
	type route
	slave {
		pcm { type hw card $CARD device 0 }
		format S16_LE
		channels 2
	}
	ttable.0.0 0.063
	ttable.1.1 0.063
	hint.show off
}
