# SPDX-License-Identifier: MIT
# OnePlus 7T routes, after the 7T Pro (hotdog) profile by Robin Snyders
# (github.com/Sr-0w/hotdog-linux-bringup, device-oneplus-hotdog/HiFi.conf).
#
# Playback is MultiMedia1 on PCM 0, capture is MultiMedia2 on PCM 1. Each
# front end is joined to its back end in the verb, not the device: a sound
# server probes the PCMs before it applies any device sequence, and an
# unrouted Q6 front end fails to open ("no backend DAIs enabled").
#
# Speaker: S16_LE stereo at 48 kHz on QUAT MI2S SD1; left goes to 0x34 (the
# top earpiece, run as a speaker as in OxygenOS), right to 0x35 (bottom).
# Neither the Q6 routing nor the amplifier driver has a volume control, so
# the sound server's software volume is the only level, under the fixed cap of
# hotdogb_speaker (cap.conf). There is no speaker protection
# (OxygenOS runs NXP's algorithm on the ADSP with the amplifiers' current/voltage sense).
#
# Capture: the handset microphone on the AMIC4 pad (needs MIC BIAS1),
# selected on the shared AMIC4_5 mux, into ADC4, decimator 0 and SLIM TX0.

SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='AMIC4_5 SEL' AMIC4"
		cset "name='CDC_IF TX0 MUX' DEC0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='CDC_IF TX0 MUX' ZERO"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speakers"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hotdogb_speaker:${CardId}"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC4"
		cset "name='ADC4 Volume' 20"
		cset "name='DEC0 Volume' 96"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
		cset "name='ADC4 Volume' 0"
		cset "name='DEC0 Volume' 84"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
