# Unsupported sleep modes are disabled. UPower 1.91.5's Auto policy can
# select Ignore when CanSleep is unavailable; keep depletion protection.
# The Pixel 3a's power-off has not been qualified and may restart the phone.
# Until slot B has its CONTRIBUTING.md §3.1 entry, such a restart spends
# one of slot B's three tries, and at critical charge each boot can end in
# another one. With none left the bootloader starts slot A, whose system has
# no root any more; Volume Down + Power, then `fastboot --set-active=b`
# from a charged phone, brings slot B back (device/sargo/NOTES.md).
[UPower]
CriticalPowerAction=PowerOff
