# SPDX-License-Identifier: MIT
# Vendor-chroot profile "gnss-slsi": the Pixel 9a's GNSS HAL, Samsung's
# android.hardware.gnss-service, in front of gnssd (which runs in the modem
# profile once the CP is ONLINE, and listens on the abstract socket
# @GNSSND; abstract sockets are shared because both chroots stay in the
# host's network namespace). omamobile-gnss-client (bionic/gnss-aidl) is the
# HAL's only client: it starts positioning and passes the HAL's NMEA on.
# device/tegu/MODEM-PLAN.md G3.
#
# Output: NMEA on stdout (the unit's journal), or with
# OMAMOBILE_GNSS_NMEA_OUT=fifo on the FIFO /data/vendor/gps/nmea_out, that
# is $STATE/data/vendor/gps/nmea_out on the host, as the cheetah gnss
# profile, for omamobile-gnss-nmea.
# shellcheck shell=bash disable=SC2034

STATE=/var/lib/omamobile-vendor/gnss-slsi
# The HAL is an AIDL service: a private binderfs and servicemanager. Its
# sensor-fusion and telephony lookups are reported absent at once.
BINDER=yes
NO_SERVICES="android.hardware.sensors.,android.frameworks.sensorservice.,vendor.samsung_slsi.telephony."
BINS=(/vendor/bin/hw/android.hardware.gnss-service)
CLIENT=${OMAMOBILE_GNSS_CLIENT:-$LIB/omamobile-gnss-client}
NMEA_OUT=${OMAMOBILE_GNSS_NMEA_OUT:-stdout}

profile_check() {
  local ok=0
  [[ -x $CLIENT ]] || { say "no $CLIENT (make -C packages/omamobile-gnss/bionic)"; ok=1; }
  [[ -f $IMAGE/vendor/bin/hw/android.hardware.gnss-service ]] ||
    { say "no HAL in $IMAGE (tools/extract-vendor-chroot -p gnss-slsi -d tegu)"; ok=1; }
  grep -q '@GNSSND' /proc/net/unix ||
    say "gnssd is not listening on @GNSSND yet (the modem profile with OMAMOBILE_MODEM_GNSS=1)"
  return $ok
}

profile_setup() {
  local gps=$STATE/data/vendor/gps
  mkdir -p "$gps/overlay" "$gps/logs" "$ROOT/omamobile/bin"
  bind "$CLIENT" "$ROOT/omamobile/bin/omamobile-gnss-client" ro
  if [[ $NMEA_OUT == fifo ]]; then
    [[ -p $gps/nmea_out ]] || { rm -f "$gps/nmea_out"; mkfifo -m 0600 "$gps/nmea_out"; }
  fi
}

# The HAL and the client are vendor processes: their libbinder talks to
# /dev/vndbinder, so the image's vndservicemanager serves that context (the
# system servicemanager refuses their vendor-stamped parcels). The HAL
# registers android.hardware.gnss.IGnss/vendor there.
GNSS_SERVICE=${OMAMOBILE_GNSS_SERVICE:-android.hardware.gnss.IGnss/vendor}

profile_start() {
  spawn vndservicemanager vendor /vendor/bin/vndservicemanager /dev/vndbinder
  sleep 1
  spawn hal vendor /vendor/bin/hw/android.hardware.gnss-service
  sleep 3
  if [[ $NMEA_OUT == fifo ]]; then
    spawn client vendor /omamobile/bin/omamobile-gnss-client /data/vendor/gps/nmea_out "$GNSS_SERVICE"
  else
    spawn client vendor /omamobile/bin/omamobile-gnss-client - "$GNSS_SERVICE"
  fi
}
