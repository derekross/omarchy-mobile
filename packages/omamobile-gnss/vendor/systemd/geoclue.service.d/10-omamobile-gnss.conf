# Omarchy Mobile: GeoClue looks up proxies with GLib's built-in resolver.
#
# With glib2 2.90.1 GeoClue's start could stop before it took its bus name,
# and the request that started it failed ("Failed to connect to GeoClue2
# service", after D-Bus's 25 s). Two of its threads take two GLib locks in
# opposite order (GLib issue 4078,
# https://gitlab.gnome.org/GNOME/glib/-/issues/4078):
#
# - the main thread opens a GFile: g_vfs_get_default() holds the VFS's
#   one-time init and waits for GIO's default-modules lock;
# - a pool thread from g_network_monitor_can_reach_async() asks for the
#   default proxy resolver: g_proxy_resolver_get_default() holds the
#   default-modules lock while it creates libproxy's resolver
#   (glib-networking), whose init opens a GFile and so waits for the VFS's
#   one-time init.
#
# With the resolver named here GIO creates its own dummy resolver under that
# lock, which opens no file, so the second half can't happen. Nothing is
# lost: GeoClue turns proxies off for its web lookups itself
# (soup_session_set_proxy_resolver (session, NULL), gclue-web-source.c), so
# the default resolver only served the reachability check and a network NMEA
# source's connection. The issue is closed upstream; this file can go once
# the image's glib2 carries that fix.
[Service]
Environment=GIO_USE_PROXY_RESOLVER=dummy
