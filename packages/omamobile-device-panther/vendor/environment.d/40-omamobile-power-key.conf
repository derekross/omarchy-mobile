# Omarchy Mobile: the power key as Android's (omamobile-keys and
# omamobile-sleepd, packages/omamobile-shell): a dark phone wakes on the
# press, a short press turns the panel off at once and locks behind it.
# The order is the reverse of the shared default's on purpose: the panel
# goes off first and the lock follows behind it, where the default locks
# and then powers the panel off. That is why it stays off on the other
# phones for now; the Pixel 7 turns it on, where it has run. Read when the
# session starts.
OMAMOBILE_POWER_KEY_ANDROID=1
