# Omarchy Mobile: Hyprland holds the last frame across a rotation and turns
# the new one in as Android does (packages/hyprland, 0002). Off by default
# in the shared Hyprland build; the Pixel 7 turns it on, where it has run.
# Read once, when Hyprland starts.
OMAMOBILE_ROTATION_HOLD=1
