# Pixel 7: some units have no speaker.cal in persist (no factory speaker
# calibration), and stock's HAL then runs the protection firmware on its
# tuning's default calibration. OMAMOBILE_SPK_DEFAULT_CAL=1 does the same
# (omamobile-audio 0.5.16; stage c9 and verify stay refused on it). A phone
# that has speaker.cal still uses it. /etc/omamobile/speaker.conf is read
# after this (EnvironmentFile overrides Environment), so a line there turns
# it off again. Evidence: derekross/omarchy-mobile#427 (comment of
# 2026-11-07 16:13 UTC): a start and a playback on 0.5.16 on a Pixel 7
# without speaker.cal.
[Service]
Environment=OMAMOBILE_SPK_DEFAULT_CAL=1
