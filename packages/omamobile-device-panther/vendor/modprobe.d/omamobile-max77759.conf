# MAX77759 modules (device/panther/BATTERY-PLAN.md). The fuel gauge, the MFD
# core and the charger load at boot (omamobile-charger.conf sets the
# charger's policy). tcpci_maxim would take over the USB-C port we use for
# SSH: it waits for the Type-C gate. The GPIO cell drives the external VBUS
# boost and the input switch, and the NVMEM cell has no DT node: neither is
# needed for charging.
blacklist tcpci_maxim
blacklist gpio_max77759
blacklist nvmem_max77759
