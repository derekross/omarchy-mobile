# Fingerprint: omamobile-fp's unit loads goodix_fp and its runner loads sg
# (device/panther/FINGERPRINT-PLAN.md P4, P5).
# - sg: SCSI generic is needed only for the UFS RPMB well-known LUN, but it
#   creates a raw SG_IO node for every LUN, which bypasses the block layer's
#   read-only guard on the calibration partitions. systemd-udevd would load
#   it for every SCSI device.
# - goodix_fp: switches the sensor supply and reset.
# Unlike the 7 Pro's file, Trusty is not blacklisted: there its sound start
# (omamobile-aoc-start) loads it, and this package has none, so with the
# trusty_* lines nothing would create /dev/trusty-ipc-dev0 and omamobile-fp
# would be skipped. Trusty loads from the DT's /trusty node, as on the Pixel 7
# where P5 passed.
blacklist sg
blacklist goodix_fp
