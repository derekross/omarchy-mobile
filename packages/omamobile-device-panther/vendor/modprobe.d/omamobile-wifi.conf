# Wi-Fi is brought up by omamobile-wifi.service (omamobile-wifi-start), which
# loads these explicitly after writing a hang marker, so a bring-up that hangs
# the phone skips Wi-Fi on the next boot. Blacklisting only stops udev from
# autoloading them ahead of that guard; "modprobe pcie_gs201" still works.
blacklist pcie_gs201
blacklist brcmfmac
