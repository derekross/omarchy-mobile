# SPDX-License-Identifier: MIT
# The DSI command host may send to the panel: brightness over DCS 0x51 and
# display off/on. Off by default in the driver; proven on the Pixel 7 in
# device/panther/DISPLAY-PLAN.md gate D2.
options gs_dsim_cmd allow_tx=1
# Screen off sleeps the panel and stops DECON's frames (DISPLAY-PLAN D3d):
# no frames and no memory reads while dark, and the panel in sleep mode.
options gs_decon screen_off=2
