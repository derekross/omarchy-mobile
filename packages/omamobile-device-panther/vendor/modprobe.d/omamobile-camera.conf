# SPDX-License-Identifier: MIT
# The camera drivers don't autoload: omamobile-camera-start (from
# omamobile-camera.timer, 40 s into the boot) loads them in order, and the
# bring-up runbooks (device/cheetah/CAMERA-PLAN.md) load them by hand.
# Explicit modprobe still works.
#
# S2MPG13 GPIOs: binding it lets the fixed camera supplies probe, which
# drives their enable pins low.
blacklist gpio_s2mpg13
# SLG51002 camera PMIC: raises its chip select at probe.
blacklist slg51002_regulator
# Camera module power test driver (debugfs power-up and ID reads).
blacklist gs201_cam_power
# Read-only CSIS power and register probe (no DT node; never autoloads).
blacklist gs201_cam_probe
# Capture path (CAM3b/CAM4): the IMX386 sensor (powers the module at probe
# to read its ID), the DC-PHY receiver and the CSIS link + WDMA driver.
blacklist imx386
blacklist phy_gs201_mipi_dcphy_rx
blacklist gs201_csis
# Main camera and the focus actuators (CAMERA-PLAN.md CAM-M, CAM5.3): the
# Samsung S5KGN1 sensor (powers the module at probe to read its ID; the
# same driver runs the front S5K3J1 and the telephoto S5KGM5, CAM7/CAM-T)
# and the AK7375-type VCM drivers of the main and ultrawide modules.
blacklist s5kgn1
blacklist ak7375
# The telephoto's SEM1215SA focus controller (CAM-T): powers it at probe
# to read the focus calibration, and whenever its subdev is open.
blacklist sem1215
