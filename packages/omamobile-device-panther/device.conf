# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 7 (panther), first light.
#
# Same rules as device/cheetah/device.conf. No shell.

# --- Identity ---
CODENAME=panther
NAME="Pixel 7"
USB_PRODUCT="Pixel 7 (M1)"
SOC=gs201
COMPATIBLE="google,gs201-panther"
# Storage guard and USB networking only (packages/omamobile-device-panther).
# It has no bootctl source, so the initramfs gets the freestanding devmem
# and reboot-to, as on felix.
PACKAGE=omamobile-device-panther

# --- Kernel and device tree ---
DTB=exynos/google/gs201-panther.dtb
# Stock: pkg_mode 0, soc rev 2, soc_id 0x9855001 in the live DT. Built
# value first; the packer rewrites a second copy for A0.
SOC_IDS="b0:0x9855001 a0:0x9855000"
# No DTB_OVERLAYS at first light.

# --- Bootloader glue ---
# ro.boot.dtbo_idx 22, ro.boot.cdt_hwid 0x00030406 00010000.
DTBO_SOURCE=panther-m1-overlay.dts
DTBO_BOARD_ID=0x30406
DTBO_BOARD_REV=0x10000
VENDOR_CMDLINE="console=tty0 earlycon=exynos4210,0x10A00000 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
# Stock CP3A.261005.002.A1, security patch 2026-10-05.
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10
# Stock's vbmeta chains boot (rollback index location 2) and init_boot
# (location 4), as on the Pixel 7 Pro: the factory image's vbmeta.img
# (avbtool info_image). libavb reads a chained partition with no footer as
# invalid metadata, which an unlocked bootloader doesn't let through, so on
# a phone whose vbmeta_b is stock's (a full OTA on both slots, or the
# factory vbmeta on slot B), footer-less slot B images never start: a
# black screen, no USB, and stock recovery on slot A after the retries
# (issue #342). A vbmeta_b that lists them as hash descriptors, or has
# verification disabled (a phone that ran another OS on slot B), never
# reads these footers. Sizes from fastboot getvar partition-size.
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
# Stock CP3A.261005.002.A1's footers, matching OS_PATCH_LEVEL. A pull
# request never raises them: an index the bootloader stores above an older
# stock's would lock that stock's own boot and init_boot out of slot A
# (anti-rollback).
AVB_ROLLBACK_INDEX=1791158400
AVB_SECURITY_PATCH=2026-10-05

# --- Storage guard ---
# All five images exist on slot B (fastboot getvar all). UFS stays
# disabled in the first-light DTS; the guard is packed regardless.
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"

# --- Initramfs ---
# SIMPLEFB_TRIG_CON is DECON0 TRIG_CON, which drives this phone's only
# panel: ABL leaves 0x3070 (trigger masked); 0x3061 unmasks it and the
# Linux console appears (BRINGUP-M1.md, boot 2). No BRINGUP_PROBE: those
# reads were done by hand, one register per call.
INITRAMFS_INIT=/initramfs/init
SIMPLEFB_TRIG_CON="0x1c240030 0x3061"
# Panel, portrait (dumpsys display: 1080x2400). Splash only with "splash"
# on the command line, which this phone's bootargs do not have.
PANEL_SIZE=1080x2400

# --- Radio backup ---
NV_PARTS="efs efs_backup modem_userdata persist modem_a modem_b"
NV_BACKUP_EXTRA="devinfo"
