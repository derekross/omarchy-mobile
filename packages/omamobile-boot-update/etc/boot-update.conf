# omamobile-boot-update (docs/RELEASES.md §5.3). Data, not shell: KEY=value
# lines and comments only; anything else makes the hook refuse.
#
# AUTO_WRITE=yes: after a kernel package update, the pacman hook rebuilds
# this phone's boot images and writes them to slot B (it never reboots).
# AUTO_WRITE=no (the default): the hook leaves slot B alone, as a
# development phone needs, whose kernels come from bin/omamobile push.
# `omamobile-boot-update write` still writes by hand, after asking.
AUTO_WRITE=no
#
# AVB_KEY=/path/to/key.pem: the key for the AVB footers a phone's vbmeta
# chain needs (AVB_FOOTERS in the descriptor). Default: a key made once in
# /var/lib/omamobile/boot/avb/key.pem; an unlocked bootloader accepts any.
